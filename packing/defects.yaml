- id: D-447
  title: The certificate ceiling was written up as a method-wide impossibility
  date: '2026-09-04'
  layer: record
  class: soundness
  direction: conservative
  detected_by: review
  latent_for: >-
    from the ceiling's registration on 2026-09-04 until PR 80's review (its F14) read the
    lemma against the sentences drawn from it the same evening
  severity: low
  what: >-
    The lemma is right: no certificate for n exists at a side above ceil(sqrt(n)) * B, so
    every single certificate on a finite net sits strictly below the grid value. The
    sentences drawn from it in certificate.py's docstring, results.yaml (T-017),
    SYNOPSIS.md and README.md went further -- "no certificate of this shape will ever
    settle n = 12, however fine the net or the site set", "the method can approach the
    grid value and never reach it". That is too strong. A proved family of valid
    certificates with sides tending to 4 would establish s(12) >= 4 by a limit argument
    without any member reaching 4. The ceiling rules out one finite certificate at the
    grid bound; whether a family exists is a question about the covering value, which
    the ceiling says nothing about.
  consequence: >-
    A false claim about the method, in the conservative direction: it understated what
    the method could in principle do, and would have steered a later block away from a
    route the mathematics leaves open. No bound depends on it.
  fix: >-
    Fixed on 2026-09-04 in all four places: the ceiling rules out a single certificate
    at the grid value, and a limiting family is stated as not excluded and as a question
    about the covering value. The reach table's foreclosure column, which reads the same
    lemma, describes single certificates and is unchanged.
  regression: >-
    None automated; the claim is prose about a lemma. The lemma itself is tested in
    test_fractional_certificate.py.
  status: fixed
  recorded_in: packing/src/sqpack/fractional/certificate.py
