- id: D-240
  title: The autonomous-session wall budget could be reset indefinitely
  date: '2026-08-24'
  layer: tooling
  class: robustness
  direction: neutral
  detected_by: review
  latent_for: since AgentSession/v2 introduced phase clocks
  severity: high
  status: fixed
  what: >-
    Agent sessions recorded wall_minutes and per-phase deadlines but no absolute session
    start or deadline. Renewing a phase could therefore reset the only enforced clock,
    and max_cycles was rendered but never checked. The first attempted correction still
    allowed an active session to remain in progress after its absolute deadline and an
    ordinary phase to consume the finalization reserve.
  consequence: >-
    A nominal eight-hour campaign could continue indefinitely through individually
    valid thirty-minute phases, defeating the stop rule intended to keep autonomous
    work out of rabbit holes.
  fix: >-
    Give active sessions offset-aware start and deadline fields, bind their span to
    wall_minutes, reject an expired active session, distinguish ordinary work from the
    designated finalization phase, bound ordinary work by the reserve boundary, and
    enforce max_cycles.
  regression: >-
    Focused contract tests and mutation controls reject a missing or expired active
    session clock, a deadline beyond the wall budget, reserve encroachment, and excess
    contemporaneous phases
  bead: think-hm0x
  recorded_in: packing/src/sqpack/campaign/ledger.py
