- id: D-049
  title: Contact-graph canonicalization is factorial on sparse symmetric endpoints
  date: '2026-08-23'
  layer: tooling
  class: performance
  detected_by: review
  severity: high
  status: outstanding
  what: >-
    The canonicalizer exhaustively individualizes ambiguous colour classes without
    memoization or automorphism pruning. An empty-graph benchmark grew from 0.098 seconds
