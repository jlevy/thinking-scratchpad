  direction: conservative
  detected_by: control_cell
  latent_for: since the snapshot gained its prune list
  severity: low
  status: outstanding
  what: >-
    `run_negative_controls` builds each worker from a bounded snapshot and prunes
    `resources/` -- the literature archive -- to stay under the portable size cap. The
