    Not fixed here. BC-068 pinned the emission at 28, which preserves the status quo and
    does not address this; fixing it honestly means either an absolute tolerance derived
    from each operand's declared `precision`, or a restatement of what the check is
    asking. It is recorded rather than patched because it is the thing standing between
    this repository and a principled emission precision of 32, and that is a decision
    about what the projection layer promises rather than a rounding to choose in passing.
