- id: D-042
  title: An open n = 12 case was used as a known-answer negative control
  date: '2026-08-23'
  layer: record
  class: validity
  direction: flattering
  detected_by: review
  severity: high
  status: fixed
  what: >-
    Campaign schemas, runbooks, and rounds label n = 12 as a negative control whose
    correct outcome is failure to beat the 4 by 4 grid. But s(12) = 4 is not proved and
    the project's own frontier treats improving either bound at n = 12 as an open
    research target. Failure to improve an unproved incumbent is not a known-answer
    outcome.
