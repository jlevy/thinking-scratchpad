- id: D-151
  title: Stromquist's middle Lemma 4 table selected an extraneous cubic root
  date: '2026-08-24'
  layer: docs
  class: soundness
  direction: flattering
  detected_by: inspection
  latent_for: twenty-three years in the primary source and two days in the local archive
  severity: high
  status: fixed
  what: >-
    At `a = sqrt(4/5)`, Stromquist's table reports `theta*=24.1 degrees` and
    `f(a)=.926`. Squaring the stationarity equation introduces that smaller cubic root:
    it has `cos(theta)>a` and violates the unsquared sign condition. The true minimum is
    at about 31.45595 degrees with `f(a)=0.9145377886`.
  consequence: >-
    Trusting the printed threshold would certify Lemma 4 for some `b` between about
    .91454 and .926 where the stated sufficient condition has not been established.
    The particular `a=sqrt(4/5), b=.9` application survives. That does not validate the
    complete Figure 14 cover: its separate `a=.95, b=.8` gap is D-152.
  fix: >-
    Preserved the printed row as source text, annotated the algebraic error in the clean
    archive and research report, and require H-010 to select roots with the unsquared
    sign condition and certify `.9 < f(a)` directly.
  regression: >-
    The H-010 exact checker rejects the extraneous squared-cubic root, certifies every
    accepted stationary root against the unsquared condition, and is replayed from the
    retained exp-016 record in the strict gate.
  bead: think-7nwj
  recorded_in: packing/resources/papers/stromquist-2003-packing-10-or-11-unit-squares.md
