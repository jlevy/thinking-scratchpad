  detected_by: review
  latent_for: 'one day, on every machine with the pre-commit hook installed'
  severity: medium
  status: fixed
  what: >-
    `defects.md` is rebuilt byte-for-byte by `render_defects.py` and drift-checked by
    `render_defects.py --check`, exactly like `campaign/ledger.md` -- but only
