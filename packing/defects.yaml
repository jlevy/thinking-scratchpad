- id: D-416
  title: The results scope contract admitted a broader claim and reversed ranges
  date: '2026-08-31'
  layer: record
  class: validity
  direction: flattering
  detected_by: review
  latent_for: since T-007 entered the results register
  severity: high
  status: fixed
  what: >-
    T-007's claim stated Nagamochi's lower bound for every N at least 4, while both the
    result and its cited evidence declared scope only through N = 100. The schema and
    checker also accepted a range whose n_min exceeded n_max, which the generated view
    would render literally as 100-4.
  consequence: >-
    The displayed V3/C1 classifications appeared to cover an unbounded theorem outside
    the registered evidence scope, and malformed ranges could pass every structural
    check. The underlying source theorem was not in doubt, but the whole-result contract
    did not describe exactly what the repository had classified.
  fix: >-
    T-007 now states the bounded corollary for 4 <= N <= 100, matching both scope
    records. The checker rejects a range whose lower endpoint exceeds its upper
    endpoint.
  regression: >-
    tests/test_results_register.py poisons T-007 with n_min 100 and n_max 4 and requires
    the checker to refuse the reversed range.
  bead: think-n8vl
  recorded_in: packing/frontier/results.yaml

- id: D-417
  title: The n=5 identity-pair replay compared meaningless floating-point last bits
  date: '2026-08-31'
  layer: tooling
  class: validity
  direction: conservative
  detected_by: gate
  latent_for: since the BC-083 identity-pair artifact was retained
  severity: medium
  status: fixed
  what: >-
    build_n5_identity_pair stated that quench last bits were not part of the retained
    claim, but its check compared the derived side_difference float for exact equality.
    The full checkpoint rebuilt the same two keys and qualitative invariants while the
    difference moved from 8.88e-16 to 2.66e-15, both far below D-021's 1e-11 solver
    floor, and failed the gate as drift.
  consequence: >-
    A scientifically identical replay made the full integration surface red. No identity
    or component claim changed, but the false refusal could block a merge or teach
    maintainers to ignore a meaningful future drift in this control.
  fix: >-
    The replay now compares the two boolean invariants exactly and requires both retained
    and rebuilt side differences to remain finite and below the declared solver floor.
    It no longer treats sub-floor last-bit variation as a recorded quantity.
  regression: >-
    tests/test_identity_relation.py accepts two distinct sub-floor values, rejects a
    rebuilt difference above 1e-11, and still rejects a changed geometric-key invariant.
  bead: think-n8vl
  recorded_in: packing/devtools/build_n5_identity_pair.py

- id: D-418
