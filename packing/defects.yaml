    fixture and requires the refusal.
  recorded_in: packing/devtools/serve_packing_motion_lab.py
- id: D-352
  title: A timeline counter changed meaning on the last event of every trace
  date: '2026-08-28'
  layer: tooling
  class: bookkeeping
  direction: neutral
  detected_by: review
  latent_for: from the trace-adapter commit to its first review
  severity: medium
  status: fixed
  what: >-
    Every observation carried the LP work of the single call it reported, except the
    stop, which carried the run total under the same field name. The readout rendered
    both with the same label. On the retained 144-event fixture the run made 71 LP
    calls, the stop event displayed 71, every other event displayed 1, and the column
    summed to 213 -- the stop total plus each probe solve counted twice, once as the
    fixed-angle state it produced and once as the probe that asked for it.
