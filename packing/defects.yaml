- id: D-422
  title: Build caches are still copied into every worker, and the cap is held by a per-file prune
  date: '2026-09-03'
  layer: tooling
  class: robustness
  detected_by: inspection
  latent_for: >-
    the breach, from before this branch's base until the same day it was recorded; the
    copied build caches, for as long as the portable fallback has bulk-copied the tree
  severity: high
  status: fixed
  what: >-
    Recorded as "the snapshot cap refuses all 155 negative controls, and build caches are
    what breach it", against a live measurement of 67,823,986 bytes and a 64 MiB cap. Both
    halves have since moved, in opposite directions, and this entry is retitled to the half
    that survives. The refusal is discharged; the diagnosis was superseded by a later
    commit, which is a different thing from having been wrong, and both are kept because
    the second is what a reader needs and the first is what this log is for.

    Correct when written, re-measured rather than taken on report. Replaying
    `snapshot_source_bytes()`'s accounting over `git ls-tree` at `609e7392`, the commit
    that recorded this entry -- counted over the git tree, so no build cache can enter the
    figure -- the tracked counted surface was 56,903,590 bytes against the 67,108,864 cap,
    10,205,274 under it. The live measurement was over only because 11,095,141 bytes of
    `__pycache__`, `.pytest_cache` and `.ruff_cache` were counted with it, and the
    untracked non-cache remainder was zero. (The entry's own figure, 56,735,348, differs by
    168,242 -- the copy-back term its script priced from the live tree -- and the
    conclusion is the same either way.)

    Superseded by a commit, on 2026-09-03. `ceff4400` committed exp-059's completion record
    (10,923,451 bytes) and its checkpoint (10,947,228), 21,870,679 together. Counted the
    same way over the git tree, the surface went from 56,965,725 at its parent `2796174b`
    to 78,841,684 at `ceff4400`: 11,732,820 over the cap with zero caches present. From
    that commit the breach was record-caused, and no cache exclusion would have cleared it.

    What survives, all measured at `3018f454` on 2026-09-03. First, the build caches are
    still counted and still bulk-copied by `_clone_into` into each of the four private
    worker trees: 11,819,796 bytes, 20.8% of the 56,898,058-byte live surface, and no
    control names a `.pyc`. They sit in `tests/` (4,362,514), `cases/` (3,019,649),
    `devtools/` (2,263,035), `src/` (1,942,655), `.pytest_cache` (160,825) and
    `.ruff_cache` (71,118). Second, the measurement is still a property of a used checkout
    rather than of the commit: it moved 678,914 bytes inside this one session, from
    56,219,144 when the fix below was measured to 56,898,058 now, with no commit between
    them and nothing but `__pycache__` to explain it. Live minus caches is 45,078,262,
    exactly the tracked surface at HEAD, so the caches remain the whole of the drift.
    Third, the fix that cleared the cap names four files, and the headroom now standing
    behind that list -- 10,210,806 bytes -- is smaller than the single pair of artifacts
    that consumed the last of it. The next result the size of exp-059's breaks the cap
    again.
  consequence: >-
    Discharged 2026-09-03, with evidence. The suite ran, for the first time on this branch:
    `155 negative controls fire as expected`, exit 0, no failures, and no control failing
    for the wrong reason. Three runs -- two in the session that applied the fix, the second
    of them after two concurrent commits had landed, and one more at `3018f454` for this
    entry.

    That is the first direct evidence on this branch that the repository's guards catch
    what they were written for, as opposed to that their anchors still resolve. The
    adjacency this entry was written about is closed with it: `check_control_anchors`
    reports "155 negative control anchors each match their file exactly once" and its own
    docstring says it "deliberately does NOT check that a control still *catches* what it
    was written for", so until this ran, that green count stood beside a suite in which
    nothing had ever fired.

    What the surviving half costs. About a fifth of every private worker tree is build
    detritus, copied four times over for a suite that mutates source. Worse than the waste
    is that the guard's subject is not the commit: the same tree measures 45,078,262 bytes
    on a fresh checkout and 56,898,058 here, so the cap fires for one person and not
    another on identical code. And the cap now stands on a list of four file names. When it
    is next breached the suite stops running in the full gate again -- and that much is not
    silent, because `tests/test_negative_controls.py` asserts
    `snapshot_source_bytes() < SNAPSHOT_MAX_BYTES` and rides the `fast behavioral tests`
    step, which is `fast=True`. What stays silent is everything finer: `Step("negative
    controls", ...)` still carries neither `fast` nor `records`, so the pull-request surface
    can say that the snapshot is too big and can never say that a control has stopped
    catching what it was written for.

    The prediction above came true inside the same session, and not the way it was
    written. This entry expected the next breach to be record-caused -- "the next result
    the size of exp-059's breaks the cap again". What actually broke it was the caches
    alone, on a commit that added 40 KB of prose. The full gate at `d2d0ba4f` measured
    68,007,522 bytes against the 67,108,864 cap, 898,658 over, and the decomposition is
    that the walk carries 11,164,000 bytes of `__pycache__`, `.pytest_cache` and
    `.ruff_cache` -- without them the surface is 56,843,522, comfortably under. So the
    sequence is: run the gate, the gate writes bytecode, the bytecode is counted, and the
    next run of the same gate on the same commit fails the cap. Hosted CI passed the
    identical tree at the same revision, on a clone with no caches, which is the
    "fires for one person and not another on identical code" claim of this entry
    reproduced as an actual red gate rather than as a projection. Two of the three failed
    steps in that run -- `negative controls` and `fast behavioral tests` -- are this one
    assertion, counted twice; the suite's other 1,606 tests passed.

    Hosted CI is red on it too, as of 2026-09-04, so the "clone with no caches" the
    paragraph above credits no longer exists on a runner either. The pull-request surface
    at `dd458471` (PR #78, a planning branch that adds 145,323 tracked bytes under
    `packing/`) failed exactly this assertion at 67,173,741 bytes, 64,877 over the cap; the
    tracked, pruned-target and root-document terms at that revision sum to 57,057,956, so
    the remaining 10.1 MB is the bytecode pytest had written under `tests/`, `devtools/`
    and `src/` by the time the assertion ran at 53% of the suite. `main` at `9d5eae0f`,
    the merge of PR #77, fails the same `fast behavioral tests` step in its post-merge run
    while its previous merge at `bc6d4a87` passed, which dates the hosted red to the
    record growth between them. Every pull request against `main` is red on this
    assertion until the caches leave the count, which makes direction (1) below the
    repair that turns the hosted gate green, not only the used local checkout, and it is
    scheduled as BC-168 in Agenda 017.
  fix: >-
    Applied at `a478744a`, and deliberately narrow. Four file names joined `PRUNE` --
    exp-059's result and checkpoint, plus the exp-052 and exp-056 checkpoints, which
    predate this branch and are the same class rather than the next thing to trip the cap
    -- 34,109,196 bytes together. The live counted surface went 90,031,065 to 56,219,144,
    16.2% under the cap at the time, and the suite ran. The artifacts stay committed: they
    are exp-059's evidence. What changed is that a throwaway mutation sandbox no longer
    carries 34 MB of solver state in order to corrupt one line of a Python file. Pruning by
    file rather than by directory is not durable and was not meant to be, which makes the
    structural options below more urgent rather than less.

    APPLIED 2026-09-04, as direction (1), and the entry is discharged. Before:
    69,569,514 bytes against the 67,108,864 cap, 2,460,650 over, of which 11,994,514
    (17.2 per cent) was build cache -- `__pycache__` 11,660,736, `.pytest_cache` 176,516,
    `.ruff_cache` 157,262 -- in the same six locations this entry names. After: 57,626,070
    bytes, 9,482,794 of headroom. The count is now byte-identical across deleting every
    cache and a fresh pytest-and-ruff run that wrote 130,487 bytes, so the drift this entry
    was retitled around is gone and the measurement is a property of the commit.
    Two things the prescription below got wrong, neither fatal. It is incomplete rather
    than mistaken: excluding caches from `_clone_into` alone still leaves nested ones in a
    worker, because everything that routine does not descend into crosses in a single
    `cp -R`, which has no exclude option -- so `clone_tree` needs a sweep afterwards. It
    also omits `ROOT_DOCUMENTS`, whose rglob can reach a cache, since `.agents` carries a
    Python file. And its safety argument was weaker than the truth: it reasoned that no
    control names a `.pyc`, when in fact `run_one` sets a fresh `PYTHONPYCACHEPREFIX` per
    command, so Python resolves bytecode in a mirror tree and cannot read the co-located
    `__pycache__` at all. The copied caches were provably dead weight, verified by
    importing a same-size mutated module past a stale `.pyc`.
    The suite is unaffected: 155 negative controls fire as expected, exit 0, and
    `check_control_anchors` reports 155 of 155.

    The other three directions are recorded as they stood. (1) Exclude the build
    caches from the counted surface and from `_clone_into`. Still the smallest change,
    still 11.8 MB of pure detritus, and it is the only one of these that makes the
    measurement a property of the commit instead of the checkout. (2) Content-address the
    large checkpoints so a worker links rather than copies them. (3) Raising the cap again
    is still the weakest: `D-371` raised it from 40 to 64 MiB on the reasoning that it
    "exists to stop someone checking in a gigabyte of data, not to track the record's
    ordinary growth", and the growth has consumed that headroom twice in the five days
    since -- once with the caches counted, and once in the record alone.

    Withdrawn: pruning `campaign/series/*/results` wholesale, which this entry previously
    proposed. It is wrong, and silently so. `devtools.check_canonical` reads
    `exp-003-baseline-n11-target.jsonl` from that directory for the wrong-basin `n = 11`
    packing; `archived_n11()` returns `None` when the archive is absent and the caller does
    not skip -- it records `FAIL  Trump's basin differs from the annealer's  [no archive]`
    and the checker exits 1 before any mutation is applied. Since a control is scored on
    "exited non-zero and printed its expect string", with no green baseline demanded, all
    four canonical controls go on passing over a checker that was already red, and the
    `n = 11` basin discrimination the checker exists for is silently not performed.
    Demonstrated rather than argued: in a cloned worker with that one archive removed, the
    checker exits 1 unmutated and `run_one` scores all four controls PASS. That scoring gap
    is `D-427`. The prune also buys almost nothing -- 1,072,797 bytes beyond the four files,
    because the linked- and registered-target rules pull 6,790,030 bytes of the directory
    straight back.

    One residual of the applied prune, recorded so it is not rediscovered as a surprise.
    `devtools.check_instrument_normalization` globs `campaign/series/*/results/*.json` for
    instrument bindings, and inside a worker it now finds 8 of the 11 the real tree has. The
    three it loses are the three carried by the pruned checkpoints and result, all naming
    the same file, `resources/web/n17-lower-bounds-2026/massaccesi-verify-n17-lower-bound-4_5058.py`,
    which lives under the already-pruned `resources/` tree. They cost nothing, and the
    reason is worth knowing: the checker classifies a bound path as `excluded` before it
    tests whether the file exists, and `tool.ruff` `extend-exclude` covers `resources`, so
    those three were `excluded` in the real tree too and were never inspected. Nothing in
    `controls.yaml` invokes this checker and its only test asserts `bound_python_files > 0`,
    so the real-tree check is unaffected. Had the same prune removed a binding whose path
    was not excluded, its status would have been `missing`, which is a violation, and this
    checker would have been red in every worker -- the `D-427` shape one file over.
  regression: >-
    `tests/test_negative_controls.py::test_build_caches_leave_the_counted_surface_and_the_worker_trees`
    plants 1,000,003 bytes in each of four caches -- the three names plus one four levels
    deep -- alongside one non-cache probe file, then asserts the counted total moved by
    exactly the probe, so an over-broad exclusion that counts nothing fails the test too,
    and that no cache directory survives anywhere in a cloned worker while the probe does.
    Each of the four exclusion sites was ablated separately and each ablation fails it.
    The older note, kept because it is what this entry was for: The
    cap does have a check: `tests/test_negative_controls.py::test_generator_owned_prospective_outputs_stay_out_of_mutation_snapshots`
    asserts `snapshot_source_bytes() < SNAPSHOT_MAX_BYTES`, and the step that runs it is
    `fast=True`, so a fresh checkout at `ceff4400`, where the surface was 78,841,684, fails
    on the pull-request surface and not only in the full gate. What has no check at all is
    the cache accounting: nothing refuses a snapshot that is a fifth detritus, nothing makes
    two runs on one commit agree, and nothing says that the headroom is now smaller than the
    last artifact that consumed it.
  recurrence_of: D-371
  bead: think-ahyr
  recorded_in: packing/devtools/run_negative_controls.py
- id: D-423
  title: The cover certificate's Lemma 4 boundary is non-strict in two sources and strict in a third, unrecorded
  date: '2026-09-03'
  layer: record
  class: bookkeeping
  detected_by: review
  latent_for: since the green17 certificate was retained on 2026-08-31
  severity: medium
  status: outstanding
  what: >-
    The lemma that closes the top strips of the Green17 cover certificate is printed with
    two different strictnesses, and the repository holds both. All three statements were
    checked against the archive rather than taken on report.

    Non-strict, twice. `[Stromquist 2003]` Lemma 3: "Let a and b satisfy a <= 1, b <= 1,
    and a + 2b <= 2 sqrt 2. Then any box whose center is in the rectangle [0,a] x [0,b]
    must intersect the x-axis, the point (0,b), or the point (a,b)"
    (`packing/resources/papers/stromquist-2003-packing-10-or-11-unit-squares.md:52`,
    confirmed against the byte-level extraction at `.raw.md:161`). `[Bentz 2010]` Lemma 4,
    attributed to Friedman and Stromquist, repeats it with `a + 2b <= 2 sqrt 2`
    (`packing/resources/papers/bentz-2010-optimal-packings-13-and-46.md:55`, confirmed at
    `.raw.md:93`).

    Strict, once. Friedman's Dynamic Survey DS7 Lemma 2: "Let 0 < x <= 1, 0 < y <= 1, and
    x + 2y < 2 sqrt 2" -- strict on that hypothesis alone while the other two stay
    non-strict (`packing/resources/papers/friedman-ds7-packing-unit-squares-in-squares.md:153`,
    and independently in the separately extracted HTML at
    `packing/resources/web/friedman-ds7-survey-2009-html.md:231`).

    The two readings agree everywhere except at `a + 2b = 2 sqrt 2`, and that boundary is
    exactly the case the certificate's ceiling argument uses.
    `packing/cases/green17/verify_cover.py` says so in its own words: the certified side
    "sits within 6 * 10^-7 of the set's exact ceiling 753/250 + sqrt 2 (the top strips'
    a + 2b <= 2 sqrt 2 becoming equality)". `packing/frontier/RESULTS.md` T-003 carries the
    same non-strict form into a retained apparently-novel result, "the top strips'
    a + 2b <= 2*sqrt(2) hypothesis identifying the closing mechanism at 753/250 + sqrt(2)".
    Under Friedman's strict form the lemma does not apply at that equality at all.

    A second, smaller divergence sits in the same pair of statements and is recorded here
    because it is the same unperformed collation: Stromquist's conclusion names the point
    `(0, b)` where Bentz's names `(0, a)`, on a rectangle `[0,a] x [0,b]`. Bentz's `.md`
    transcription and its `.raw.md` ground truth agree with each other, so this is a
    difference between the printed sources and not a transcription error introduced here.
    Which one is right is part of the same reconciliation and is not settled by this entry.
  consequence: >-
    Bounded, and worth stating precisely so this is not read as a refutation. The retained
    numerical claim is untouched: the certificate proves `s(17), s(18) >= 4426213/1000000`,
    and at that side the top strips satisfy `a + 2b < 2 sqrt 2` strictly, roughly 6e-7
    inside the boundary, so the strict and non-strict readings give the same verdict there
    and both formal legs -- the exact cell certifier and the interval branch-and-bound in
    `packing/cases/green17/interval_audit.py` -- stand.

    What is affected is the exact-ceiling follow-on. Nothing has been computed or retained
    at `753/250 + sqrt(2)`: T-003 brackets the ceiling in
    `[4426213/1000000, 4427/1000)` with a certification at the left endpoint and an exact
    escaping pose at the right, and the ceiling value sits strictly inside that bracket
    with only prose attached. So the boundary case has never been exercised at the value
    in question, and the lemma form that would license it is the one the sources dispute.
    A reader of T-003 meets the non-strict hypothesis presented as governing, with no
    indication that a third printed source withholds it at exactly that point. Left
    unrecorded, the obligation is invisible to whoever later tries to promote the ceiling
    from bracketed to established.
  fix: >-
    None yet, and none here: Agenda 016's W9 lane is bounded to D-044 and D-046 and may not
    substitute a backlog item, and this branch establishes no Green17 result.

    The remedy is a short written reconciliation, not a recomputation. Decide, against the
    three printed statements and their proofs, whether the boundary `a + 2b = 2 sqrt 2` is
    covered -- Friedman's DS7 proof of the strict form derives the escape condition from
    `f(theta) = cos + sin - x sin cos > y` with a minimum at `theta = 45 deg`, so whether
    the inequality closes at equality is decidable from the printed argument -- then record
    the verdict where the certificate and T-003 can cite it, and qualify the exact-ceiling
    follow-on on `think-iye2` accordingly. If the strict reading wins, the ceiling claim
    needs a different closing mechanism at `753/250 + sqrt(2)`; if the non-strict reading
    wins, the note is what makes the existing prose load-bearing. Either way nothing about
    `4426213/1000000` moves.
  regression: >-
    none. The frontier's source-availability and evidence records track whether a source is
    held and whether it was reviewed, not whether two held sources state the same lemma the
    same way, so nothing in the gate would have raised this.
  bead: think-iye2
  recorded_in: packing/cases/green17/verify_cover.py
- id: D-424
  title: Two of the eight n = 5 rigidity controls adjudicated themselves and called nothing
  date: '2026-09-03'
  layer: tooling
  class: validity
  direction: flattering
  detected_by: review
  latent_for: forty-six minutes and six commits, from the controls' first appearance at e25d17ab to the BC-153 repair at 609e7392
  severity: high
  status: fixed
  what: >-
    `controls.changed_feature` (C1) and `controls.invented_contact` (C4) computed their
    own verdicts inline. Neither built a mutated system and neither called `bind` or any
    guard: `invented_contact` never named `bind`, and the only name `changed_feature` took
    from `sqpack.local_rigidity.binding` was `embed`, a field-embedding helper.

    C1, for each of the four touching pairs and each of the three sibling support features
    of its active branch, formed `claimed = (active_keys - {contact.key}) |
    {substitute.key}` and recorded `active_key_agreement_breaks = claimed != t012_keys`.
    C4 took `system.inactive_walls[0]`, formed `claimed = active_keys | {invented.key}`,
    and recorded `agrees = claimed == set(t012.contact_keys)`. In both, the key put into
    the set was chosen *because* it is not one of T-012's contacts, so the comparison could
    not have come out the other way. The other conjunct in each verdict -- that the
    sibling's margin is nonzero, that the invented wall's margin is not zero -- is a true
    fact about the pose, but it is a fact the control read off the unmutated system for
    itself. No mutated object was ever handed to anything that could refuse it. C1 also
    computed whether the sibling's gradient differs from the contact's, and no verdict read
    it.

    Checked rather than argued: run at `2f112f4c`, both controls return `rejected=True`,
    and neither verdict expression references a function of the instrument.
  consequence: >-
    The receipt's control table and `test_every_control_rejects` said eight of eight
    refuse. Six did. The other two restated their own premises, so the evidence behind the
    single refusal this instrument exists to make was six controls and two decorations, and
    nothing in any view distinguished them.

    What that overstated is a readiness gate rather than a retained result, and the entry
    is bounded accordingly. `H-060` -- Goebel's exact `n = 5` optimum is locally rigid at
    fixed side -- registers the instrument-ready transition as a reviewed precondition, and
    `exp-058` reopens its round only when the instrument "refuses all eight controls
    substantively" -- a qualifier that round's record did not carry until this was found.
    When this was found, `H-060` carried `instrument_ready: false` and no receipt had been
    retained, so nothing downstream had yet consumed the claim. That is no longer the
    state, and the order is what keeps the entry bounded: the repair landed at `609e7392`
    *before* either transition, the readiness review passed on the repaired controls at
    payload digest `743fd18a...`, and only then did `H-060` move to `instrument_ready:
    true` with the current build's receipt `f8262c77...` retained in `exp-058`'s result
    record and `T-014` registered. So what the downstream records consumed is the repaired
    instrument, not the two decorations. Unread, two tautologies would have been discharged
    as evidence at exactly the step where a claimed new theorem is promoted.
  fix: >-
    Both controls now mutate a real `ConstraintSystem` and hand it back to the instrument.
    `with_active_pair` and `with_forged_active_wall` build the mutant; C1 applies each of
    the twelve substitutions twice, once renaming the contact onto the sibling and once
    keeping the contact's name and its cached margin while swapping in the sibling's
    polynomial; C4 forges a zero margin onto a slack wall inequality. Each verdict is now
    the conjunction of a guard refusal and `bind` refusing.

    The guard is new and its recomputation is the whole mechanism.
    `system.require_active_margins_zero` re-evaluates every active polynomial at
    `chart.origin()` instead of reading its stored `margin`, because both forgeries leave a
    plausible cached margin behind, and it is called from `instrument.assess` before the
    neighborhood is built -- so it guards the path the receipt is built on and not only the
    controls. Its finding: against the key-preserving forgery the recomputing guard catches
    all twelve substitutions while `bind`'s gradient check catches eight, the four it
    misses being gradient-degenerate against the contact they replace.
  regression: >-
    Four retained tests, and they pin the mechanism rather than the verdict, which is what
    the first version would have passed.
    `test_a_changed_support_feature_is_refused_by_the_instrument_itself` and
    `test_an_invented_contact_is_refused_by_the_guard_and_by_the_binding` assert, per
    substitution, that the guard refused and that the binding does not hold;
    `test_the_active_margin_guard_recomputes_rather_than_trusting_the_record` requires
    `ActiveMarginError` on both mutation shapes; `test_every_control_rejects` holds the
    suite at eight.

    The standard that settled it is the part worth keeping, because it is what separates a
    control from a decoration: the reviewer confirmed the repair *by removal*, not by
    reading. Reproduced here against the working tree at HEAD -- baseline `(True, True)`;
    with `require_active_margins_zero` replaced by a no-op, `(False, False)`; with `bind`
    replaced by a certificate that always holds, `(False, False)`. That demonstration is
    not itself automated, and until it is, a future control could be re-tautologised in a
    way the four tests above would still have to be edited to accept.
  recurrence_of: D-144
  recorded_in: packing/src/sqpack/local_rigidity/controls.py
- id: D-425
  title: A commit titled "restore" shipped the widest disabled runner guard to a shared branch
  date: '2026-09-03'
  layer: tooling
  class: robustness
  detected_by: inspection
  latent_for: two commits and five minutes of shared-branch time, 08:10:31Z to 08:15:50Z, both pushed
  severity: medium
  status: fixed
  what: >-
    The W9 lane was mutation-testing `record()`'s guards by editing
    `packing/src/sqpack/campaign/runner.py` in the shared working tree, and two commits
    carrying a live mutant reached the shared branch. Only one of the two is a snapshot,
    and the distinction is the entry: the wider hole was shipped by a hand-written repair.

    The two commits do not carry the same mutation. `f8ccd541`, the coordinator's
    work-in-progress snapshot, captured the lane's narrow mutant: the inner digest
    comparison `elif stored.get("archive_sha256") != verification["archive_sha256"]:`
    short-circuited to `elif False:`. `a9c5fdcc` is not a snapshot. Its subject is "fix:
    restore the archive-moved refusal the previous snapshot disabled", it is the commit that
    shipped `if False:` over the whole archive-verification block, and it is the only commit
    on the branch that ever carried that state: its diff restores the inner `elif` and in
    the same hunk turns the enclosing `if archived:` into `if False:`, trading a narrow
    mutation for the widest one available while its message said the guard was back. The
    next commit's own subject -- "re-enable the archive verification block, this time
    completely" -- admits it. That is the shape a shared tree produces: the lane had moved
    its mutation between 08:10:31Z and 08:13:00Z, and a repair written against the file
    rather than against the diff swept up whatever was live. `7d24225a` restores
    `if archived:`, and `runner.py` is byte-identical to `6309e1f4` from there on.

    Two claims in those messages do not survive checking, and they are recorded here
    because this log is also where a message is held to its tree. `7d24225a` says both
    mutations were cleared, "the engine self-test is the real call rather than a stubbed
    receipt": `selftest = run_engine_selftest(recipe)` is present and unaltered in every
    commit from `bf75ce0c` onward, so no commit ever carried a stubbed self-test and the
    count of captures is two, not three. `a9c5fdcc` says "ruff, ruff format and
    basedpyright clean on both files", and they are not -- dropping `if archived:` leaves
    `archived` bound and never read, which `ruff check` reports as `RUF059` and
    basedpyright as `reportUnusedVariable` on the committed file, under this repository's
    own configuration.
  consequence: >-
    With `if archived:` dead, `record()` performs no archive re-verification at all:
    `verification` stays `None`, `verify_archive_in_separate_process` is never called, the
    retained certificate is never compared against the archive on disk, and the guard row
    that states the geometry was re-derived in another process is never written into the
    round. A round could then be recorded from an archive that moved under its own
    certificate -- the `D-044` trust boundary the W9 lane exists to repair. `f8ccd541`'s
    narrower `elif False:` is the same hole one step further in: the archive is
    re-verified and the answer discarded.

    Nothing was recorded through either, and the entry is scoped to that. Between
    `609e7392` and HEAD only `runner.py` and its test file change; no ledger entry, series
    record or archive moves, and no round was recorded in the five minutes concerned. What
    did happen is that both commits reached
    `origin/claude/squares-pr76-overnight-run-tpc888`, so anyone who took the branch in
    that window held a runner whose archive check was dead. That exposure, not a corrupted
    result, is what this is worth.
  fix: >-
    Mutation testing moved out of the shared tree in `1e5c116f`. `MUTATIONS` and
    `_unrepaired` in `packing/tests/test_campaign_runner_trust_boundary.py` copy the module
    into `tmp_path`, revert exactly one repair in the copy, import it under a name that is
    removed again immediately, and show the copy accepting what the module refuses. Five
    repairs are covered -- pose validation, cell and seed attribution, lease expiry, legal
    transitions, prerequisites -- and the archive re-verification is not among them. The
    guards themselves are restored at HEAD.

    Not done here, and named so it is not mistaken for done: nothing in the repository
    gates a commit against a disabled branch. The scan of diffs and files for
    disabled-branch shapes that `7d24225a`'s message describes is a coordinator practice,
    not an artifact -- `packing/devtools/` holds no such check.
  regression: >-
    The detector already existed, took under nine seconds, and was not run. Measured on
    2026-09-03 by extracting each commit into a scratch tree and running that commit's own
    trust-boundary file against that commit's own runner: `f8ccd541` gives 1 failed and 54
    passed in 7.40s, on
    `test_record_refuses_an_archive_edited_after_it_was_verified`; `a9c5fdcc` gives 3 failed
    and 53 passed in 7.58s, adding `test_record_refuses_a_forged_result_line` and
    `test_a_supervised_round_records_a_verified_verdict` -- the exact three a mutation
    analysis of `if archived:` predicts, since with the block dead no verification receipt is
    appended and no guard row is written. So `packing-validate --push`, which runs the tests,
    would have refused both, and so would the one file on its own.

    That is the lesson, and it is not the one first drawn. The first version of this entry
    said the finding was that `ruff`, `ruff format` and `basedpyright` are clean on a guard
    short-circuited to `if False:` because a dead branch is syntactically perfect. That
    remains true and is incidental: the actionable failure is an ordering one, in that a
    commit went out red on the one guard the whole block is about while the suite that
    catches it in eight seconds had just been written by the same lane and was not run
    before committing. The linter observation survives only as a bound on the cheaper tier:
    checked here, `ruff` is clean on `f8ccd541`'s narrow mutation and reports `RUF059` on
    `a9c5fdcc`, whose dead branch orphans the `archived` binding -- which that commit's
    message denied. Nothing added here closes the gap between the tier that would have
    caught this and the tier that ran.
  recorded_in: packing/tests/test_campaign_runner_trust_boundary.py
- id: D-426
  title: A control-cell breach does not stop the unattended session
  date: '2026-09-03'
  layer: record
  class: validity
  direction: flattering
  detected_by: review
  latent_for: ten days and one repair of the loop itself, from the runner's first session loop at 8f53f8e3 on 2026-08-24
  severity: high
  status: outstanding
  what: >-
    `packing/campaign/README.md:393` declares the session stop conditions: "Stop, do not
    adapt, on: budget exhausted; queue empty; three consecutive guard refusals or crashes;
    a control cell breaching; any invariant check failing; or a decision that needs a
    human." The runner does not honour the control-cell clause.

    A breach reaches `decide` (`packing/src/sqpack/campaign/runner.py:1202`), which returns
    `rejected` with `stopped_by: "guard"` and says why in its own reason string -- "the
    instrument is suspect rather than the strategy good ... Clause 4 rejects regardless of
    outcome". `record` then returns that decision through the ordinary path, so back in
    `run` the round counts as completed: `failures` is reset to 0 and the loop proceeds to
    the next hypothesis, on the same instrument the round just declared suspect. `run` never
    reads `stopped_by`, so a guard breach is indistinguishable there from an ordinary
    rejection. `abnormal` is set only by `GateRunningError` or by
    `MAX_CONSECUTIVE_FAILURES`, so the session also exits 0.

    Checked rather than argued, 2026-09-03: `control_breaches([Cell(16, [3.9])])` is
    non-empty, `decide` returns `rejected` with `stopped_by: "guard"`, and `run`'s body
    contains no reference to `stopped_by`.

    The declared rule says stop; the runner adapts. This is not a clause of D-046 -- neither
    that record nor its source finding F-04 names it -- and it is recorded separately so the
    log keeps one date, one detector and one latency per finding.
  consequence: >-
    Bounded today and not bounded by design. `queue` will skip the breached hypothesis,
    because its decision is now terminal, but nothing stops the other queued hypotheses from
    running against the instrument whose control just failed. Their rounds are then recorded
    through the ordinary path and reach a reviewer as ordinary measurements, the strongest
    of them `unresolved` -- clauses 1-4 passed, held for review -- with nothing in the round
    or the session report marking them as taken after a breach. That overstates what those
    rounds are evidence of, which is the flattering direction, and it is precisely the
    unattended failure mode the trust-boundary block exists to close.

    Nothing has been recorded through it, and that conclusion is unchanged by the
    correction that follows: no live round has run, nothing has been recorded through the
    unattended runner, and `SYNOPSIS.md:87` carries the numerical runner as NO-GO for
    unattended execution. The premise this entry first gave for that -- "`sqsearch` is not built in
    this environment" -- was true when written and went stale at 10:30Z on 2026-09-03, when
    a release binary appeared at `packing/sqsearch/target/release/sqsearch` (ELF x86-64,
    617,520 bytes, untracked under the package's own `.gitignore`). Nothing has been
    executed against that binary, and the end-to-end coverage still runs a fixture engine,
    so what the absence of a built engine was standing in for remains true on its own
    evidence. The exposure is what a future unattended session would do, not a result
    already taken.
  fix: >-
    None yet, and none here: Agenda 016's W9 lane is bounded to D-044 and D-046 as scoped
    and may not widen to a finding adjacent to them.

    The remedy is small and belongs with the rest of the lifecycle work on `think-ldq2`:
    have `run` read the decision's `stopped_by`, and treat a `guard` stop the way it already
    treats `GateRunningError` -- release the round, set `abnormal`, and break -- so the
    session ends non-zero on the declared condition instead of continuing. Whether an
    invariant-check failure, the other clause of the same sentence, needs the same treatment
    should be settled at the same time.
  regression: >-
    none. The breach itself is well covered -- `control_breaches` and `decide` are both
    tested -- and nothing tests what the session does next, which is where the declared rule
    lives. The D-046 repair rewrote this exact loop's failure policy, widening its `except`
    clause and adding `safe_release`, and left the breach path as it was, so a repair pass
    over the surrounding code is not a detector for this class either.
  bead: think-ldq2
  recorded_in: packing/campaign/README.md
- id: D-427
  title: Controls are scored on the mutated run alone, so one can pass over an already-red checker
  date: '2026-09-03'
  layer: tooling
  class: validity
  direction: flattering
  detected_by: inspection
  latent_for: >-
    since the harness's first commit, 8f53f8e3 on 2026-08-24, with the scoring rule
    unchanged since; the one occurrence, D-413 on 2026-08-31, went the conservative way
    and was fixed for a single checker
  severity: medium
  status: outstanding
  what: >-
    `run_one` (`run_negative_controls.py:434`) writes the mutation into a private worker,
    runs the control's command once, and scores it: pass if the command did not time out,
    exited non-zero, and printed the control's `expect` string. The command is never run on
    the unmutated snapshot. Nothing in the suite therefore establishes that the refusal it
    reports was caused by the mutation. What 155 passing controls demonstrate is "after
    this edit the command fails with this message", not "this edit is what makes it fail",
    and the difference is the whole content of a negative control.

    The gap opens whenever a checker fails inside a worker for a reason unrelated to the
    mutation -- a pruned input, a dead link, an absent environment. Three such conditions
    have already occurred, in `D-407`, `D-409` and `D-413`, and all three happened to be
    conservative: the checker's own failure message was not the `expect` string, so the
    control failed loudly and was found. Nothing makes that the direction.

    Demonstrated rather than argued, at `3018f454`. `devtools.check_canonical` reads
    `exp-003-baseline-n11-target.jsonl` for the wrong-basin `n = 11` packing that its
    central discrimination turns on; `archived_n11()` returns `None` when that archive is
    absent, and the caller does not skip -- it records `FAIL  Trump's basin differs from the
    annealer's  [no archive]` and the checker exits 1. Clone a worker the way the harness
    does, remove that one file the way pruning `campaign/series/*/results` would, and the
    unmutated checker goes from exit 0 to exit 1; hand the four canonical controls to
    `run_one` against that worker and all four are scored PASS, with empty detail. Their
    `expect` strings are their own mutations' `FAIL` lines, so each still requires its own
    message -- what none of them requires, and none of them notices, is that the checker
    was refusing before it was touched, and that the one discrimination the checker exists
    for was not performed in any of the four runs.

    One command of the forty distinct `run:` commands in `controls.yaml` is protected by
    hand. `tests/test_negative_controls.py::test_unmutated_results_checker_is_green_inside_a_worker`,
    added for `D-413`, clones a worker and requires `devtools.check_results` to exit 0
    unmutated. The mechanism is right and its scope is one checker; the other thirty-nine
    commands, over 50 mutation targets, have nothing.
  consequence: >-
    `155 negative controls fire as expected` is the only direct evidence this repository
    has that its guards catch what they were written for -- `check_control_anchors` is
    explicit that it checks only that anchors still resolve -- and that number is read as
    coverage. A control scored over a red baseline adds to it while establishing nothing
    about its guard, and does so invisibly: the runner prints the same line for it as for a
    control that fired.

    Bounded honestly: no control is currently known to be scored that way. The four
    canonical controls pass over a green checker in the real snapshot, which is why this is
    recorded outstanding rather than as a live miscount. What makes it worth an entry now
    is that the trigger is routine. Keeping the worker snapshot under its cap means pruning
    it, `D-422` is open on exactly that, and the direction `D-422` proposed first --
    pruning the results directory wholesale -- is the trigger. A fix chosen for one defect
    would have blinded four controls under the other, and the suite would have gone on
    reporting 155 of 155.

    The failure shape is one this log has now recorded at three levels: `D-144`, a checker
    comparing two copies of the same tuple; `D-424`, two rigidity controls computing their
    own verdicts without ever calling the instrument; and here the harness itself, scoring
    a refusal it never showed the mutation caused. This one is
    the weakest of the three in degree -- these controls can come out the other way, and do
    -- and the broadest in reach, because it applies to all 155 at once.
  fix: >-
    none yet. Recorded and left open; this session's mandate was the record, not the
    harness.

    The direction, and the cheaper of the two forms is the sharper one. Requiring the
    unmutated command to exit 0 catches a checker that has been degraded inside a worker,
    which is what `D-407`, `D-409` and `D-413` each were. But the condition that actually
    separates a caused refusal from a coincident one is weaker and more exact: the `expect`
    string must be absent from the unmutated run. Both want the same baseline run, so the
    honest version asserts both and reports them separately.

    Cost is why it was not free to begin with. The suite already takes about half an hour
    and a per-control baseline doubles it. It does not have to be per control: the 155
    controls share 40 distinct `run:` commands, so one baseline per command, cached across
    the controls that share it and taken once per worker, is 40 extra runs rather than 155.
    That is the shape worth pricing before anything is built.
  regression: none
  recurrence_of: D-413
  bead: think-g4qi
  recorded_in: packing/devtools/run_negative_controls.py
- id: D-428
  title: The n = 17 successor validator never ties the rebuilt chain spine to the carried boundary
  date: '2026-09-03'
  layer: verifier
  class: validity
  direction: flattering
  detected_by: review
  latent_for: one round and one review, from the successor's registration at 2f112f4c to the BC-149 reviewer's demonstration the same day; the record's overstatement then stood uncorrected until this entry
  severity: medium
  status: outstanding
  what: >-
    `validate_result` in `packing/cases/n17_weighted_certificate_successor/run.py` is a
    self-consistency check over the emitted record. For the complete-agreement schema it
    calls `_validate_agreement_body` (line 1453), which rebuilds all 181 hash-chain links
    from the two `CertificateManifest` summaries alone, anchored at the genesis binding
    hash (line 1491), and then compares the rebuild against `chain_spine`, `row_count` and
    `last_row_hash`. It never compares any link of that rebuild with `carried_boundary`.
    `validate_result` separately requires `carried_boundary.row_hash` to equal
    `binding.immediate_parent.last_row_hash` (line 1627), but that check reads the record's
    own boundary field and not the chain the summaries generate, so the two are never
    joined: a summary edit inside the carried prefix moves the rebuilt spine and leaves the
    boundary field standing.

    Demonstrated by the BC-149 reviewer, who altered carried row 5 identically in both
    summaries, rebuilt the spine and `last_row_hash`, left `carried_boundary` untouched,
    and had `validate_result` accept the record although `spine[169]` no longer equalled
    `8947b38e...`. Reproduced independently here on 2026-09-03 against the published
    exp-059 result: the unmodified record validates; with `evaluated_state_count` at
    ordinal 5 changed in both summaries and only `chain_spine` and `last_row_hash`
    recomputed, the rebuilt `spine[169]` is `3ae844bc...` while `carried_boundary` still
    reads `8947b38e...`, and `validate_result` accepts.

    The executed admission boundary does refuse this. `_validate_rows` ties the retained
    prefix to exp-056's checkpoint on disk before assembly, so the process that produced
    the published result could not have carried an altered row through. The gap is
    between what that process refuses and what the validator alone refuses, and the
    record claimed the stronger of the two.
  consequence: >-
    Nothing retained is wrong: the published exp-059 result satisfies the tie, the
    reviewer checked it directly and so did this reproduction, and H-052's acceptance
    rests on the executed run rather than on the validator.

    What it cost is a claim. `exp-059` asserted that the validator "requires it to
    reproduce ... the carried boundary `8947b38e...` at ordinal 169" and that "an altered
    manifest therefore cannot survive". A reader taking `validate_result` as sufficient
    evidence -- which is exactly what a later replay of the retained bytes would do, since
    the second frontier evidence entry for T-015 and T-016 verifies the retained hash chain
    rather than recomputing masses -- would be relying on a check that is not there. That
    is the flattering direction. `exp-059` is corrected in this pass; the code is not.
  fix: >-
    none yet. The record was corrected and the validator was left as it is, because this
    pass was bounded to the record.

    The repair the reviewer named is one comparison and one guard in
    `_validate_agreement_body`: require `spine[binding.first_new_ordinal - 1]["row_hash"]`
    to equal `binding.immediate_parent.last_row_hash`, and refuse otherwise. The same
    function could also pin `frozen_expectations` against `PRODUCTION_EXPECTATIONS` when
    the binding names exp-059, which closes the second of the three anchors the reviewer
    found the validator does not tie to the world; the third, comparing the binding's
    ancestor digests against disk, is a separate change because it needs a filesystem read
    the validator otherwise does not make.
  regression: >-
    none. The successor carries 115 named self-test guards, and one of them
    (`run.py:2828`) zeroes `carried_boundary.row_hash` and requires a refusal -- which is
    the check in the opposite direction, catching a boundary field that disagrees with the
    binding rather than a spine that disagrees with the boundary. No guard alters a carried
    summary row and rebuilds the chain around it, which is the mutation that passes. The
    repair above should land with exactly that mutation as its test.
  bead: think-g4qi
  recorded_in: packing/cases/n17_weighted_certificate_successor/run.py
- id: D-429
  title: The generated-view comparison folds an ellipsis but not the space the formatter puts before it
  date: '2026-09-03'
  layer: tooling
  class: robustness
  detected_by: inspection
  latent_for: >-
    since `fold` was written; no generated cell has carried an ellipsis until now, so the
    bug has never fired and is recorded before it does rather than after
  severity: low
  status: outstanding
  what: >-
    `fold` in `packing/devtools/render_research_tables.py` exists so a generated block's
    `--check` compares what a line *says* rather than its bytes, letting flowmark own the
    typography inside generated blocks without the renderer and the formatter overwriting
    each other on every run. Its `_FOLD` table maps `…` back to `...`, but flowmark
    does not only substitute the character: it inserts a space before it. `fold` then
    normalises runs of whitespace, so the formatter's ` …` folds to ` ...` while the
    renderer's source is `...` with no space, and the two never compare equal.

    The consequence is not a missed drift but an unresolvable one: a generated cell
    containing an ellipsis would report drift on every `--check`, a render would rewrite
    it, the formatter would rewrite it back at the next commit, and the pair would fight
    forever. That is the `ledger.md` / `defects.md` churn `.flowmarkignore` was written to
    stop, reappearing inside a block the formatter is allowed to touch.

    Found while adding the synopsis results headline, whose `T-011` row carries
    `3.877083590022814...`. Measured against the pinned flowmark-rs 0.3.2, which also
    curls the apostrophe in 8 of that block's 16 rows -- the reason that block compares by
    meaning rather than bytes in the first place.
  consequence: >-
    No view is currently wrong, because no other generated cell contains an ellipsis. The
    new headline renderer works around it locally by emitting the formatter's own ` …`
    form, so the block is a fixed point and its `--check` folds the space itself. That
    workaround is the evidence the shared helper is the wrong place for this to be solved,
    and it should be deleted when the helper is fixed.
  fix: >-
    One `.replace(" ...", "...")` inside `fold`, after the translation and before the
    whitespace normalisation, with a test that a cell rendered as `x...` still compares
    equal after the formatter has written `x …`. Deliberately not applied here: the
    helper backs the `--check` of several generated views, and a change to a shared
    comparison guard made unreviewed at the end of an unattended session is the shape of
    D-425. Recorded with its measurement so the fix is a five-minute job for a reviewed
    change rather than a rediscovery.
  regression: >-
    A test that renders a cell whose text ends in `...`, applies the pinned flowmark to
    the document, and asserts `--check` still reports the block current. Written against
    the formatter rather than against a hard-coded ` …`, so a future flowmark that stops
    inserting the space does not leave a test asserting the old behaviour.
  bead: think-ahyr
  recorded_in: packing/devtools/render_research_tables.py
- id: D-430
  title: The frontier prose kept saying sixty-three open cases rest on Nagamochi after the adoption made it sixty
  date: '2026-09-04'
  layer: docs
  class: bookkeeping
  detected_by: review
  latent_for: >-
    one day: from the 4.5058 adoption at 6734476d on 2026-09-03, which moved n = 17, 18
    and 19 off the closed form, until the Agenda 017 planning survey counted the cases
  severity: low
  status: fixed
  what: >-
    `packing/frontier/README.md` said that sixty-three of the sixty-five open cases carry
    Nagamochi's general closed form as their best proved lower bound and that exactly two
    are bespoke, and sixty-seven generated case bodies repeated "63 of the 65 open cases".
    The case records say sixty: the green17 certificate took n = 17 and n = 18 on
    2026-08-31 and the adopted Massaccesi certificate took n = 19 on 2026-09-03, and
    `validate.py`'s corpus-count step was updated to 60 with the adoption while the prose
    that quotes the number was not. The README's own heading says its counts are computed
    from the artifacts, and this one was typed. A dated review note on
    `E-nagamochi-lower` still says eighty-eight of the hundred, which was true when it was
    written and is left as the dated record it is; the checker's docstring carries the
    current eighty-five and the history.
  consequence: >-
    A reader of the front door of the frontier folder was told the adoption had not
    happened. No verified bound was wrong; the sentence describing which theorem carries
    them was, in the direction of understating what the repository had established.
  fix: >-
    The README states sixty and names the five bespoke cases; the sixty-seven case bodies
    say sixty; and `devtools.check_nagamochi_bounds` now reads both prose shapes and
    refuses any figure that disagrees with the count over the case records, so the next
    adoption that moves a case off the closed form fails the gate until the prose moves
    with it.
  regression: >-
    `check_nagamochi_bounds.prose_counts` compares the README sentence and every case
    body's "N of the M open cases" against the corpus, run inside the checker's gate step;
    `tests/test_nagamochi_bounds.py` plants a README with the stale figure and asserts the
    refusal names it.
  bead: think-tkwj
  recorded_in: packing/devtools/check_nagamochi_bounds.py
- id: D-431
  title: T-009's significance rationale compares its interval certificate against a different packing
  date: '2026-09-04'
  layer: record
  class: bookkeeping
  detected_by: review
  latent_for: >-
    since 2026-08-29, when the n = 29 interval certificate was registered with its
    comparative rationale, until the Agenda 017 planning survey re-ran the rational
    promotion on the Kingbird witness
  severity: medium
  status: outstanding
  what: >-
    The limitations of `E-n029-interval-certified-upper` in `packing/frontier/evidence.yaml`
    say the Krawczyk certificate is "tighter than E-n029-schadt-rational-upper by 5.2337e-5,
    which is the price each arithmetic regime charges for a certificate rather than a
    difference in the packing: robust rational promotion had to relax by 5.2e-5 to reach
    rational coordinates, this route by 5.4e-20", and T-009's significance rationale
    repeats the comparison. The two certificates are on different packings: the Schadt
    entry certifies Schadt's n = 29 packing at side 5.933885799813..., whose own
    limitations record a relaxation of about 4.93e-31 over its source decimal, while the
    interval certificate is on Kingbird's packing at 5.933833462676.... The 5.2337e-5 is
    the gap between two packings, not the price of an arithmetic regime. Re-running the
    shipped robust-rational promotion on the Kingbird witness (`packing-witness promote
    --strategy robust-rational --max-side-increase 1e-6`) during planning produced an exact
    rational certificate at side 5.933833462676929189689460616..., which is about 5.43e-20
    below the interval certificate's 5.93383346267692918974379895098 -- the rational
    route on the same packing is the tighter of the two, the opposite of what the
    rationale says.
  consequence: >-
    T-009's claim and its V4 rung stand: the interval certificate is a valid bound on
    s(29). What is wrong is the stated reason it is significant, and a reader comparing
    the two routes from the record would conclude the interval regime pays 5.4e-20 where
    rational promotion pays 5.2e-5, when on this packing both pay under 1e-19 and the
    rational one pays less. The same finding reaches T-009's declared next rung: the
    rational certificate is repository-origin exact-algebraic evidence by a different
    method, so registering it raises T-009 to C4 by the register's own definition.
  fix: >-
    Register the Kingbird rational certificate as its own evidence entry, rewrite the
    interval entry's limitations and T-009's rationale to compare the two routes on the
    same packing with both relaxations stated, and raise T-009 to C4 through the results
    checker rather than by hand. Deferred to BC-165 of Agenda 017, which records the
    same command's certificates at ten further sizes and owns the evidence family they
    join.
  regression: >-
    A results-checker rule that a `next_rung` or significance rationale naming a second
    evidence entry as a comparator must cite an entry whose witness is the same packing
    (same source witness id), so a cross-packing comparison is refused at registration.
  bead: think-stb5
  recorded_in: packing/frontier/evidence.yaml
- id: D-432
  title: The push tier keeps the 900-second cap when its selector picks the whole suite
  date: '2026-09-04'
  layer: tooling
  class: robustness
  detected_by: gate
  latent_for: >-
    since BC-086 made `--push` select reachable tests, with the whole-suite fallback
    inheriting the shared subprocess cap; it first fired on 2026-09-04 when a change set
    touching the pull-request template made the selector choose everything
  severity: medium
  status: fixed
  what: >-
    `packing-validate --push` runs `devtools.reachable_tests --run --since origin/main`,
    which selects the tests a change can reach and falls back to the whole
    non-exhaustive suite when a file that configures the suite changed. The fallback
    ran under the step's default 900-second subprocess cap and was killed at 84% with
    the summary "command timed out after 900 seconds"; the full suite measured 1,210 s
    green on 2026-09-03 and the two full-suite steps of the complete gate were given
    1,800-second budgets that day, while this step kept the shared default. On the
    Agenda 017 planning branch the change set included `.github/PULL_REQUEST_TEMPLATE.md`,
    which the selector reports as "configures the suite", so the tier could not finish
    on two consecutive runs of about 917 s each, and the one failing test it did reach
    could not be named from its own output.
  consequence: >-
    The pre-push floor is unusable as a floor for exactly the change sets that most
    need it -- anything touching a suite-configuring file -- and a coordinator who
    reads "1 STEP FAILED" learns neither which test failed nor whether the suite would
    have passed. On this branch the one failure that did surface before the kill was
    D-422's snapshot-cap assertion, which is red on any used checkout and green on a
    fresh clone; the tier gave no way to tell that from a regression.
  fix: >-
    Fixed on the port branch, 2026-09-05: the step `--push` builds carries
    FAST_SUITE_BUDGET_SECONDS -- 1,800 s, the budget `fast behavioral tests` declares,
    now one constant both steps read -- when its selector reports everything, and keeps
    the shared 900 s cap for a true subset. The prescription's second half, naming the
    failing test from a killed run, is not implemented and is not needed for this
    failure: with the budget in place the whole-suite fallback finishes. Re-measured on
    the merged tree with the integer sweep in place (d8733ad0): 1,034 s on
    four cores at 1,781 passing tests, 996 s on CI's two-core runner, against
    the 1,210 s of 2026-09-03 and an 1,800 s budget. The exhaustive tier, measured
    beside it, ran in 930 s locally and 892 s on CI's runner -- eight seconds under the
    900 s cap it had been inheriting -- so it now carries a budget of its own, 1,800 s,
    twice the measurement. Ported from PR 80's F13 with its 2,700 s and 21,600 s
    dropped: the first rested on a 1,791 s measurement of the Fraction sweep the same
    day and sits above the 1,800 s CI allows the job; the second on a 4,866 s exact
    decision the integer sweep made a 30 s one.
  regression: >-
    test_push_tests_take_the_whole_suite_budget_only_when_the_selector_expands, which
    builds the push step against a selector reporting everything and against one
    reporting a subset, and asserts the whole-suite budget on the first, the shared cap
    on the second, and that the budget is the constant `fast behavioral tests` reads.
  bead: think-jzqi
  recorded_in: packing/devtools/reachable_tests.py
- id: D-433
  title: The certificate rationaliser floored its weights while its docstring said it rounded up
  date: '2026-09-04'
  layer: tooling
  class: robustness
  detected_by: review
  latent_for: >-
    since sqpack.fractional.generate was written on 2026-09-04, about four hours; found
    the same day by the strategy review reading the function against its docstring
  severity: medium
  status: fixed
  what: >-
    `rationalise` in `packing/src/sqpack/fractional/generate.py` computed each atom's
    integer weight as `-((-raw * scale).__ceil__())`, which is `floor(raw * scale)`, three
    lines under a docstring that says "round up to a multiple of 1/scale" and explains
    that rounding up "is what keeps the coverage rows valid after rationalisation". The
    `max(units, 1)` guard beneath it masked the error on small weights, which is how it
    survived the n = 12 certifications at 19/5 and 77/20: those happened to land on
    weights the floor did not move.
  consequence: >-
    No retained result is wrong. The exact verifier decided every accepted certificate
    and is unaffected; the bug could only weaken a candidate, never strengthen one. What
    it did was refuse certificates the program had found. The n = 12 candidate at side
    39/10 converged at 11.921565 with 0.078 of margin, rationalised to 20591/1728 =
    11.916088 -- below the linear program's own optimum, which is the signature -- and
    was refused at least cell mass 3395/3456 = 0.98235, the whole deficit being
    round-down loss. The n = 17, 18 and 20 searches launched with the flawed step were
    stopped and relaunched after the fix rather than read as negatives.
  fix: >-
    `units = math.ceil(raw * scale)`, with the comment stating why floor is exactly
    wrong here: every coverage row the solver leaves tight sits at exactly 1. Committed
    with the strategy review's finding the same hour. A first attempt at the same fix,
    made from the n = 12 run's own refusal at scale 576 earlier in the day, printed its
    success and never reached the committed file; the review found the line unchanged.
  regression: >-
    `tests/test_fractional_certificate.py::test_rationalise_rounds_weights_up_never_down`
    feeds three weights the floor gets wrong (5.3, 0.5 and 1000.001 units) and asserts
    each lands on the next multiple above.
  bead: think-yw5g
  recorded_in: packing/src/sqpack/fractional/generate.py
- id: D-434
  title: The covering LP's separation oracle sees fewer placements than the verifier decides
  date: '2026-09-04'
  layer: tooling
  class: validity
  direction: conservative
  detected_by: inspection
  latent_for: >-
    since sqpack.fractional.generate was written on 2026-09-04, about five hours; found
    twice in one hour, independently, by a measurement here and by the column-generation
    lane's own test
  severity: high
  what: >-
    `generate._worst_cells` and `colgen.placement_cells` score an event cell when the
    cell's centre, rotated back, lies in the admissible centre domain. `sweep.reduce_to_cells`,
    which `certificate.verify` uses to decide Condition 5, scores every cell whose v-range meets the
    domain's v-extent within the u-slab. The second set strictly contains the first.
    Measured on the retained 113-atom certificate at L = 77/20: identical at directions 0
    and 1, and 432, 452 and 456 extra cells at directions 45, 90 and 180 -- 1.1 to 1.2 per
    cent. The column-generation lane found the same thing from the other side, on a small
    instance at L = 11/5 where the oracle reports 2.125 and the sweep 2.
  consequence: >-
    The linear program converges with every placement it can see at mass 1 and is then
    refused by Condition 5 on a placement it was never shown. Both n = 12 pushes to side 39/10 died
    this way with margin in hand: 11.921565 refused at least cell mass 3395/3456, and
    11.869187 refused at 3083/3125 after column generation. The direction matters and is
    the reason this is filed conservative rather than flattering: the oracle never invents
    a violation, so every row it does emit is sound and every certificate the exact verifier
    accepted stands, `T-017` included. What the gap costs is candidates, not correctness --
    the search optimises against a weaker constraint set than the verifier enforces.
  fix: >-
    Fixed on 2026-09-04, in the oracle, after the prior question this entry raised was
    settled the other way: the verifier is right. `sweep.reduce_to_cells` scores exactly
    the event cells whose open interior meets the closed centre domain, which is what Condition 5
    must quantify over -- coverage by closed squares is upper semicontinuous, so the open
    and closed domains share an infimum and that infimum is attained on an open cell
    meeting the domain, and the per-slab v-extent is exact by convexity. Checked in exact
    arithmetic on the retained 113-atom certificate: the sweep's cell set equals the
    "open cell meets the domain" set, decided independently by polygon clipping and
    positive area, at directions 0, 1, 45, 90 and 180. `sweep.py` and `certificate.py`
    were not touched.
    What changed is `generate.py`'s oracle: a float mirror of the reduction that decides
    reachability from the domain's edge lines per slab and, crucially, emits each row at a
    point inside cell-intersect-domain rather than at a cell centre that can lie outside
    the container. That last detail is why an earlier "meets the domain" attempt reported
    13.5 and 15.4 on a configuration whose accepted certificate carries 11.9375.
    The decisive check: on the reproduced old-oracle candidate the old oracle reports
    1.000025 and sees no violation, while the new one reports 0.945515 at direction 67 --
    the sweep's own exact value.
  regression: >-
    `tests/test_fractional_generate.py` asserts on three configurations, all including
    diagonal directions, that the oracle's minimum equals the sweep's and that its cell
    set contains the sweep's, and that generated rows land inside the domain. The refused
    candidate the bug produced is retained as a must-refuse fixture.
  status: fixed
  bead: think-yw5g
  recorded_in: packing/src/sqpack/fractional/generate.py
- id: D-435
  title: An enclosing interval run accepted a certificate whose least mass it had pinned below one
  date: '2026-09-04'
  layer: verifier
  class: soundness
  direction: flattering
  detected_by: inspection
  latent_for: >-
    since sqpack.fractional.interval was written on 2026-09-04, about three hours; found
    by reading the acceptance path before registering the verifier as C4 evidence, not by
    any test
  severity: high
  what: >-
    `interval.verify_by_intervals` decided Condition 5 from the branch-and-bound status alone:
    `holds` when every direction came back `certified`. But `certified` means only that
    the search resolved every box against the threshold it was run with, and the two
    modes run different thresholds. Without `enclose` the threshold is mass 1, so
    `certified` does mean Condition 5. With `enclose` the threshold is the best point value seen
    so far, which the search keeps lowering, so `certified` means the minimum was pinned
    exactly and says nothing about whether the pinned value reaches 1.
  consequence: >-
    An enclosing run over the retained n = 12 atoms with one atom lightened by 1/10000
    returned `accepted` with a width-zero enclosure at 99993/100000 -- the true minimum,
    correctly measured, and below 1. The measurement was never wrong; the verdict drawn
    from it was. No retained claim rested on this: every full-net test also asserts the
    enclosure value, and all three are at or above 1 (50003/50000 at n = 11, 100003/100000
    at n = 12, exactly 1 for the Massaccesi control), while the sub-net acceptance tests
    run the mass-1 threshold. The exact verifier is untouched and decides every retained
    certificate independently. But the gap was in the property whose name is the whole
    contract, and a future certificate checked only by an enclosing run would have been
    accepted on a false verdict.
  fix: >-
    Fixed on 2026-09-04. `verify_by_intervals` now requires, on top of every direction
    certifying, that each direction's certified lower bound reach mass 1, and reports
    `fails` rather than `holds` when a pinned minimum falls short -- an exactly enclosed
    minimum below 1 is a refutation, not an open question. The comparison is `>=` on the
    integer mass scale, so the Massaccesi control at exactly 1 still passes, which is the
    boundary the fix had to preserve.
  regression: >-
    `tests/test_fractional_interval.py::test_an_enclosed_run_refuses_a_minimum_it_pinned_below_one`
    runs the lightened certificate under `enclose` and asserts the direction still comes
    back `certified`, the enclosure is still the true 99993/100000, and the verdict
    refuses on Condition 5 -- so it pins the distinction rather than the outcome. The lightened
    fixture both refusal tests share is now one helper.
  status: fixed
  recorded_in: packing/src/sqpack/fractional/interval.py
- id: D-436
  title: The third-party package misnamed its own control and refused malformed files by traceback
  date: '2026-09-04'
  layer: verifier
  class: bookkeeping
  detected_by: review
  latent_for: >-
    since the package shipped in c68c1616 on 2026-09-04, about two hours; found by an
    adversarial review commissioned to read it as a hostile third party would
  severity: medium
  what: >-
    Three statements the package made about itself were wrong. Its README twice called
    the enlarged-container falsification row "the control" -- once when explaining why
    the printed cell count is worth reading, once in the objections section -- but the
    control is Massaccesi's published n = 17 certificate, whose least covered weight is
    exactly 1. The row that demonstrates cells beyond the atoms' reach are scored is the
    side-4 falsification, whose least weight is 0. A reader taking "control" in the
    README's own defined sense would look for a 0 in the control's output and not find
    one. Second, the README promised a labelled refusal for any file not of the expected
    form, but a float where an exact rational was required, a zero direction_steps, or an
    atom row with fewer than three entries raised ValueError, ZeroDivisionError or
    IndexError instead. Third, "nothing short-circuits" was true of Condition 1 to Condition 5 but not of
    the preconditions, which return before them.
  consequence: >-
    None of it can change a verdict, and the review that found them says so: exit status
    was already 1 on every malformed file, so no false acceptance was possible, and
    check.py still reported the step as failed. What it costs is the thing the package
    exists for. The package's whole claim is that a stranger can decide s(11) >= 19/5
    without trusting this project, and a stranger who reads a promise about behaviour and
    then sees a traceback has been given a reason to doubt the parts they cannot check as
    easily. A misnamed control is worse still, because the control is the one artifact
    that tests the verifier rather than the certificate.
  fix: >-
    Fixed on 2026-09-04, in the package rather than in the prose alone. Both README
    sentences now name the falsification row and say what the control actually is. The
    verifier validates the atom shape and the wholeness of n and direction_steps where
    the file is read, and its entry point catches the parse and shape errors and prints
    "REFUSED: not a certificate of the expected shape" with the offending value; a file
    that cannot be opened at all reports a usage error and exits 2, because that is not a
    refusal. The short-circuit sentence now distinguishes the conditions from the
    preconditions. Four cosmetic findings in the same review were left as they are and are
    recorded in it: a claim string that must be in lowest terms, a zero-weight asymmetric
    atom refused by Condition 1, a degenerate direction that raises where it would be vacuous, and
    disagreeing timing prose, which was aligned.
  regression: >-
    The four malformed files the review named -- a decimal outer_side, direction_steps
    zero, a two-entry atom row, and n = 11.9 -- each return exit 1 with a labelled REFUSED
    naming the field, and a missing file returns exit 2. Re-run as a stranger would, from
    a copy outside the checkout under `env -i`, the package still verifies: the
    certificate at 50003/50000 over 90,546,593 cells and the control at exactly 1 over
    16,562,293, both VERIFIED, check.py exit 0.
  status: fixed
  recorded_in: docs/project/reviews/review-2026-09-04-t018-thirdparty-package.md
- id: D-437
  title: A strong-duality test asserted float equality and failed on half of CI runs
  date: '2026-09-04'
  layer: tooling
  class: robustness
  detected_by: gate
  latent_for: >-
    since tests/test_fractional_generate.py was written on 2026-09-04, about eight hours,
    of which roughly a third of the block was spent chasing it
  severity: high
  what: >-
    `test_the_dual_of_a_converged_solve_matches_its_objective` asserted strong duality as
    an exact float comparison, `float(solution.duals.sum()) == np.float64(solution.objective)`.
    Strong duality is exact over the rationals, but both sides are float sums the LP solver
    accumulates in an order it chooses, and the two orders need not agree to the last bit.
    CI failed it at 4.000000000000001 against 4.0 -- one ulp.
  consequence: >-
    It passed locally every time and failed on roughly half of CI runs: red at 4482cf7a,
    green at 31775018, red again at 2cd9d7ef on a commit that changed one README. The
    alternation was misread as a real failure that some intervening change had fixed,
    which is worse than a test that fails every time, because it invites a causal story
    about the commits either side of it.
    The cost was not the defect but the search. It sat behind the 1800 s timeout (D-438's
    subject) until the fast tier was trimmed, and after that it was in every failing log
    -- as `command exited 1`, the assertion text, and a `FAILED tests/...` line -- about
    640 lines from the end of a 748-line file. Four log fetches read the tail and stopped
    short of it. Two causes were proposed from reasoning instead and both were wrong, and
    a third, that packing-validate hides pytest output, was wrong too and had to be
    retracted from the pull request body. `_run` appends a failed subprocess's output to
    its failure detail; the record was complete throughout.
  fix: >-
    Fixed on 2026-09-04. The comparison is now scale-relative, `abs(dual_total - objective)
    <= 1e-9 * max(1, abs(objective))`, with the failure message printing both values and
    the gap. A duality gap that meant anything would be many orders of magnitude larger
    than that tolerance, so the test gives up nothing and stops depending on which order
    HiGHS happened to sum in.
  regression: >-
    The test passes in 0.51 s and the whole of tests/test_fractional_generate.py in 72 s.
    The tolerance is relative to the objective's scale, so it holds at the larger
    objectives the n = 12 and n = 17 ladders reach rather than only at the value 4 this
    fixture produces.
  status: fixed
  recorded_in: packing/tests/test_fractional_generate.py
- id: D-438
  title: The fast test tier outgrew its budget as the certificates grew, and hid a failure
  date: '2026-09-04'
  layer: tooling
  class: performance
  detected_by: gate
  latent_for: >-
    accumulated across the block as the ladders were climbed; first fatal once the
    certificates passed roughly 600 atoms
  severity: high
  what: >-
    `packing-validate`'s `fast behavioral tests` step consumed its entire 1800 s cap:
    1801.01 s against a 1801.84 s total, while every other step in the tier ran in under
    40 s. The cost scales with the atom count, and the certificates grew by an order of
    magnitude during the block -- Massaccesi's 168-atom fixture decides in about 25 s,
    which is why full 181-direction decisions looked affordable when these tests were
    written, but the retained n = 12 certificate reached 681 atoms and n = 11's
    calibration rung 373, both still deciding on the full net in the fast tier. Measured
    against the n = 17 pair at 708 atoms, which takes about thirteen minutes, those two
    alone accounted for most of the budget; four full doubled-net interval runs at 361
    directions each finished it off.
  consequence: >-
    Two costs, and the second was the larger. CI was red, and the timeout truncated pytest
    before it printed a summary, so the genuine test failure underneath it (D-437) had no
    name for hours. Every run either timed out without naming a test or was cancelled by a
    push. Fixing the budget did not fix CI; it made CI able to say what was wrong, which
    is a different thing and was reported as such.
  fix: >-
    Fixed on 2026-09-04 in 4482cf7a. Nine full-net decisions moved behind the
    `exhaustive_exact` marker -- five exact sweeps and four interval doubled-net runs --
    each declared in the registry with what it costs. Nothing is lost: every one keeps a
    fast counterpart in the same file that pins what its record claims, or decides it on a
    coarse net. The tier went 1801 s to 1101 s to 948 s.
    One of those fast counterparts was wrong on the first attempt and the way it was wrong
    is worth keeping: deciding the calibration rung on a coarse net by slicing the
    half-tangents asserted the whole verdict, which fails, because a net that coarse fails
    Condition 4 by construction -- D grows with the gap and B(1 + D) then exceeds 1. The rung test
    beside it had solved this already by asserting Condition 5's value rather than the verdict.
    Coverage is the claim a coarse decision can carry; containment is not.
  regression: >-
    The fractional tier runs 85 tests in 176 s with 9 deselected, and the whole
    non-exhaustive suite 1699 tests in 831 s locally. The marker registry test pins every
    marked node by name, so a future slow decision cannot join the fast tier silently.
  status: fixed
  recorded_in: packing/tests/test_module_boundaries.py
- id: D-439
  title: Three records described the top rung, and the top rung moved out from under them
  date: '2026-09-04'
  layer: docs
  class: bookkeeping
  detected_by: inspection
  latent_for: >-
    from c68c1616, when the package shipped against a top rung of 19/5, until the ladder
    advanced to 381/100 later the same day -- about six hours, spanning one adversarial
    review that read the file line by line and did not catch it
  severity: medium
  what: >-
    Three statements in durable records described "the top rung" and were left behind
    when the ladder advanced past them. All three were true when written and none was
    edited; what changed was the thing they pointed at.
    First, the third-party package's file table described its own `certificate.json` as
    "byte-identical to `../certificate.json`" and printed the SHA-256 to let a reader
    check it. `../certificate.json` is the case's top rung by construction -- retention
    replaces it each time the ladder advances -- so when n = 11 moved from 19/5 to
    381/100 the sibling became a different file with a different hash, and the package's
    own copy stayed where it was.
    Second, T-019's significance rationale gave the movement past Massaccesi as 0.0042.
    That is 451/100 - 22529/5000, the first rung's movement; the retained value is
    229/50 and the movement is 0.0742, as the claim body two fields above it correctly
    says. The record contradicted itself across two fields.
    Third, T-019's next_rung described the headroom below seventeen using 451/100's
    figures -- "the certificate's total is 16.5936, leaving 0.406" -- as though they were
    the retained certificate's. The retained total is 3393147/200000 = 16.965735 and the
    margin is 0.034265, an order of magnitude smaller, so the field understated by ten
    times how tight the case had become. That passage also inferred a rate of ascent
    ("about 0.075 per 0.01 of side") from two points on different site sets, which the
    ladder does not support: margin is not monotone in the side, and n = 12 moves the
    other way over its top two rungs, 0.007175 at 197/50 then 0.029410 at 79/20.
  consequence: >-
    Records only; no bound, certificate or verdict is affected, and the package itself
    was never at risk, since `check.py`, `verify.py` and `falsify.py` read nothing
    outside their own directory and a stranger running it got the right answer
    throughout. The costs are of two kinds.
    The package broke the one claim in the file a sceptical reader tests first, in a
    document whose entire purpose is to be checkable without trusting this project.
    `sha256sum` on the two files disagrees in the first byte, so a reader who ran the
    check the file invites would have found the package contradicting itself with no way
    to tell a stale pointer from a swapped certificate.
    The two T-019 fields are worse in a quieter way. Nothing about them looks wrong: both
    are exact figures about real artifacts, they simply describe a rung that is no longer
    the top one. The next_rung error in particular would have steered the next session
    away from n = 17 -- 0.406 of headroom invites another rung, 0.034 says the case is
    nearly spent -- and the invented rate of ascent would have made the misreading look
    quantitative.
  fix: >-
    Fixed on 2026-09-04. The package table now names `../certificate-19-5.json`, the
    immutable rung file, which is what the hash was always of, and says in the same cell
    that `../certificate.json` is the moving top-rung pointer and now carries 381/100.
    T-019's rationale now reads 0.0742, and its next_rung is rewritten around the
    retained certificate's own total and margin, both recomputed from the artifact rather
    than carried over; the unsupported rate is gone, replaced by the non-monotonicity the
    two ladders actually show.
    The general rule the miss teaches: a durable record points at a name whose meaning is
    fixed and quotes figures it re-derives from that name, never at or from whatever
    currently sits at the frontier. Retention ladders here supply both kinds --
    `certificate-19-5.json` never changes, `certificate.json` changes on every rung -- so
    prose that cites a hash or a mass must cite the first kind.
    The detector this argued for was then built, the same day, and is
    `devtools.check_rung_figures` in the records tier. It recomputes each result's
    certificates from their own atoms -- side, atom count, total mass and margin, all
    exact, never the file's stored summary -- and checks the result's prose against that.
    Two classes: every `a/b = d.ddd` anywhere in results.yaml, evidence.yaml and
    defects.yaml must be arithmetically true, and a quoted total, margin or atom count
    is compared only where a rung reference anchors it to one of that result's own
    artifacts, so a figure cited for contrast is left alone rather than guessed at. It
    refuses the reconstructed 0.0042 and the 451/100 total and margin, and it found
    nothing else in the tree.
  regression: >-
    tests/test_rung_figures.py, fourteen nodes, including both reconstructed T-019
    figures and a false positive the first draft produced -- T-017's claim states its
    single rung twice for two purposes, which a naive "two fractions means a movement
    claim" gate misreads, so the gate requires the two to be distinct.
    One part stays uncovered and is not claimed: the package's byte-identity error is
    about a file hash rather than a quoted figure, and the checker reads no hashes.
    The class is worth the check because it is invisible at review. The adversarial
    review that read the package line by line
    (docs/project/reviews/review-2026-09-04-t018-thirdparty-package.md) ran twenty-one
    attacks and missed its instance, because at the time the sentence was true; the
    error appears later, without an edit, which is why it wants a check that re-derives
    rather than a reviewer who re-reads.
  status: fixed
  recorded_in: packing/frontier/results.yaml
- id: D-440
  title: A confirmation rung rested on a decision no control ever made
  date: '2026-09-04'
  layer: record
  class: bookkeeping
  detected_by: inspection
  latent_for: >-
    from the moment T-019 was raised to C4 on 2026-09-04 until the same day, a few hours,
    and found only because an unrelated claim in SYNOPSIS.md was being checked against
    its evidence rather than taken on the record's word
  severity: medium
  what: >-
    T-019 stands at C4, and C4 requires two evidence entries with different method
    values. Its second is E-fractional-interval-decision, whose scope lists n = 17, 18
    and 19. But the entry's own results list decided no first-party n = 17 certificate:
    it named n = 11 at 19/5, n = 12 at 197/50 and 393/100, and Massaccesi's published
    n = 17 certificate, which is the control that tests the verifier and not this
    project's bound. The replay command the entry names,
    `pytest tests/test_fractional_interval.py`, matched that -- the only n = 17 nodes in
    the file decided Massaccesi's control on the sub-net and on the full doubled net.
    Nothing decided the retained 229/50 certificate by the interval route, and nothing
    would have noticed if the claim had been false.
  consequence: >-
    None to the bound, as it happens. Running the decision settles it: the retained
    n = 17 certificate is accepted on all 361 doubled-net directions in 2,653,407 boxes
    with none stalled, and its enclosure of the least covered mass has width zero at
    12501/12500, exactly the least_cell_mass the certificate declares. So the C4 rung was
    earned; it simply was not checked.
    The cost is what an unchecked rung is worth. A confirmation level is a claim about
    evidence, and the whole point of recording it is that a reader need not re-derive it.
    Two other results were pinned by exhaustive nodes and this one was not, so the
    difference was invisible from the register: three results at C4, two of them guarded.
  fix: >-
    Fixed on 2026-09-04.
    `test_the_retained_n17_certificate_is_accepted_on_the_full_doubled_net` decides the
    retained certificate on every direction and asserts the enclosure against the
    least_cell_mass its own record declares, matching the shape of the n = 11 and n = 12
    nodes beside it; it is registered in the exhaustive_exact marker registry, which now
    pins ten nodes. E-fractional-interval-decision's results list is rewritten around the
    three retained top rungs rather than the lower ones it had been left describing --
    n = 17 at 229/50 in 2,653,407 boxes, n = 12 at 79/20 in 2,666,151, n = 11 at 381/100
    in 1,570,831 -- with the earlier rungs and the control kept below them. Wall times are
    dropped from the entry: box counts are deterministic and comparable, and every one of
    these runs shared a contended machine.
  regression: >-
    The marker registry test pins the new node by name, so it cannot leave the exhaustive
    tier silently. What has no check is the general shape: an evidence entry whose scope
    claims an n its replay never decides. The narrower rule that would have caught this
    one -- every n in an evidence entry's scope should be decided by something the entry's
    own replay runs -- is worth building and is not built.
  status: fixed
  recorded_in: packing/tests/test_fractional_interval.py
- id: D-441
  title: The generator decided its candidate before writing it, so a kill lost the candidate
  date: '2026-09-04'
  layer: tooling
  class: robustness
  detected_by: inspection
  latent_for: >-
    from the first generator run on 2026-09-04 through every rung this block climbed;
    noticed only when a candidate appeared whose exact decision would take about two
    hours and the question "what happens if I stop this" had an answer nobody wanted
  severity: medium
  what: >-
    The column-generation drivers rationalised their solution, ran the exact event-cell
    sweep on the in-memory object, and wrote the JSON only inside `if v.accepted`. So the
    bytes existed only after the most expensive step in the pipeline had already passed.
    Two consequences follow from that ordering and neither is about correctness.
    A run killed inside the sweep loses the candidate outright -- the site set survives in
    the checkpoint, but recovering the atoms means re-solving the linear program, twenty
    minutes or more, to arrive at weights the process had already computed.
    And the cheap route cannot run first. The interval decision settles a certificate in
    tens of seconds where the exact sweep takes minutes to hours, and it is enough to
    reject; but it needs a file, and there was no file until the slow route had finished.
    The ordering also contradicted the project's own retention rule, which says to freeze
    the bytes and decide those, never the object in memory -- the rule that exists because
    a generator once rewrote its output between verification and retention, turning 1032
    atoms into 1121 under a path someone was about to read.
  consequence: >-
    No retained bound is affected: every certificate in the record was decided from frozen
    bytes by the reload step that followed, and the reload is what the record cites.
    The cost is in what cannot be done while a sweep runs, and it has not yet been paid in
    lost work. An earlier revision of this entry said it had: about forty minutes after
    the entry was written the session's container restarted, the harness reported every
    background task stopped, and this was recorded as having taken two candidates with it
    -- n = 12 at 99/25, 2097 atoms, and n = 17 at 459/100, 1184 atoms. That was wrong and
    is corrected here. What the restart stopped were the harness's own watchers; the four
    solver processes were never children of the session and kept running throughout, and
    `ps` showed all four still accumulating processor time. Four duplicate lanes were
    launched against the survivors before that was checked, and were stopped.
    The exposure the entry describes is real and unchanged: nothing is written until the
    sweep has already passed, so a process that does die inside it loses its candidate,
    and the cheap interval route cannot pre-screen a file that does not exist. What is not
    yet demonstrated is a loss, and the entry should not have claimed one.
  fix: >-
    Fixed on 2026-09-04 in the parametrised driver. The candidate is written the moment it
    is rationalised, before any decision, and the exact sweep then runs on the reloaded
    file rather than on the object; `least_cell_mass` is added to the record afterwards,
    when there is a verdict to record. The run prints the frozen path and points at
    `devtools.decide_certificate`, which is the gate the file then has to pass.
    Freezing first is not a weaker check. The reload was already there and already decided
    the bytes; what changed is that the bytes now exist whether or not the decision
    finishes.
    The two drivers that were briefly reported as having lost candidates carried the old
    ordering because they predate the parametrised one and were not touched by the first
    fix; neither in fact lost anything. They are superseded rather
    than patched: recovery from a checkpoint now goes through the rescale driver, which
    freezes each candidate to its own path before deciding it and hands the file to
    `devtools.decide_certificate`. A driver that cannot produce a file for that tool is a
    driver that should not be run.
  regression: >-
    None automated -- this is a driver in the session scratchpad, not repository code, and
    the repository's own retention path is devtools.decide_certificate, which takes a path
    and cannot be handed an in-memory object at all. That tool is the durable form of the
    rule; the driver now hands it a file.
  status: fixed
  recorded_in: packing/devtools/decide_certificate.py
- id: D-442
  title: A case body kept quoting a bound its own front matter had already moved past
  date: '2026-09-04'
  layer: record
  class: bookkeeping
  detected_by: inspection
  latent_for: >-
    six hours at n = 17, n = 18 and n = 19, from the T-019 retention on 2026-09-04 until
    the T-020 retention the same evening went to update the same files; and, in the
    second instance below, from the T-019 retention until the same read
  severity: medium
  what: >-
    A frontier case file is two records in one document: YAML front matter, which is
    machine-checked, and hand-written Markdown prose below it, which is not. Retaining a
    result updates `verified_lower_bound` in the front matter of every case it moves. It
    does not update the prose, and nothing checked that the two agree.
    So after T-019 moved n = 17, n = 18 and n = 19 to 459/100, all three bodies still
    opened by telling the reader the verified lower bound was 22529/5000 = 4.5058, with
    n = 18's and n = 19's still explaining that the bound is inherited by monotonicity
    from a certificate they no longer depend on. The front matter said one thing and the
    sentence a human reads first said another.
    Two further instances of the same class were found in the same read, in places the
    existing detector does not look. `T-019`'s own `next_rung` described "this
    certificate's 16.965735" -- the mass of the 229/50 rung, quoted as the retained
    459/100 rung's, whose mass is 423327/25000 = 16.933080. `check_rung_figures` covers
    exactly this and missed it, because it recognises a total written as "the total is
    X" and not one written as a possessive. And `test_the_n17_certificate_does_not_reach_
    n20` had a docstring naming 459/100 over an assertion testing 229/50; both integer
    comparisons are true, so no test failed when the rung moved underneath it.
    A fourth instance was found by the detector itself, on its first run over the live
    corpus, in a case nobody in this session had touched: n-029's opening paragraph
    reported the verified upper bound as 5.93388579981302587863645209, the ceiling that
    case held before T-009 replaced it with 5.93383346267692918974379895098 -- a value
    the very next section of the same document states correctly. The paragraph also
    explained a discrepancy that no longer exists, the two bounds now differing by
    9.18974379895098E-15 rather than by the fifth decimal.
  consequence: >-
    No bound is wrong and no verdict changes. Every affected statement was true when it
    was written and each named a real, correctly computed figure; what drifted is which
    object the figure describes. The cost is to a reader, and it is not small: the case
    body is the document a person opens to learn what is known about a size, and for six
    hours it under-reported three cases by 0.0842 and attributed them to the wrong
    certificate.
    This is `D-439` recurring, six hours after `D-439` was recorded and its detector
    built. That is the finding worth keeping. The detector answered the surface the defect
    was found on -- the results register -- and the same failure simply moved to the two
    surfaces beside it, the case bodies and the tests. A durable record has more than one
    place to describe a rung, and each one needs its own check or it will be the next one
    to go stale.
  fix: >-
    Fixed on 2026-09-04. The six affected case bodies (n = 17 through n = 21, and
    n = 29) are rewritten against their own front matter, with the displaced bounds kept
    as history and marked as displaced rather than deleted. T-019's possessive figure is corrected to
    the retained certificate's own mass, and the n = 17 test's assertion is brought onto
    the rung its docstring names.
    The durable part is `devtools/check_case_prose.py`, which reads every case file's
    front matter and its prose and refuses any quoted bound on that file's own n that
    disagrees with the record, allowing a weaker figure only where the sentence marks it
    as history.
  regression: packing/tests/test_case_prose.py
  status: fixed
  recorded_in: packing/devtools/check_case_prose.py
- id: D-443
  title: A generated document counted stop reasons its own sources do not record
  date: '2026-09-04'
  layer: record
  class: bookkeeping
  detected_by: review
  latent_for: >-
    about an hour, from the commit that generated the section to the sub-agent report
    that checked it against the record
  severity: low
  what: >-
    frontier/CERTIFICATE-REACH.md's new attainment section hedges its own extrapolation,
    and one of the hedges was itself unchecked. It said two of the three runs behind the
    ratio were halted on projected cost and only one ran its covering search to a
    converged optimum. The record says otherwise, and says it plainly in the three
    results' own next_rung fields: T-018's n = 11 run "ran the loop to convergence --
    three row rounds, 25318 rows, final oracle least mass exactly 1"; T-020's n = 19 run
    was "halted at round 9 ... because four more rounds would have cost about 3.75 h";
    and T-019's n = 17 build has no stop reason recorded at all -- the stop its next_rung
    narrates belongs to an adjacent probe at n = 18, at a different side, on a different
    site set.
    So the count was wrong in both halves: one converged rather than one being the
    exception, and one was halted on cost rather than two.
  consequence: >-
    Nothing downstream depends on it. The ratio, the mean, the predicted column and the
    ranking are all derived arithmetic and are unaffected; what was wrong is a sentence
    about provenance, in the paragraph whose whole job is to stop a reader trusting the
    ratio too far. That is the part worth recording. A hedge that misstates its own
    evidence is worse than no hedge, because it reads as though the limitation has been
    measured.
    The origin is the more useful half. The figure was not read off the record; it was
    supplied to a sub-agent in a task brief by the coordinator, from memory, and written
    faithfully. That is rule seven of the method document -- read the evidence, not a
    reconstruction of it -- broken in the same session that recorded two other instances
    of the same class as D-439 and D-442. It was caught by a second sub-agent that had
    been told to verify every number in its own brief against the repository before
    writing it, which is the only reason it did not stand.
  fix: >-
    Fixed on 2026-09-04 in devtools/render_certificate_reach.py, which owns the prose.
    The section now names each of the three runs and what actually stopped it, including
    that one of them has no recorded stop reason and that the stop narrated nearby
    belongs to a different side.
  regression: >-
    None automated. The claim is about which sentence in a result's next_rung describes
    which run, and no checker resolves that -- check_rung_figures recomputes quoted
    quantities from artifacts and check_case_prose compares a case body against its own
    front matter, but neither reads a narrative back to the run it narrates. The durable
    control is procedural and is already in force: a sub-agent brief must require every
    figure in it to be re-derived from the repository before use, which is what caught
    this one.
  status: fixed
  recorded_in: packing/devtools/render_certificate_reach.py
- id: D-444
  title: Three tests pinned the Nagamochi count, and the poisoned control went blind a second time
  date: '2026-09-04'
  layer: verifier
  class: bookkeeping
  detected_by: gate
  latent_for: >-
    from the T-020 retention at about 20:35 UTC until the pre-push tier reached the test
    file at about 21:55; two pushes went out in between, on the strength of the records
    tier and a pre-push tier that timed out before it got there
  severity: medium
  what: >-
    tests/test_nagamochi_bounds.py held three expectations as literals about the record
    rather than as relations read from it. test_it_covers_the_cases_it_claims_to asserted
    that exactly 85 cases cite E-nagamochi-lower; test_a_stale_readme_count_is_refused
    asserted the checker would answer a stale README with "60 of 65"; and
    test_a_wrong_value_is_refused poisoned n = 20's verified lower bound with "4.8" to
    prove the checker bites. T-020 moved n = 19, 20 and 21 off the closed form the same
    evening, so the count became 83 and 58, and the first two literals were simply
    stale.
    The third is the finding. Its own comment records that its original target, n = 19,
    stopped reaching the checker when T-016 took that case over on 2026-09-03, so the
    control "passed without biting" and the target was moved to n = 20. On 2026-09-04
    T-020 gave n = 20 a real verified lower bound of exactly 24/5 = 4.8 with evidence
    that no longer names the theorem. The poison became the truth, the poisoned case
    stopped reaching the checker, and the control went blind again by exactly the
    mechanism its comment describes -- this time it failed only because a second
    assertion, main() == 1, had nothing left to bite on.
  consequence: >-
    No bound and no record was wrong. The checker itself (devtools.check_nagamochi_bounds)
    read the corpus correctly throughout and passed in the records tier. What was wrong
    was the test of the checker, and for one push cycle the register carried a test that
    could not tell a biting control from a blind one.
    The process cost is the part to keep. The records tier does not run pytest, and the
    pre-push tier's whole-suite step timed out at 900 s on this box and 1800 s on the CI
    runner before reaching this file -- so two commits were pushed with a red test that
    only the full suite reveals, past a gate that exists because that has happened twice
    before today. That the suite was too slow to reach its own failures is D-369's
    mechanism; the same evening's integer sweep (agenda-020) is what brings the suite back
    under the timeout, and this is the first defect the restored gate caught.
  fix: >-
    Fixed on 2026-09-04. None of the three tests pins a number now. The coverage test
    reads the retained certificate packages, computes each one's reach from its side and
    mass (least_size_certified upward, wherever Theorem 2's value is below the side), and
    asserts that no reached case still cites the theorem and that every citing case
    carries the theorem's own value. The stale-README test derives the corpus figure the
    way the checker does. The poisoned control chooses its target from the record -- the
    largest citing case with at least 0.3 of room under its reported upper bound -- and
    poisons by 0.2 above the recorded value, so it can neither be taken over by a result
    nor fall inside the checker's last-place tolerance.
  regression: packing/tests/test_nagamochi_bounds.py
  status: fixed
  recorded_in: packing/tests/test_nagamochi_bounds.py
