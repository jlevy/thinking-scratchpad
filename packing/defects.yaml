    to choose the object an atlas should count. This makes the cartography premise look
    settled and can send implementation toward the wrong quotient or continuation
    model.
  fix: >-
    The rank-free claims are removed from the living docs. Exp-013 now resolves the
    Trump half with complete branchwise linearizations and exact zero-cone certificates.
    The n = 5 question stays open: compute fixed-cell active-matrix rank, full
    pose-and-angle linearizations, feasible null directions, and validated continuation
    across active-set changes before asserting dimension or connectivity.
  regression: >-
    tools/check_trump_tangent.py replays the n = 11 result; no n = 5 regression exists
    yet, so this combined defect remains outstanding under think-1s0h.
