- id: D-124
  title: The portable negative-control fallback copied a needlessly broad repository surface
  date: '2026-08-24'
  layer: tooling
  class: performance
  detected_by: review
  latent_for: one stacked PR
  severity: medium
  status: fixed
  what: >-
    Private negative-control trees used cheap copy-on-write clones on APFS but fell back
    to unrestricted `cp -R` over the repository elsewhere. The fallback cost and disk
    multiplier were neither bounded nor measured.
  consequence: >-
    A fast local gate could become slow and disk-heavy in CI or on Linux, recreating the
    loop-cost problem the snapshot design was intended to remove.
  fix: >-
    Copy only the packing source needed by controls, omit the literature archive and
    build products, link the existing environment, and refuse above a 32 MiB source
    cap. The current 2.9 MiB surface measured 0.0779 seconds median with APFS cloning
    and 0.1944 seconds with a forced plain copy over five trials each.
  regression: >-
    The harness prints the source size on every run and refuses before materialization
    if the portable-copy surface crosses its cap.
  bead: think-lyzi
  recorded_in: packing/devtools/run_negative_controls.py
- id: D-125
  title: Parallel negative controls could share one worker tree and erase each other's mutation
  date: '2026-08-24'
  layer: tooling
  class: robustness
  detected_by: gate
  latent_for: caught during the first concurrency sweep
  severity: high
  status: fixed
  what: >-
    The first parallel harness assigned control i to tree i modulo the worker count, but
    a thread pool does not bind queued item indices to worker indices. A slow control
    let two live tasks share one tree, and one restored `defects.yaml` while the other
    expected its mutation to remain.
  consequence: >-
    A negative control stopped firing because another control erased its evidence,
    making the guard suite flattering under exactly the concurrent mode meant to speed
    it up.
  fix: >-
    Treat trees as checked-out resources in an explicit queue and return each only after
    its control has restored the private mutation.
  regression: >-
    The full control catalogue is run through the queue in the main gate; the original
    failing width sweep was repeated at 1, 2, 3, 5, and 10 workers.
  bead: think-oxwd
  recorded_in: packing/devtools/run_negative_controls.py
