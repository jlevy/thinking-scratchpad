- id: D-173
  title: The orientation docs ruled out equality certification by all interval methods
  date: '2026-08-24'
  layer: docs
  class: soundness
  direction: conservative
  detected_by: review
  latent_for: inherited source prose and PR 20 draft
  severity: high
  status: fixed
  what: >-
    The tutorial and algorithms report said floating point cannot certify any equality,
    interval arithmetic can prove greater-than but never equality, and certified
    numerics can never certify a contact. Those universal statements are false:
    structural evaluation can yield an exact zero enclosure, and interval-Newton,
    Krawczyk, or alpha-theory can certify a root satisfying declared contact equations.
  consequence: >-
    The research plan incorrectly excluded a viable certificate route and confused the
    actual failure—inferring an unknown exact contact from a small approximate residual—
    with an impossibility theorem about certified numerics.
  fix: >-
    Scope the limitation to enclosure-only evaluation of unrecognised near-contacts.
    Preserve the tolerance blind-spot result while allowing exact simplification and
    certified existence and uniqueness for an explicitly declared equality system.
  regression: none
  bead: think-0qs4
  recorded_in: TUTORIAL.md
- id: D-174
  title: The recovery narrative silently eliminated centres and universalized rational LPs
  date: '2026-08-24'
  layer: docs
  class: soundness
  direction: flattering
  detected_by: review
  latent_for: inherited source prose and PR 20 draft
  severity: high
  status: fixed
  what: >-
    The numeric-to-exact narrative said only discrete data crosses the boundary, that
    contact equations have only side and distinct angles as unknowns, and that an exact
    rational LP is the general remedy for solver noise. Numerical coordinates may seed
    or select a candidate root; the general contact system still contains centres until
    a particular graph permits their elimination; and fixed-angle coefficients can be
    algebraic rather than rational.
  consequence: >-
    A recovery instrument could omit necessary variables or choose an inapplicable exact
    scalar, then present a special-case derivation as a general promotion pipeline.
  fix: >-
    Treat the contact structure as the unchecked discrete hypothesis while allowing
    numerical values only as non-decisive root-finding hints. Require centre elimination
    to be derived from each contact graph. Describe the solver target as an exact LP over
    certified rational or algebraic coefficients, with a rational LP only as the
    rational-coefficient special case.
  regression: none
  bead: think-4000
  recorded_in: docs/project/research/research-2026-08-22-square-packing-algorithms-and-tooling.md
- id: D-175
  title: The stacked orientation branch lagged the current basin calibration and agenda
  date: '2026-08-24'
  layer: docs
  class: bookkeeping
  direction: conservative
  detected_by: drift_check
  latent_for: one stacked branch update
  severity: high
  status: fixed
  what: >-
    PR 20 incorporated exp-021 through exp-023 but diverged before exp-024 and
    agenda-001. Its synopsis therefore retained 23 rounds, a three-of-four n=4 control,
    and unresolved D-171, and its tutorial called the event surface inadmissible without
    distinguishing event receipts from terminal-component identity.
  consequence: >-
    Merging the docs verbatim would erase the current experiment queue and make a fixed
    positive-control defect appear open, while understating what BasinEvent/v3 can
