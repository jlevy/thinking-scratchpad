- id: D-050
  title: The atlas promotes non-converged stopping points and cannot reconstruct discovery order
  date: '2026-08-23'
  layer: tooling
  class: soundness
  direction: flattering
  detected_by: review
  severity: critical
  status: outstanding
  what: >-
    Atlas.add stores every offered endpoint as a basin row even when converged is false.
    The artifact retains aggregate proposal and frequency counts but not immutable event
    order, first-seen proposal, failures, censoring, or promotion history.
  consequence: >-
    Budget-censored termination artifacts become local optima, while the discovery curve
