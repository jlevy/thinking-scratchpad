  consequence: >-
    Canonicalization can dominate quenching, stall the intended n=10 census, and make a
    tooling blow-up look like evidence that the mathematical landscape is enormous.
  fix: >-
    none yet. Adopt maintained canonical labeling or automorphism-aware memoization,
    special-case regular empty classes, and publish adversarial latency and memory
    envelopes through n=100.
