    midpoint of `[a1,a2]` would turn a coordinate-derived candidate into an attributed
    definition and overstate the Cases 2 and 3 route.
  fix: >-
    Retain the separately tagged candidate `i_candidate = (a1+a2)/2` only in the
    source-distinct coordinate packet. Its zero midpoint residual, equal squared radii,
    and strict squared-radius margin advance only the Figure 4 coordinate prerequisite;
    every incidence, packed-square geometry, Case 2, feasibility, theorem, and n=11
    claim remains closed.
  regression: >-
    test_figure4_coordinate_packet_has_literal_interior_oracle and
    test_figure4_coordinate_packet_rejects_midpoint_mutation pin the literal candidate,
