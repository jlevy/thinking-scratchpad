- id: D-353
  title: The lab told users the optimizer receives a container side it never sees
  date: '2026-08-28'
  layer: docs
  class: bookkeeping
  direction: flattering
  detected_by: review
  latent_for: from the served-scenario commit to its first review
  severity: medium
  status: fixed
  what: >-
    The release note under the run controls read "the optimizer receives only side,
    centers, and angles". `quench_bracket` has no side parameter: it takes centers and
