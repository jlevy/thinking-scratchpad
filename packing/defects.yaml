  bead: think-n8vl
  recorded_in: packing/devtools/controls.yaml

- id: D-411
  title: The results checker and its epistemic policy disagreed at the boundary rungs
  date: '2026-08-31'
  layer: tooling
  class: validity
  direction: neutral
  detected_by: review
  latent_for: since the results register and checker landed on 2026-08-31
  severity: high
  status: fixed
  what: >-
    The checker claimed to derive the policy in epistemics.md, but its tests covered
    only the middle of each ladder. C5 was documented and admitted by the schema but
    impossible to derive; any existing mapped document could serve as its review;
    `proof-audited` evidence did not earn V3; `independently-external` evidence did not
    earn C1; and a V0 or V2 declaration with notes could conceal stronger cited
    evidence. The same boundary gap let artifacts, controls, and review artifacts name
    absolute paths, paths outside the repository, or directories rather than retained
    repository files.
  consequence: >-
    The live register happened not to exploit the gaps, but the executable contract was
    neither complete nor exact: it could refuse earned rungs, admit an unreviewed C5,
    accept a non-artifact as evidence, or let a weak declaration hide stronger cited
    evidence. That makes a green register check weaker than the reader-facing policy it
    claimed to enforce.
  fix: >-
    The derivation now covers C0 through C5, shares the assurance module's proof and
    external-origin vocabularies, distinguishes an unavailable proof from stronger
    cited evidence, requires normalized repository-relative files, and grants C5 only
    to a retained document-map entry whose role is review. epistemics.md now states
    exactly which predicates are structural and which judgments remain human.
  regression: >-
    tests/test_results_register.py pins every confirmation rung, both declared-only
    verification cases, proof-audited V3, independent external review, path boundaries,
    C5 review-map requirements, inflation, and unexplained understatement.
  bead: think-n8vl
  recorded_in: packing/devtools/check_results.py

- id: D-412
  title: Change-scoped validation could skip the open-ended results register dependencies
  date: '2026-08-31'
  layer: tooling
  class: validity
  direction: flattering
  detected_by: review
  latent_for: since change-scoped validation gained a results-register step
  severity: high
  status: fixed
  what: >-
    The results-register step declared only its checker, schema, and fixed record files
    as change triggers. Each result can also name arbitrary repository files in
    artifacts, controls, and review_artifact, so deleting or changing one of those
    dependencies did not select the step under `packing-validate --push --since ...`.
  consequence: >-
    The pre-push gate could report green without checking that a changed or deleted
    result dependency still supported the register. Full CI would usually catch the
    drift later, but the local gate's claim about checks reachable from a change was
    false.
  fix: >-
    The results-register step is deliberately unscoped and therefore always selected.
    Its records are an open dependency graph; treating the small validation cost as
    fixed is safer than maintaining a second parser in the selector.
  regression: >-
    tests/test_change_scoped_selection.py checks that representative files from every
    open-ended dependency family select the results-register step.
  bead: think-n8vl
  recorded_in: packing/src/sqpack/cli/validate.py

- id: D-413
  title: Results controls ran in snapshots missing their structured evidence files
  date: '2026-08-31'
  layer: tooling
  class: validity
  direction: conservative
  detected_by: review
  latent_for: since the results-rung negative control joined the pruned worker suite
  severity: medium
  status: fixed
  what: >-
    D-409 copied files reached through Markdown links, but the results register names
    additional files structurally through artifacts, controls, and review_artifact.
    When one lived under a pruned directory, the private worker omitted it and the
    unmutated results checker failed before the registered mutation was evaluated.
  consequence: >-
    The control suite stayed red, but for missing baseline evidence rather than the
    intended rung inflation. A real regression in the refusal could hide behind that
    earlier failure.
  fix: >-
    Worker snapshots now parse results.yaml and retain every existing structured target
    beneath a pruned tree, using the same bounded snapshot accounting as linked files.
  regression: >-
    tests/test_negative_controls.py checks representative archived paper and rendering
    targets and requires the unmutated results checker to pass inside a cloned worker.
  bead: think-n8vl
  recorded_in: packing/devtools/run_negative_controls.py

- id: D-414
  title: CI installed an unpinned uv release
  date: '2026-08-31'
  layer: tooling
  class: robustness
  detected_by: review
  latent_for: since the current GitHub Actions workflow was introduced
  severity: medium
  status: fixed
  what: >-
    Both validation jobs used astral-sh/setup-uv without a version. The project lockfile
    pins its Python dependency graph, but the runner responsible for reading that graph
    could change independently on any CI run.
  consequence: >-
    Identical commits could see different installer behavior, and a compromised or
    incompatible new release would enter the validation path without a reviewed
    repository change.
  fix: >-
    Linux and macOS jobs now request setup-uv version 0.12.8 explicitly.
  regression: >-
    The workflow diff carries the pin on both jobs; supply-chain review and the tbd
    guideline prohibit floating zero-install runners.
  bead: think-n8vl
  recorded_in: .github/workflows/packing-validation.yml

