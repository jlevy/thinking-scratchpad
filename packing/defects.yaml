- id: D-349
  title: An aborted free sweep drops its LP work from the run counter
  date: '2026-08-28'
  layer: quench
  class: bookkeeping
  direction: conservative
  detected_by: review
  latent_for: since quench_bracket gained its free pass
  severity: low
  status: contained
  what: >-
    `_free_sweep` accumulates its own LP count and returns it, and `quench_bracket` adds
    that total to `lp_solves` only on the normal return path. When the sweep raises on
    its wall budget or on an unsettled cell, the exception carries the partial count
    away with it, so LP calls that were made and paid for are absent from the reported
    total. The Motion Lab timeline made this visible: it retains one event per solve, so
    on an aborted sweep the events outnumber the counter that claims to describe them.
  consequence: >-
    Cost accounting understates aborted runs, which is the conservative direction but
    still wrong. Any per-solve efficiency figure computed from `lp_solves` on a
    budget-cut run is too favourable.
  fix: >-
    None yet. The counter belongs to `quench_bracket` and every research round that has
    ever reported an `lp_solves` figure, so correcting it is a change to the engine's
    reported numbers rather than to the Motion Lab, and it needs its own round. The
    Motion Lab contract documents the divergence instead of hiding it.
  regression: >-
    None. `TimelineEvent` documents that the fixed-point sum and the result total agree
    only for runs that stop normally, and
    test_event_counters_are_per_call_and_the_stop_carries_only_the_result_total pins the
    agreement on the normal path so a future engine change cannot break that half
    silently.
  bead: think-7dwo
  recorded_in: packing/src/sqpack/motion_lab/contracts.py
- id: D-350
