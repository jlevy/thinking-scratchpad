- id: D-046
  title: The unattended runner is not a closed, checked state machine
  date: '2026-08-23'
  layer: record
  class: robustness
  detected_by: review
  severity: critical
  status: contained
  what: >-
    Queueing ignores prerequisites; execute and record do not require an in-progress
    state; one deadline is shared across cells and may exceed the lease or session;
    process and persistence failures escape the failure policy; git return codes are
    discarded; broad campaign staging and --no-verify can still return success after a
    failed commit; release is not durably persisted; and lease offsets are stripped
    rather than converted to UTC.
  consequence: >-
    Work can run out of order, terminal rounds can be rewritten, leases can be judged
    against the wrong time, and a scientific success can be reported without durable
    persistence. These failures are worst during unattended operation.
  fix: >-
    Every clause of this record is closed in code, independently reviewed, and `contained`
    rather than `fixed`: three clauses of the source finding never reached this record's
    summary and so were never repaired, and two residuals sit on the same lifecycle.

    What the repair does. The lifecycle is now a closed machine. execute, record and release
    each refuse a
    round that is not in-progress, so a terminal round cannot be rewritten; the queue and
    claim both refuse a hypothesis whose declared prerequisites have not been accepted,
    with a prose prerequisite counted as unmet rather than waved through; and the queue is
    recomputed after every transition. The lease claim writes is now read: parsed as an
    instant, with a naive stamp taken as UTC and an offset converted rather than
    stripped, refused once expired, and used to cap the round's budget, which is then
    split into an equal share per cell instead of one deadline the first cell could spend
    in full. Persistence is checked: staging names the round's artifact, its archive and
    the regenerated ledger rather than the whole campaign directory, the commit's exit
    status is read, and HEAD must move before the round is called durable. Every
    execution, validation or persistence failure now ends the round in the same durable
    non-scientific state, and the session reports what state each round actually reached.
    --no-verify is retained deliberately: the pre-commit hook formats the whole tree and
    re-stages it, which would sweep other lanes' files into the round's commit and defeat
    the narrow pathspec this defect asked for.

    The independent review, 2026-09-03, returned BOUNDED-CAVEAT. All twelve clauses of this
    record were read against the code and measured, including the seven guards the lane left
    without a permanent mutation proof: each was reverted in a copy and every one turns the
    suite red, so the twelve-guard claim is verified in full. That is why this is contained
    and not outstanding.

    The reviewer recommended the other label, and it is recorded here so a reader of this
    row sees the disagreement and not only the outcome. The review says in terms: "the
    repair is real and substantial and should not be reverted or downgraded to
    'contained'", and that "'Fixed, with the following named and tracked residuals' is the
    honest disposition; 'fixed' unqualified is not." The coordinator chose `contained` on
    the reasoning above -- that a status is a claim about the source finding rather than
    about the summary of it in this record, and three of F-04's clauses never reached that
    summary. Both readings are defensible and neither hides anything: the
    residuals below are the same list under either label, and the review is installed at
    docs/project/reviews/review-2026-09-03-bc154-w9-disposition-d044-d046.md.

    The three unrepaired clauses. This record's `what` summarises finding F-04 of the PR #14
    review, and three clauses present in F-04 did not reach the summary and so were never
    repaired. (1) "Record pre-run engine dirtiness before campaign writes." execute
    (packing/src/sqpack/campaign/runner.py:1071) captures git status --porcelain after claim
    has written the in-progress stub and re-rendered campaign/ledger.md, neither committed.
    Measured 2026-09-03 from a verifiably clean tree, the recorded method.dirty is True: the
    field is unconditionally True on every unattended round, carries no information about
    the engine's starting tree, and is copied into subject and method by
    artifact_fields_from_execution. Capture it in claim, before the stub write. (2) Per-cell
    timeboxes. campaign/schemas/hypothesis.schema.yaml:187-193 and F-04 itself say the
    timebox bounds one cell; campaign/README.md:390 says per round; execute takes the round
    budget and divides it by the cell count, which no document states. Latent only because
    both live recipes declare one cell, where the split is the identity, so the semantics
    now live in the code alone and the code holds the casting vote. Decide it and write it
    in the schema, the runbook and this record; if per-cell wins it is a code change, not a
    doc change. (3) "The report can omit runnable-but-unrun work." Half repaired: safe_release
    and the report's Health section now make the what-moved / what-died distinction, which
    was the substantive part. A hypothesis that was runnable and simply not reached, because
    the session budget ran out before its turn, still appears in neither done nor skipped,
    because skipped holds only what queue filtered out. All three are conservative or merely
    uninformative -- none flatters a result -- which is why this is a caveat and not a
    discrepancy.

    Two residuals on this lifecycle. run's failure policy is not total: a KeyError, TypeError
    or YAML error from a malformed recipe or artifact escapes the
    (GuardError, RefusalError, OSError) clause, so the finally still writes the report but
    the round is neither released nor counted toward MAX_CONSECUTIVE_FAILURES. And the three
    archive residuals recorded under D-044 are closed from here rather than there: they need
    execute to append the digest of what it produced and record to compare it, which is a
    change on this defect's own execute-to-record edge.

    Not repaired here, and carried on think-ldq2. Agenda 016's W9 lane is bounded to D-044
    and D-046 as scoped. A control-cell breach failing to stop the session is a separate
    declared stop condition rather than a clause of this defect, and is recorded as D-426.
  regression: >-
    tests/test_campaign_runner_trust_boundary.py covers the lifecycle guards. execute,
    record and release each refuse a terminal round and recording the same round twice is
    refused; the queue skips and claim refuses a hypothesis whose prerequisites have not
    landed; a lease offset is converted rather than stripped; an expired lease refuses
    execute; the timebox is capped by the remaining lease and shared between cells;
    commit_paths refuses an empty stage and a commit that does not move HEAD, and stages
    only the paths it was given; and run releases the round, reports the state it truly
    reached, and still writes its report when a step refuses before or after the verdict.
    The lease-expiry, terminal-round and prerequisite guards are each shown load-bearing
    against a copy of the module with that one repair reverted.

    Two properties of that list, established by the 2026-09-03 review. Every one of the
    twelve guards, including the seven with no permanent mutation proof, turns the suite red
    when reverted in a copy, so the coverage claim holds. And
    test_each_cell_gets_its_own_share_of_the_timebox is timing-sensitive: with a three-second
    round budget over two cells, a loaded machine that overruns the first cell's share pushes
    the second past its own start and fails the test. The stricter assertion that made the
    test load-bearing also made it fragile, in a suite already at its 900-second step budget.
  bead: think-ldq2
  recorded_in: docs/project/reviews/review-2026-08-23-square-packing-program-and-pr14.md
- id: D-047
  title: Contact certificates changed under container reflection while the D4 test checked only geometry
  date: '2026-08-23'
  layer: tooling
  class: soundness
  direction: flattering
  detected_by: review
  severity: high
  status: fixed
  what: >-
    The contact key ranked folded angle classes by representative value. Reflection maps
    a to pi/2-a and can reverse those ranks, changing an attributed contact graph for the
    same packing. The existing D4 test asserted invariance only for the geometric key.
  consequence: >-
    One physical endpoint could be split by orientation, inflating component counts and
    making its observed frequency look smaller. The named symmetry test stayed green
    because it omitted the failing half of the identity.
  fix: >-
    Contact certificates are minimized across all eight container images and the
    independent canonical checker compares both key fields for every image.
  regression: >-
    tools/canonical_check.py exercises all eight D4 transforms and square relabelling for
    the full key pair.
  recorded_in: docs/project/reviews/review-2026-08-23-square-packing-program-and-pr14.md
- id: D-048
  title: Tolerance grouping and exact hash pairs do not form a stable basin equivalence relation
  date: '2026-08-23'
  layer: tooling
  class: soundness
  direction: flattering
  detected_by: review
  severity: high
  status: outstanding
  what: >-
    Greedy angle-class grouping is order-dependent near its tolerance and is not a
    transitive circular equivalence. The key API reports contact-only agreement as a
    quantization ambiguity, but Atlas.add merges only exact geometric/contact tuples and
    has no disagreement graph or later union operation.
  consequence: >-
    Relabelling or a sub-quantum perturbation can change row count. Forced equality and
    forced inequality are both unsupported, so frequency and saturation depend on
    input order and representational thresholds.
  fix: >-
    none yet. Define deterministic circular clustering and an explicit equivalence or
    ambiguity relation with stable union semantics, then sweep boundary perturbations
    and quantums under permutation controls.
