- id: D-449
  title: The exact sweep's reported witness centre lies outside the admissible domain on most directions
  date: '2026-09-04'
  layer: verifier
  class: validity
  direction: neutral
  detected_by: review
  latent_for: >-
    since the sweep's first commit on 2026-09-04; found by PR 80's review (its F11) as a
    possibility and measured on this branch's head by the code lane of the review of that
    review: 158 of 181 directions at n = 11 and 159 of 181 at n = 17
  severity: low
  what: >-
    minimum_covered_mass reports, beside the least covered mass, a witness centre for it:
    the midpoint of the event cell that attains the minimum. The reachable cells are the
    event cells that meet the admissible centre domain, and most of them meet it only in
    part, so the midpoint of the cell is usually outside the domain -- a point at which no
    B-square is admissible at all. The value is right: the mass is constant on the cell
    and the cell does meet the domain. The point reported as attaining it is not a point
    where anything attains it.
  consequence: >-
    No verdict and no bound is affected; the least covered mass, which is what
    Condition 5 decides on and what every record quotes, is computed over the right
    cells. What is wrong is a diagnostic that presents itself as a witness: a reader who
    took the printed centre and placed a B-square there would find the placement
    inadmissible. Two independent instruments -- the exact sweep and the interval branch
    and bound -- agree on the value to the digit, and neither has ever been asked to
    agree on the witness.
  fix: >-
    Fixed on the port branch, 2026-09-05, from PR 80's head 04127189, which had already
    applied its helper on both routes: _cell_witness returns the vertex average of the
    event cell's intersection with the admissible domain and checks it strictly inside
    the open cell, and both minimum_covered_mass_integer and
    minimum_covered_mass_fraction call it. With it, reduce_to_cells is re-implemented
    independently of reduce_to_spans, so the reference no longer shares the optimised
    route's geometry, and the integer entry point checks nonnegativity, integrality
    and the int64 limit itself rather than trusting its caller.
  regression: >-
    test_every_reported_witness_is_an_admissible_centre_on_the_373_atom_rung (every
    third direction of the first rung, fast tier) and
    test_every_reported_witness_is_admissible_on_every_retained_certificate (all 181
    directions of all four retained certificates on the integer route, exhaustive
    tier): each maps the reported witness back to container coordinates and asks
    whether a B-square centred there fits, exactly.
  status: fixed
  recorded_in: packing/src/sqpack/fractional/sweep.py
  bead: think-xyt1
