- id: D-123
  title: A per-step process cap was documented as a shared global worker budget
  date: '2026-08-24'
  layer: docs
  class: bookkeeping
  detected_by: review
  latent_for: one stacked PR
  severity: medium
  status: fixed
  what: >-
    The gate and worker helper called `PACK_JOBS` a shared budget, but each concurrent
    child read the same value independently. Several pool-backed steps could therefore
    exceed it in aggregate, and `--jobs 1` still assigned two inner workers.
  consequence: >-
    Operators could infer a resource ceiling the implementation did not enforce, and a
    supposedly serial transcript could still contain multiprocessing behavior.
  fix: >-
    Document `PACK_JOBS` as a measured per-step cap, state that aggregate fanout can be
    larger, and make `--jobs 1` export an inner cap of one.
  regression: >-
