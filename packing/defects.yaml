- id: D-363
  title: A closure form was named in the record that could not close the case it was named
    for
  date: '2026-08-29'
  layer: tooling
  class: validity
  direction: neutral
  detected_by: review
  latent_for: from BC-054 in session-038 until BC-069 in session-044
  severity: low
  status: fixed
  what: >-
    `close`'s docstring named the missing `n = 5` condition as "the Lagrange or Fritz-John
    statement that no admissible motion decreases the side, in determinant form". That
    statement is already true at `n = 5`: `side_leak` reads `1.00e-16` and the single free
    direction is a rotation of the centre square about its own centre with an `s` component
    at the same floor, so no contact-preserving first-order motion changes the side. A true
    statement adds a dependent row and no rank. The obstruction is second-order -- the free
    direction violates the contacts at `-0.25 t^2`, identical in both signs across three
    decades -- so the shortfall is a degenerate root of the contact map rather than an
    unpinned optimum.
  consequence: >-
    Nothing shipped; the misnaming was in prose. Had it been followed it would have sent
    the next session after a first-order determinant condition at the one size where no
    first-order condition can close the system. It was compounded by a structural gap:
    `closure` held prose strings while `contact_jacobian` and `residual_at` read
    `equations` alone, so the only thing a closure condition could do was change
    `equation_count` -- which is the shape of the failure D-361 records, arriving a second
    way.
  fix: >-
    `close` derives the condition by differentiating the contact map along the direction
    the contacts leave free, and `closure` now carries `sp.srepr` with every consumer
    reading `all_equations`. Rank at `n = 5` moves from 15 to `16` of `16` with the
    residual unmoved at `1.110e-16`; `n = 11` and `n = 29` are unmoved at `34/34` and
    `88/88` with `close` still refusing `already-determined`, verified after the change.
    Each emitted condition expands to exactly the statement that the contacting corner sits
    at the midpoint of the contacted edge -- an identity of the corner-edge contact type,
    checked against a midpoint expression written independently of the derivative, so the
    condition is derived rather than fitted.
  regression: >-
    Five controls, each watched to fire: the closure pinning the free angle at its measured
    value, repeating the contact equations instead of differentiating them, taking the free
    direction with its measurement noise, taking the Jacobian of the contacts alone, and
    skipping the closure in the residual. The positive check compares each emitted
    condition against the independently written midpoint statement and requires symbolic
    equality. `t4 = pi/4` also reaches rank 16 and is asserted in the test as proof that
    reaching full rank is not on its own evidence of anything.
  bead: think-rqad
  recorded_in: packing/campaign/agent-sessions/session-044-agenda006-continuation.md

- id: D-364
  title: The margin rule counted digits the value does not carry
  date: '2026-08-29'
  layer: tooling
  class: soundness
  direction: flattering
  detected_by: review
  latent_for: from BC-044's margin rule until BC-073 in session-044
  severity: low
  status: fixed
  what: >-
    Clause 3 of the frozen margin rule refuses a relation whose reported residual bound is
    not far enough below the coefficient budget it carries, and it read "digits available"
    from that bound alone. The refinement reports a residual bound and *separately* rounds
    its value to the digits it was asked for, and at `n = 29` the two disagree: the bound
    is `1.09829e-1039`, measured at a working precision of 1040, over a value string
    carrying exactly 1000 significant digits. The search only ever sees the string, so the
    clause was crediting it with 39 digits it does not have.
  consequence: >-
    Flattering, and narrowly missed. A relation is judged against digits the value does not
    carry, so a spurious relation could pass a clause written to refuse it -- which is the
    exact failure the margin rule exists to prevent, and the one the planning probe's
    relations at almost every degree from 8 to 21 on ninety-eight digits demonstrated. It
    could only have mattered at degrees 36 and 37, and no sweep had ever gone past 20, so
    it never fired. It was found by asking why the sweep stopped at twenty, not by a
    failure.
  fix: >-
    `available_digits` takes the worse of the reported residual bound and the length of the
    serialized value, and clause 3 tests that. The `n = 11` calibration is untouched by
    construction: there the reported bound (`1e-390`) is already worse than the string's
    400 digits, so the clause sees what it always saw and Trump's degree-eight polynomial
    is still recovered and discharged.
  regression: >-
    Three controls under the BC-073 banner, each watched to fire: reading the digits from
    the residual bound alone, a ceiling that admits a degree clause 3 would refuse, and a
    probe that sweeps to a typed-in ceiling instead of to the digits. One existing BC-060
    control quoted the clause-3 line this repair rewired and was updated with it; its guard
    was re-verified firing.
  bead: think-gucc
  recorded_in: packing/campaign/agent-sessions/session-044-agenda006-continuation.md

- id: D-365
  title: The deep golden-basin oracle fails at n = 10, and only the strict tier runs it
  date: '2026-08-29'
  layer: quench
  class: robustness
  detected_by: gate
  latent_for: 'unknown; found by the first full strict run since the continuation began'
  severity: medium
  status: outstanding
  what: >-
    `devtools.check_golden_basins --deep` fails three oracles at `n = 10`. The quench
    reaches `3.735634792931` and refuses to certify convergence -- "fixed cell unsettled
    during bracket: cell cycle (closure exceeded 64-cell cap)" -- and anneal-plus-quench
    lands `2.85e-02` above the proved `s(10) = (6 + sqrt(2))/2`, so the pipeline does not
    converge onto a known answer. The rebuilt map then differs from the committed golden,
    which is the third failure and a consequence of the first two.
  consequence: >-
    A known-answer control does not reach its known answer, at the one size in the ladder
    where the answer is proved and the packing is not trivially a grid. Nothing downstream
    reads the failing value -- the golden is a characterization artifact rather than an
    input to any claim -- so no result rests on it. What is lost is the control itself: the
    ladder exists to catch a quench that stops early, and at `n = 10` it is doing so and
    being recorded as a failure rather than acted on.
  fix: >-
    Not fixed here. This is the quench's cell-closure logic and belongs to whoever owns
    that lane; the continuation that found it was working on the promotion pipeline, which
    shares no code with it -- an import walk over the checker's nine transitive imports
    confirms none was touched.
  regression: >-
    Proven pre-existing rather than assumed. The identical three oracle failures reproduce
    at `64d1e19`, this session's base commit, in a separate worktree with its own
    environment. The reproduction is
    `uv run --frozen --all-extras --group dev python -m devtools.check_golden_basins --deep`,
    which takes about 335 seconds and runs only in the strict tier -- which is why a
    continuation that ran the fast gate at every checkpoint never saw it.
  bead: think-c7oo
  recorded_in: packing/campaign/agent-sessions/session-044-agenda006-continuation.md

- id: D-366
  title: The negative-control step outgrew the gate's per-step timeout
  date: '2026-08-29'
  layer: tooling
  class: performance
  detected_by: gate
  latent_for: 'introduced and detected in the same session'
  severity: low
  status: fixed
  what: >-
    The strict tier's `negative controls` step is killed at the 900-second per-step
    timeout. Nothing is wrong with the controls: run without that cap the suite completes
    in `1268s` and reports `137 negative controls fire as expected`. The step simply costs
    more than the cap now allows.
  consequence: >-
    The strict gate reports a failure where the evidence is a timeout, which is the least
    useful kind of red. Worse in principle, a step that always times out stops
    distinguishing a control that no longer fires from a machine that was busy -- and this
    repository's whole argument for controls is that a guard nobody watches fire is
    untested.
  fix: >-
    Fixed in `BC-079` by the second of the two repairs this entry named: the step declares
    its own budget. `Step.budget_seconds` raises the ceiling for the step that claims one
    and leaves it untouched for the other thirty-nine, which is the trade that made raising
    the shared cap the wrong answer. `negative controls` declares `1800s` against the
    `1268s` measured uncapped at 137 controls, so the number is that measurement plus room
    for a suite that only grows -- not a value chosen to make one run pass.

    Three properties keep a budget from becoming a waiver, and each is a test rather than
    an intention. A step that exceeds its own budget still fails, so a hung control suite
    reports instead of hanging the run. An explicit `--timeout-seconds` still wins, because
    a budget corrects a project-wide default and may not override a bound an operator typed
    for this run. And the set of budgeted steps is asserted to be exactly one: a second
    step acquiring a budget is evidence the shared cap is wrong rather than that another
    step is special, and the test is where that argument has to be made.

    No control was dropped, made cheaper, or pointed at a different target. The first
    repair this entry proposed -- retargeting the exact-LP controls -- remains available
    and is now an optimization rather than a prerequisite.

    **The verification run changed the argument, and it is recorded rather than tidied.**
    Re-run on 2026-08-30 with 142 controls, the step took `736s` and all 142 fired -- well
    inside the `900s` cap it was said to exceed. So this run would have passed without the
    budget, and "it was over the cap, now it fits" is not what happened. What the two
    measurements together show is worse than a step that is simply too slow: `1268s` on
    2026-08-29 at 137 controls against `736s` today at 142, a spread of about `1.7x` on a
    growing suite, straddling the cap in both directions.

    A step whose cost varies by that much around its own limit fails *intermittently*,
    which is the least diagnosable red there is -- indistinguishable, from the outside,
    from a control that stopped firing. That is the case for a declared budget rather than
    against it. The budget is sized against the slower of the two observations plus room
    to grow, so the step's verdict stops depending on how loaded the container was.
  regression: >-
    Measured rather than inferred: `uv run --frozen --all-extras --group dev python -m
    devtools.run_negative_controls devtools/controls.yaml -j 1` completes in `1268s` with
    all 137 firing, against a `900s` cap. Recorded with the count so the next session can
    see whether the number moved or the machine did.
  bead: think-av72
  recorded_in: packing/src/sqpack/cli/validate.py

- id: D-367
  title: Degree bounds on the Kingbird solution were written as bounds on s(n)
  date: '2026-08-29'
  layer: record
  class: soundness
  direction: flattering
  detected_by: review
  latent_for: from BC-060 in session-042 until session-044's endpoint review
  severity: medium
  status: fixed
  what: >-
    The promotion work at `n = 29` derives everything from the closed system Kingbird
    publishes for Kingbird's own packing, so every degree statement it produces is about the
    Kingbird solution. The record wrote them as statements about `s(29)`: "the degree of
    `s(29)` is not twenty", "if `s(29)` is algebraic of degree twenty or less, some
    coefficient is at least `10^22`", and this session's own "`s(29)` is algebraic of degree
    at most `15,744`". `s(29)` is the optimum -- the side of the smallest square holding
    twenty-nine unit squares -- and Kingbird's packing is the best known rather than a
    proved one.
  consequence: >-
    Flattering, and about the most load-bearing distinction this repository maintains. The
    whole `reported_upper_bound` / `verified_upper_bound` split exists because a published
    packing is not known to be optimal, and the `n = 29` bound gap is about `0.46`; a degree
    bound on the optimum would be a statement about a number nobody has pinned down, where a
    degree bound on the Kingbird solution is a statement about a specific algebraic number
    this project can point at. Nothing was computed wrongly and no other claim rests
    on the phrasing, but the phrasing said more than the computation.
  fix: >-
    Every live artifact now names what it bounds: the retained result JSONs, agenda-006's
    BC-060, BC-070 and BC-073 entries, the synopsis handoff, run-002 and `development.md`.
    The bc-070 artifact gains a `what_it_bounds` field saying it in full, and its claim
    boundary now separates the two questions rather than only the bound-versus-degree one.
    Terminal session records from session-042 and session-043 are left as written: they are
    history, this entry is where the correction lives, and editing a closed record to look
    tidy is the practice this project refuses.
  regression: >-
    None mechanical, and that is worth stating rather than glossing. No checker distinguishes
    a claim about `s(n)` from a claim about a retained witness's side, and writing one would
    mean parsing prose. What exists instead is the `verified_upper_bound` consumer contract,
    which forces any file naming that field to declare what it takes it to mean -- the same
    discipline one level down, and the reason this conflation was caught in review rather
    than shipped further.
  bead: think-obgk
  recorded_in: packing/campaign/agent-sessions/session-044-agenda006-continuation.md

- id: D-368
  title: The rules an agent needs before its first tool call had nowhere to live
  date: '2026-08-29'
  layer: docs
  class: performance
  detected_by: review
  latent_for: 'every autonomous session so far'
  severity: medium
  status: fixed
  what: >-
    Three failures recurred across sessions, each already recorded somewhere: measurements
    written as throwaway scripts rather than tools (D-023, and again in session-043, where
    the script reported a Bezout bound of 12,690,480 for a system whose bound is 1,039,500);
    sub-agents left unused or run without a thinking level matched to the task; and the
    coordinator blocking on an eight-minute gate with nothing else in flight, twice to the
    point of user interruption. The lesson existed in all three cases and reached the agent
    in none of them, because a defect entry is read during a review, the session guide is
    read once a session is already open, and `conventions.md` is long and consulted on
    demand. Nothing named these as rules to read before acting.
  consequence: >-
    Wall clock, which is the scarce resource in a timed session, plus one wrong number said
    out loud before the tool that would have refused it existed. No mathematical claim rests
    on this entry; the cost is entirely in repeated time.
  fix: >-
    `operating-rules.md` is a new root document holding the six rules with the evidence for
    each, and `AGENTS.md` -- the one file guaranteed to be in context before the first tool
    call -- carries a generated one-line summary of them. `conventions.md` states the
    division it implies: conventions govern the shape of what is produced, operating rules
    govern how the work is done.
  regression: >-
    `devtools.render_operating_rules` writes the summary from the rule headings and
    `--check` runs in the fast gate, so the two cannot part. Three negative controls
    rehearse the failure modes: a hand-edited summary, a rule added to the source and never
    mirrored, and a gap in the rule numbering.
  bead: think-eb29
  recorded_in: operating-rules.md
- id: D-369
  title: The gate's cheap checks were hostage to its expensive one, so drift reached CI
  date: '2026-08-29'
  layer: tooling
  class: performance
  detected_by: review
  latent_for: 'the whole of the 2026-08-29 branch'
  severity: medium
  status: fixed
  what: >-
    Seven CI failures on one branch, and every one of them was a registry, generated view,
    or declared contract going stale: a duplicated key in the declared-consumer registry,
    an undeclared `verified_upper_bound` consumer, two open beads sharing a title, a stale
    `ledger.md`, and an agenda cell with an empty `instances` list. None was a behavioural
    test. Those checks together run in about 70 seconds, but the only tier that contained
    them was `--fast`, which takes about eight minutes because one step -- the behavioural
    tests -- is roughly 87% of it. So the tier that catches everything that breaks was
    priced at the cost of the step that never broke, and pushing without it kept looking
    like the cheaper move.
  consequence: >-
    Wall clock and reviewer trust, not correctness. Each failure cost a CI round trip
    plus a fix commit, and three consecutive pushes failed on one unfixed cause because
    the next push went out before the first result landed. The gate's own cadence table
    made it worse by claiming sixty seconds for the eight-minute tier and two minutes for
    the eighteen-minute one, so the tier was being chosen against numbers that were wrong
    by an order of magnitude.
  fix: >-
    `packing-validate --records` selects the eleven record checks and nothing else, at
    about 70 seconds, and is the declared pre-push command. `conventions.md`'s cadence
    table is restated from measurement rather than intention. `OR-3` gains the other half:
    push first so CI runs concurrently with local checks, rather than serialising them.
  regression: >-
    A test asserts the tier is exactly the steps tagged `records`, that all of them are in
    the fast tier, and that the behavioural-test step is not among them -- tagging a test
    step into the tier would restore the cost that caused this. The structural question,
    whether these are the right tiers at all, is `BC-075`; this entry is the increment that
    stops the recurrence in the meantime.
  bead: think-c46d
  recorded_in: packing/src/sqpack/cli/validate.py
- id: D-370
  title: The registry checks were slow because they were not registry checks
  date: '2026-08-29'
  layer: tooling
  class: performance
  detected_by: review
  latent_for: 'since the soft-schema step was written'
  severity: medium
  status: fixed
  what: >-
    `soft-schema validation` took 67 seconds, which made the pre-push tier `D-369`
    introduced cost 70 seconds rather than the second or two a registry check should.
    Profiling found two causes and neither was schema validation. First, every YAML read
    in the repository used PyYAML's pure-Python scanner: 163 of 245 profiled seconds were
    `yaml.load`, over 12.6 million `check_token` calls, while libyaml ships with the
    pinned wheels and nothing was asking for it. Second, and larger in what remained,
    `cross_checks` runs `verify_packing` over 96 packings -- 166,134 separation tests and
    507,156 exact projections -- inside a step named for schemas.
  consequence: >-
    Wall clock and, through it, behaviour: a check that costs a minute is a check nobody
    runs before a push, which is the mechanism `D-369` records. Measured after the loader
    fix, the actual schema validation is `0.38s` for the 100 frontier cases, `0.03s` for
    the frontier datasets and `0.08s` for `defects.yaml`. The cost is `8.64s` of jsonschema
    descent over 208 witness files and `10.29s` of exact geometry. Nothing was validated
    wrongly; the step was priced as if schemas were expensive when they are not.
  fix: >-
    Three changes, `67.4s` to `15.5s`. `sqpack.yamlio` bases both loaders on
    `yaml.CSafeLoader` where libyaml is present, keeping the duplicate-key refusal, and
    adds a `safe_load` the 31 modules calling `yaml.safe_load` directly now use --
    `11.3x` on `defects.yaml` alone. `Draft202012Validator` is built once per schema
    rather than once per document, which had been re-reading and re-compiling each of 23
    schemas fourteen times over. And the grid replay is bucketed, which is sound rather
    than convenient: `verify_packing` establishes that every piece is a unit square, two
    unit squares overlap only if their centres are within `sqrt(2)`, and a bucket of side
    2 with its eight neighbours contains every such pair -- 166,650 exact pair tests
    become 57,665 and nothing a full sweep would have judged is skipped.

    ruamel.yaml was measured as an alternative and rejected. On 81 of this repository's
    own files, 1 MB: PyYAML `CSafeLoader` `0.128s`, PyYAML pure `1.370s`, ruamel
    `typ=safe` `1.991s`, ruamel `typ=safe, pure=False` `1.976s`, ruamel round-trip
    `2.730s`. Its `pure=False` buys nothing in this build and its value, comment-preserving
    round-trips, is not something this repository needs.

    What remained after those three was `6.06s` of jsonschema descent over 208 witness
    files carrying 3.7 MB of exact rationals, and `3.58s` of exact grid verification. Both
    are now fixed under `BC-077`, and the pre-push tier measures `16.05s` before and
    `4.48s` after on one container on 2026-08-30:

    The validator is `jsonschema-rs`, PyO3 bindings to the Rust crate, pinned to `0.49.9`
    rather than to the newest release because `0.52.0` was four days old on the day this
    landed and the 14-day cool-off applies to a validator as much as to anything else.
    Over the real corpus, 339 artifacts against 23 schemas, across five runs on
    2026-08-30: `jsonschema` validates in `7145-7750ms` and `jsonschema-rs` in `55-88ms`,
    a ratio between `83x` and `137x`. The range is quoted rather than a point because the
    Rust side is small enough that container scheduling noise moves it by half, while the
    Python side barely moves; a single run of this comparison is not a measurement.

    That matters for a second reason. The spec proposing the swap predicted `559x` from a
    scratch script over a 314-document subset, and no run of the real corpus reproduces
    it. The prediction was taken on a different corpus and stated as a point;
    `benchmarks/bench_schema_validation.py` is what makes the honest figure reproducible.
    The decision does not turn on which end of the range is taken, which is the useful
    property of a gap this size.

    Two corrections to that spec, both found by making the comparison repeatable rather
    than remembering it. First, the speedup above. Second, and the one that could have
    cost something: the spec recorded `error.message` as "byte-identical on the cases
    checked". It is not. The two libraries quote differently and systematically --
    `jsonschema` renders `'a' is a required property` where `jsonschema-rs` renders
    `"a" is a required property` -- so any consumer parsing that text would have broken
    silently. Nothing in this repository parses it, which is why the swap is still safe,
    but the equivalence that holds is verdict and instance path rather than message text,
    and the test asserts the quoting difference rather than normalising it away unstated.

    The exact grid replay moved out of `soft-schema validation` into `exact verification`,
    where a reader looks for exact geometry and where its cost is legible. Nothing about
    the check changed: the same cases are replayed with the same predicate to the same
    verdict, and `devtools.check_basic_bounds` run directly still does both halves.

    Measured on one container on 2026-08-30, `packing-validate --records`: `16.05s` before,
    `4.48s` after, with `soft-schema validation` falling from `15.71s` to `4.48s` and
    `exact verification` rising from `2.8s` to `6.35s` in a tier that does not contain it.
  regression: >-
    `test_yaml_is_read_only_through_the_project_loader` walks `src`, `devtools` and
    `cases` for `yaml.safe_load` or a bare `yaml.SafeLoader` and fails on either, so the
    pure-Python scanner cannot return one call site at a time. The duplicate-key guard was
    re-checked under the C loader before the base class changed.

    For the validator swap, `tests/test_schema_validator_equivalence.py` runs both
    libraries side by side over all 339 enforced artifacts and over generated mutations of
    them -- dropped required keys, retyped values, emptied arrays, unexpected properties --
    and fails on any disagreement in verdict or instance path. A faster validator that
    accepts one artifact the old one rejected is a soundness regression that buys six
    seconds, and it would be invisible in the timings that motivated the change. Three
    guards keep that test honest as it grows: one asserts the mutation generator actually
    produces rejections rather than quietly emitting valid documents, one asserts every
    schema in the corpus keeps a mutation representative through deduplication, and one
    asserts no mutation writes through to the shared payload.
  bead: think-64bw
  recorded_in: packing/src/sqpack/yamlio.py
- id: D-371
  title: The control snapshot guard was one artifact from refusing to run at all
  date: '2026-08-29'
  layer: tooling
  class: robustness
  detected_by: review
  latent_for: 'since the atlas renderings grew past 18 MiB'
  severity: low
  status: fixed
  what: >-
    `run_negative_controls` copies a source snapshot per worker and refuses to start if
    that snapshot exceeds `SNAPSHOT_MAX_BYTES`. Measured on 2026-08-29 the snapshot was
    39.20 MiB against a 40 MiB cap, 98% of it, with `atlas/` at 18.16 MiB the largest
    contributor. Any artifact of ordinary size would have taken it over, and the failure
    mode is not a slow run but a hard refusal to run the control suite at all.
  consequence: >-
    None yet, which is the point of recording it. The suite is what establishes that
    every guard in this project actually fires, so a cap that stops it is a
    claim-integrity outage wearing a resource-limit's clothes, and it would have arrived
    on whichever commit happened to add a figure.
  fix: >-
    Raised to 64 MiB with the reasoning written at the constant: the cap exists to stop a
    gigabyte of data being checked in, not to track the record's ordinary growth, and cost
    is the cap times the worker count, so 64 MiB across three private trees is still
    bounded. Pruning what no control reads is the alternative to raising it again and
    belongs with the tier work in `BC-075` rather than in an unrelated commit.
  regression: >-
    The guard already reports the measured size on every run, which is how this was seen.
    No new check: a second guard on the headroom of the first is the kind of process this
    project adds only for a named benefit, and the named benefit here is served by the
    number being printed.
