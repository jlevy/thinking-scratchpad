- id: D-043
  title: Runner validation happened after archival and could be bypassed during record
  date: '2026-08-23'
  layer: record
  class: soundness
  direction: flattering
  detected_by: review
  severity: high
  status: fixed
  what: >-
    runner.py appended command output before parsing or guard checks, then rebuilt cells
    during `record` from only n, seed, and best_side. A row with nonzero reported overlap
    could therefore be present in the authoritative archive, and direct or recovery-path
    record invocation could turn it into a scientific verdict without replaying the
    guards.
  consequence: >-
    Guard-invalid data could survive the very failure that detected it and later acquire
    a complete-looking verdict. Unattended operation could report an invalid packing or
    criterion result as accepted.
  fix: >-
    One result-line validator now guards live ingestion and record-time replay. Invalid
    rows are refused before they become scientific cells, and a guard failure releases
    rather than records the round.
  regression: >-
    campaign/runner.py preflight watches a bad-overlap row fail before accepted archival
    and watches a tampered archive fail again at record time.
  recorded_in: docs/project/reviews/review-2026-08-23-square-packing-program-and-pr14.md
- id: D-044
  title: Result validity and self-test status are assertions from the proposer itself
  date: '2026-08-23'
  layer: record
  class: soundness
  direction: flattering
  detected_by: review
  severity: critical
  status: contained
  what: >-
    The runner contract requires only a scalar overlap field emitted by the same command
    that proposes the result; quench output stores no complete pose. It also hardcodes
    selftest_passed true without executing and recording a test. The trust boundary has
    no independent geometry from which to recompute containment or separation.
  consequence: >-
    A fabricated side and overlap zero, a stale producer accumulator, or an untested
    binary can pass the archive boundary. Later exact promotion is impossible when the
    pose that must be checked was discarded.
  fix: >-
    Repaired against the producer, independently reviewed, and `contained` rather than
    `fixed`: the attack this record names is closed and reproduced, and one clause of the
    source finding plus three residuals on the same boundary are named below and are not.

    What the repair does. Every scored line must now carry the full pose as equal-length
    x, y and t arrays of length n. Each pose and the archive as a whole are
    content-addressed by sha256, and a retained certificate is refused once the archive
    under it has moved. record rebuilds every archived pose into corner geometry and
    re-checks containment and pairwise separation through sqpack.verify in a separate
    process, translating to the bounding-box origin because the producer's required_side
    is translation-invariant. The engine self-test is executed before any measurement is
    taken and the binary that passed it is hashed, so subject.selftest_passed is derived
    from an exit status and a digest that still matches the file on disk rather than
    written as a literal. The same repair closed one hole this record did not name: a
    result line is bound to the n and seed the harness invoked, so a command run for one
    cell can no longer score into another. The re-check is float arithmetic at 1e-9; it
    can refute a forged pose and never promotes a round past numerically-checked. No
    criterion, threshold, control or verdict changed: the campaign's accept rule already
    required, in clauses 3 and 4, that the engine self-test passed in the same invocation
    and that every stored pose pass an independent geometry check. The runner satisfied
    neither, and both now run, so this enforces the rule as written rather than rewriting
    it.

    The independent review, 2026-09-03, returned BOUNDED-CAVEAT. The producer-side attack
    this record names -- a fabricated side, a fabricated zero overlap, an untested binary
    -- is genuinely closed, and the reviewer reproduced every refusal against the code
    rather than against the summary of it. That is why this is contained and not
    outstanding: none of what follows is unproven, and none of it flatters a result. It is
    contained and not fixed because a status is a claim about the finding, not about the
    row that summarises it, and against the finding the repair is incomplete.

    The reviewer recommended the other label, and it is recorded here so a reader of this
    row sees the disagreement and not only the outcome. The review says in terms: "the
    repair is real and substantial and should not be reverted or downgraded to
    'contained'", and that "'Fixed, with the following named and tracked residuals' is the
    honest disposition; 'fixed' unqualified is not." The coordinator chose `contained` on
    the reasoning above -- that a status is a claim about the finding rather than about the
    row summarising it. Both readings are defensible and neither hides anything: the
    residuals below are the same list under either label, and the review is installed at
    docs/project/reviews/review-2026-09-03-bc154-w9-disposition-d044-d046.md.

    The unrepaired clause. This record summarises finding F-02 of the PR #14 review and the
    repair was written against the summary. F-02's fifth clause -- "exact zero is not
    required at the float screen; independently bounded non-overlap is" -- was never
    carried into this record and so was never implemented. validated_record
    (packing/src/sqpack/campaign/runner.py:587) still refuses any line whose overlap is not
    exactly 0.0. Measured 2026-09-03: an overlap of 1e-18 is refused outright while the
    identical geometry verifies. The engine's own notion of feasible is a bound and not an
    exact zero -- sqsearch's self-test accepts best_overlap <= FEASIBLE_EPS -- so a round in
    which the engine reports a genuinely tiny non-zero overlap is refused before the oracle
    that now exists to decide it is ever consulted. The repair added the independent bound
    and kept the screen F-02 asked to drop. Conservative in direction, and unrecorded until
    now. Close it by requiring overlap to be finite and <= POSE_TOLERANCE and letting the
    geometric check decide, or by recording why the stricter screen was kept.

    Three residuals the lane did not disclose, all on the boundary this defect names. They
    share one precondition -- write access to the archive between execute and record, which
    the producer does not have -- and one remedy. (1) record never binds the lines it scores
    to the bytes the child verified: it reads the archive three times, through scan_archive,
    the child's own read, and cells_from, and never compares archive_digest(archived) with
    the child's archive_sha256; the stored-receipt comparison fires only when a receipt
    already exists. (2) Only record writes a verification receipt, so on a first record
    there is no execute-to-record binding at all and clause 44.6's archive-digest refusal is
    unreachable in the unattended loop -- the test that covers it plants the receipt by
    hand, because nothing else puts one there in time. (3) One genuinely valid scored line
    duplicated under the other declared seeds manufactures the declared seed count: every
    copy verifies because the geometry is real, so decide's evidence-sufficiency clause
    turns a round that should be abandoned into unresolved, in the flattering direction,
    and the geometric oracle structurally cannot object. All three were reproduced on
    2026-09-03. Having execute append the archive digest of what it produced, and record
    compare it, closes all three together.

    Not repaired here. Agenda 016's W9 lane is bounded to D-044 and D-046 as scoped and this
    branch does not have room to widen; all four items above are carried on think-ldq2.
  regression: >-
    tests/test_campaign_runner_trust_boundary.py, 61 tests over the result-line contract,
    the independent oracle, the executed engine gate, and the digest that binds a verdict
    to the bytes it was taken over. A scored line with no pose, a pose whose length
    disagrees with n, a non-finite coordinate, a fabricated zero overlap, a side the pose
    cannot support, a truncated archive, an archive edited after it was verified, a
    producer writing a reserved receipt, an engine swapped after its self-test, and a
    result attributed to another cell are each refused; one test walks record's AST so
    the verdict can only come from the child process, and one holds the oracle's
    tolerance at least four orders of magnitude below the 1e-4 basin threshold, where it
    currently sits five below. The pose and attribution guards are each shown
    load-bearing against a copy of the module with that one repair reverted.

    Two bounds on that list, both established by the 2026-09-03 review rather than asserted
    here. The AST test collects only ast.Call nodes whose func is an ast.Name, so it catches
    the naive edit that optimises the subprocess away and would not see an attribute or
    aliased call; it is behavioural coverage of the containment property, not a structural
    proof of it. And the seven guards left without a permanent mutation proof were each
    reverted in a copy and re-run: every one turns the suite red, so the twelve-guard claim
    is verified in full. What those seven lack is protection against a future weakening of
    the tests, which is not hypothetical -- two of the twelve were tautologies on the first
    pass.

    No live round is covered, and the reason is now narrower than this entry first gave.
    "sqsearch is not built in this environment" was true when written and went stale at
    10:30Z on 2026-09-03, when a release binary appeared at
    packing/sqsearch/target/release/sqsearch (ELF x86-64, 617,520 bytes, untracked). It has
    not been executed, nothing has been recorded through the unattended runner, and the
    end-to-end round still runs a fixture engine. Three things therefore remain inferred rather
    than executed -- that the real producer satisfies the new contract end to end, that the
    round artifact record now writes validates against the enforced Experiment/v2 schema
    (no test checks this; the fixture stubs regenerate), and the engine gate's real cost
    against the round budget. SYNOPSIS.md's NO-GO for unattended execution stands.
  bead: think-ldq2
  recorded_in: docs/project/reviews/review-2026-08-23-square-packing-program-and-pr14.md
