  class: validity
  direction: flattering
  detected_by: inspection
  latent_for: 'from agenda-006 closing those cells on 2026-08-29 until the map was built'
  severity: medium
  status: fixed
  what: >-
    agenda-005 `BC-045` asks for outward-rounded interval certificates at n = 5, 10 and 11
    with refusal controls and n = 29 recorded unresolved. agenda-006 `BC-053` has that
    exact exit and is `complete`. The same holds for `BC-043` against `BC-054`, `BC-044`
    against `BC-060`, and `BC-048` against `BC-061`. All four stayed `ready`, so the queue
