    it is written down, which is what this entry is for.
  fix: >-
    Not attempted. Either the snapshot keeps the few archived files controls actually
    need, or such checks declare their inputs so the snapshot can include them
    selectively. Both change a shared trust boundary and belong in their own slice.
  regression: >-
