# Contract for one outer autonomous-agent work session.
#
# This is deliberately not a scheduler and not an experiment artifact. A coding agent,
# native goal, external watchdog, or human may drive continuation; tbd owns the work
# queue, and experiment artifacts own mathematical measurements. This record is the
# portable handoff that says what was attempted, what came back, how long it took, and
# what should happen next.
$schema: https://json-schema.org/draft/2020-12/schema
$id: packing.squares:AgentSession/v2
title: Agent session
type: object
additionalProperties: false
$defs:
  full_gate_declaration:
    type: string
    description: >-
      One `checks` item naming the gate run that certified this session's handover: the
      tier, the commit it ran on, and the verdict, optionally followed by a parenthetical
      note. `full gate: fast at 07a41a89: passed` is the canonical form.

      The commit matters as much as the verdict. A full gate run on a tree three commits
      behind the handover certifies nothing about what was handed over, and a check that
      accepts a bare `full gate: passed` is a check that will accept exactly that -- which
      is what forty-seven of the first eighty-six terminal records amounted to.

      `devtools.check_session_gate` compiles this pattern rather than restating it, so the
      contract and its enforcement have one definition. The groups are positional (tier,
      commit, verdict, note) because a JSON Schema pattern is ECMA-262 and Python's `re`
      does not accept ECMA-262 named groups; a pattern only one consumer can compile is
      not a shared definition. Nothing `$ref`s this: the requirement starts at
      `GATE_DECLARED_FROM` and the eighty-six records that predate it are valid, so the
      boundary is the checker's to hold and not the schema's.
    pattern: "^full gate: ([a-z][a-z-]*) at ([0-9a-f]{7,40}): (passed|failed)(?: \\(([^()]*)\\))?$"
  workflow:
    enum:
      - research-survey
      - factual-review
      - insight-iteration
      - process-review
      - efficiency-loop
      - research-loop
      - pipeline-improvement
      - documentation-pass
      - remediation
      - review-planning-oversight
      - general-improvement
required:
  - id
  - title
  - date
  - goal
  - workflow_phases
  - primary_bead
  - status
  - budget
  - stop_conditions
  - progress
  - delegations
  - outputs
  - checks
  - stop_reason
  - next_action
properties:
  id:
    type: string
    pattern: "^session-[0-9]{3}$"
    description: Stable, sequential, and never reused.
  title: {type: string, minLength: 1}
  date: {type: string, description: ISO date on which the session started.}
  started_at:
    type: string
    format: date-time
    description: Optional offset-aware instant at which this session began.
  deadline_at:
    type: string
    format: date-time
    description: Optional offset-aware hard deadline for this session.
  branch:
    type: string
    minLength: 1
    description: >-
      Optional Git branch explicitly attributed by the session operator. Required by the
      resource-rollup checker when a terminal session declares a Codex task-tree receipt,
      because Codex logs do not carry branch telemetry.
  goal:
    type: string
    minLength: 1
    description: The measurable outcome this session is advancing.
  workflow_phases:
    type: array
    minItems: 1
    description: >-
      Ordered, contiguous phases. Start a new phase when the workflow, focus, or bounded
      objective changes; the checker enforces explicit transitions and terminal state.
    items:
      type: object
      additionalProperties: false
      required:
        - workflow
        - focus
        - recording
        - objective
        - status
        - entered_by
        - switch_reason
        - budget_minutes
        - started_at
        - deadline_at
        - expected_output
        - validation_command
        - kill_condition
        - fallback
        - outcome
        - evidence
        - stop_reason
        - next_action
      properties:
        workflow:
          $ref: "#/$defs/workflow"
        focus:
          enum: [correctness, process, insight, efficiency]
          description: >-
            The primary quality emphasis in this phase; the other principles still
            constrain and may contribute to the work.
        recording:
          enum: [contemporaneous, retrospective]
          description: >-
            Whether the phase contract was declared before work began or reconstructed
            from historical evidence during migration.
        clock_role:
          enum: [work, finalization]
          description: >-
            Required by the checker in a clocked session; finalization is the final
            reserve phase.
        objective: {type: string, minLength: 1}
        commitment:
          type: string
          pattern: "^BC-[0-9]{3}$"
          description: >-
            Optional: the bounded commitment this phase serves. Optional on purpose, so
            no terminal session record has to be rewritten to adopt the field. Where it
            is present the checker verifies the commitment exists, which the prose link
            it replaces could not.
        bead:
          type: string
          pattern: "^think-[a-z0-9]+$"
          description: >-
            Optional: the tracked work item this phase serves, when it differs from the
            session's primary_bead. Sixteen of twenty sessions that name beads in phase
            text name one other than their primary, and that mapping previously existed
            only in prose.
        status: {enum: [in_progress, completed, stopped]}
        entered_by:
          enum: [session_start, planned_checkpoint, evidence_checkpoint, user_request]
        switch_reason:
          type: [string, "null"]
          description: Null only for the first phase; later phases state why purpose or focus changed.
        budget_minutes:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: Declared phase budget; null only when a migrated historical record lacks one.
        started_at:
          type: [string, "null"]
          format: date-time
          description: Offset-aware phase start; null only for retrospective terminal history.
        deadline_at:
          type: [string, "null"]
          format: date-time
          description: Offset-aware hard deadline; null only for retrospective terminal history.
        expected_output:
          type: [string, "null"]
          minLength: 1
          description: Replayable artifact the phase is declared to produce.
        validation_command:
          type: [string, "null"]
          minLength: 1
          description: Exact command that will validate the expected output.
        kill_condition:
          type: [string, "null"]
          minLength: 1
          description: Observable condition that stops this line before its deadline.
        fallback:
          type: [string, "null"]
          minLength: 1
          description: Bounded next action if validation fails or the phase is killed.
        outcome: {type: [string, "null"], minLength: 1}
        evidence:
          type: array
          items: {type: string, minLength: 1}
        stop_reason:
          type: [string, "null"]
          description: Null while in progress; explicit when completed or stopped.
        next_action: {type: string, minLength: 1}
  primary_bead:
    type: string
    pattern: "^think-[a-z0-9]+$"
    description: The integration bead; delegated subtasks may have their own beads.
  status:
    enum: [in_progress, completed, stopped]
  budget:
    type: object
    additionalProperties: false
    required: [wall_minutes]
    properties:
      wall_minutes: {type: number, exclusiveMinimum: 0}
      max_cycles: {type: integer, minimum: 1}
      orientation_minutes:
        type: number
        exclusiveMinimum: 0
        description: Optional session-specific bound for choosing and declaring one slice.
      checkpoint_minutes:
        type: number
        exclusiveMinimum: 0
        description: Optional session-specific bound before concrete evidence must be preserved.
      slice_minutes:
        type: number
        exclusiveMinimum: 0
        description: Optional hard bound before the active slice must stop or be restated.
      finalization_minutes:
        type: number
        minimum: 0
        description: Optional wall-time reserve for reconciliation before the session deadline.
  stop_conditions:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  progress:
    type: object
    additionalProperties: false
    required: [metric, before, after]
    properties:
      metric: {type: string, minLength: 1}
      before: {type: string, minLength: 1}
      after:
        type: [string, "null"]
        minLength: 1
        description: Null only while the session is active; nonempty at terminal state.
  delegations:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - task
        - operator
        - status
        - outcome
        - evidence
        - files
        - checks
        - uncertainty
        - elapsed_seconds
        - elapsed_quality
        - next_action
      properties:
        task: {type: string, minLength: 1}
        operator: {type: string, minLength: 1}
        status: {enum: [queued, in_progress, completed, blocked, canceled]}
        recording:
          enum: [contemporaneous, retrospective]
          description: Required for delegations in a clocked session.
        outcome: {type: [string, "null"], minLength: 1}
        evidence:
          type: [array, "null"]
          items: {type: string, minLength: 1}
        files:
          type: [array, "null"]
          items: {type: string, minLength: 1}
        checks:
          type: [array, "null"]
          items: {type: string, minLength: 1}
        uncertainty: {type: [string, "null"], minLength: 1}
        elapsed_seconds:
          type: [number, "null"]
          minimum: 0
          description: Measured or explicitly approximate wall time; null when unavailable.
        elapsed_quality:
          enum: [platform_measured, operator_reported_approximate, unavailable, null]
          description: Makes timing precision explicit instead of giving estimates false precision.
        next_action: {type: string, minLength: 1}
        phase:
          type: [integer, "null"]
          minimum: 1
          description: One-based workflow phase inherited by this delegation.
        budget_minutes: {type: [number, "null"], exclusiveMinimum: 0}
        started_at: {type: [string, "null"], format: date-time}
        deadline_at: {type: [string, "null"], format: date-time}
        expected_output: {type: [string, "null"], minLength: 1}
        validation_command: {type: [string, "null"], minLength: 1}
        kill_condition: {type: [string, "null"], minLength: 1}
        fallback: {type: [string, "null"], minLength: 1}
        write_scope:
          type: [array, "null"]
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        excluded_commands:
          type: [array, "null"]
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
  outputs:
    type: array
    items: {type: string, minLength: 1}
  checks:
    type: array
    items: {type: string, minLength: 1}
    description: >-
      What was run and what it said. At a terminal state one of these must be a
      `full_gate_declaration`, checked by `devtools.check_session_gate`: an item opening
      `full gate:` that does not match that grammar is a failure rather than prose, and a
      terminal session at or after the checker's `GATE_DECLARED_FROM` that names none at
      all is refused.
  resource_rollups:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
    description: >-
      Repository-relative paths of enforced resource receipts for this session. Claude
      receipts are per-log `ClaudeEfficiencyRollup` records. Codex receipts are
      privacy-reduced `CodexTaskTreeDelta` intervals whose association with the session is
      declared here because the Codex harness exposes no Git-branch field. Required to be
      nonempty at a terminal state and checked by `devtools.check_session_rollups`, because
      without it there is no link from a session to what it cost. Absent on sessions that
      closed before the field existed; the checker names those rather than pretending they
      comply.
  stop_reason:
    type: [string, "null"]
    description: Null while in progress; explicit when completed or stopped.
  next_action:
    type: string
    minLength: 1
