[project]
name = "sqpack"
version = "0.2.0"
description = "Exact verification and LP-in-cell quenching for square packings"
# No `readme` field. The project README is the repository root README, which sits
# outside this build root and so cannot be referenced here; sqpack is never
# published to an index, so the packaging metadata loses nothing by omitting it.
requires-python = ">=3.14,<3.15"
dependencies = [
    "jsonschema>=4.26.0",
    # Pinned exactly, and to a release past the 14-day cool-off rather than to the
    # newest: `tbd guidelines supply-chain-hardening`. 0.52.0 was four days old on the
    # day this landed. The abi3 wheel from cp310 serves every Python this project runs.
    "jsonschema-rs==0.49.9",
    "mpmath>=1.3.0",
    "numpy>=2.0",
    "pyyaml>=6.0.3",
    "scipy>=1.14",
    "strif>=3.0.0",
]

[project.scripts]
packing-campaign = "sqpack.campaign.runner:main"
packing-ledger = "sqpack.campaign.ledger:main"
packing-validate = "sqpack.cli.validate:main"
packing-witness = "sqpack.cli.witness:main"

[project.optional-dependencies]
symbolic = ["sympy>=1.13"]

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    # Vector PDF export of the known-best composite. Emits no timestamps, so the
    # output is byte-reproducible and the staleness check is a byte comparison.
    "cairosvg>=2.7",
    # Renders the certificate explainer page: kpress supplies the design tokens,
    # the reading faces and the KaTeX distribution, all inlined into one file.
    # In `dev` rather than a group of its own because the type floor covers
    # `devtools`, so a package a devtool imports has to be resolvable wherever
    # that floor runs, which is this group.
    #
    # Unpinned here because there is no version to pin: kpress is not resolved
    # from an index. It is vendored as a git submodule at `vendor/kpress`, on the
    # branch `squares/page-fixes` cut from v0.3.5, and installed from that path by
    # the `[tool.uv.sources]` entry below. What is installed is exactly the tree
    # the gitlink names, so the submodule commit is the pin, and `.gitmodules`
    # plus the gitlink record it. The branch carries the two typographic fixes
    # this page needs -- KaTeX math sized to kpress's PT Serif rather than to
    # KaTeX's Times-tuned 1.21em default, and footnotes on the small size token
    # instead of a compounding 0.9em.
    #
    # The 14-day cool-off in `tbd guidelines supply-chain-hardening` guards
    # against a compromised upload of a package this project does not control.
    # First-party packages -- every jlevy-owned dependency, kpress among them --
    # are exempt, and the exemption still applies: vendoring removes the upload
    # from the path entirely, since the source installed here is the source
    # reviewable in this repository's own history.
    "kpress",
    # The motion-lab contract tests execute the exact JavaScript shipped to browsers.
    "nodejs-wheel-binaries>=24.16.0",
    "pytest>=8.3",
    # The quick behavioural lane is the pull-request surface's whole wall: 408.09s of a
    # 408.55s tier on CI (run 33985984585, job 101359470209), because `--jobs 2` already
    # hides every other step under it. A second GitHub job cannot shorten a wall that is
    # one step, so the only parallelism left to buy is inside that step, and the lane is
    # the shape that wants it -- around 2,000 tests, each held under a 5s ceiling by the
    # step's own rule, none of them writing anywhere shared. Measured for `BC-218` on a
    # four-core box at `PACK_JOBS=1`: 306.4s in one process against 135.0s at `-n 4`, and
    # no failure that appears only under xdist -- 56.6s once two shared cached builds stop
    # being billed to the lane. The argument for the worker count, for why it is not
    # `--inner-jobs`, and for where the other 121s went is in `_pytest_workers` in
    # `sqpack/cli/validate.py`.
    "pytest-xdist>=3.8",
    "ruff>=0.14",
    # Only derive_field.py uses SymPy, and only to re-derive a constant the verifier
    # already carries. It stays out of the runtime dependencies for that reason, and
    # sits here so the script still type-checks.
    "sympy>=1.13",
]

# The vendored kpress. `path` is relative to this file, so it resolves to the
# `vendor/kpress` submodule at the repository root; `editable` means an edit on
# the submodule branch is live in the next render without a reinstall, which is
# the point of vendoring it rather than pinning a release.
[tool.uv.sources]
kpress = { path = "../vendor/kpress", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqpack"]

# Lint
#
# The floor is deliberately high. This directory's whole argument is that a
# tolerance nobody checks becomes a blind spot, and the same is true of a lint
# rule nobody enables: defect D-014 was a soundness failure that passed every
# check we had, because the checks were the ones we had thought to write.
#
# Rules are enabled by family rather than individually, and exceptions are
# listed with a reason. See defects.md for what this codebase has actually got
# wrong; several of the families below map directly onto entries there.

[tool.ruff]
line-length = 96
target-version = "py314"
extend-exclude = [
  # The literature archive: transcribed and downloaded source, never edited to look
  # tidy, and the two verifier scripts it holds are other authors' bytes.
  "resources",
  # An independent reviewer's verifier, retained verbatim as evidence: written in
  # someone else's style, importing nothing from this project, and checked by being
  # run rather than by being linted. Reformatting it would defeat the point.
  "cases/n12_fractional_certificate/independent_verify.py",
]

[tool.ruff.lint]
select = [
    "F",     # pyflakes: undefined names, unused imports and variables
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # import sorting
    "UP",    # pyupgrade: modern syntax for the target version
    "B",     # bugbear: real bug patterns, including B008 and loop-variable capture
    "A",     # builtin shadowing
    "ARG",   # unused arguments, which hide a seam nobody calls
    "BLE",   # blind except, which turns any bug into a handled case
    "C4",    # comprehension clarity
    "C90",   # mccabe complexity, as a ratchet: see [tool.ruff.lint.mccabe]
    "DTZ",   # naive datetimes, which silently mean the wrong instant
    "EM",    # exception messages assembled outside the raise
    "ERA",   # commented-out code, which git already keeps
    "FBT",   # boolean positional arguments, which read as noise at the call site
    "FLY",   # f-strings over static joins
    "FURB",  # refurb: the idioms the target version makes available
    "ICN",   # conventional import aliases
    "ISC",   # implicit string concatenation
    "LOG",   # logging misuse
    "N",     # pep8 naming
    "PERF",  # obvious performance mistakes
    "PIE",   # miscellaneous lints
    "PL",    # pylint subset
    "PT",    # pytest style: one assertion per line, typed parametrize values
    "PTH",   # pathlib over os.path, per python-rules
    "PYI",   # stub-style annotations, here the redundant `int | float`
    "RET",   # return-statement structure
    "RSE",   # raise syntax
    "RUF",   # ruff's own rules, including mutable class defaults
    "SIM",   # simplifiable constructs
    "SLF",   # private member access across objects
    "T20",   # stray print in library code
    "TID",   # banned and relative imports
    "TRY",   # exception antipatterns
]
ignore = [
    # This is a scientific codebase: magic numbers in geometry are the geometry.
    "PLR2004",  # magic value comparison: 0.5 is a half-edge, not a magic number
    "PLR0912",  # branch count: the SAT and LP builders are inherently branchy
    "PLR0913",  # argument count: quench takes its knobs explicitly, by design
    "PLR0915",  # statement count, same reason
    "TRY003",   # long messages inside raise, which are the useful ones here
    "EM101",    # string literal in raise; paired with TRY003 above
    "EM102",
    "ISC001",   # conflicts with the formatter
    # The tests that check a refusal do it with try/except and a bare AssertionError so
    # they carry no pytest dependency, as python-rules asks; all fourteen files this
    # rule fires in import no pytest, and `pytest.raises` would add one to each.
    "PT017",
]

[tool.ruff.lint.mccabe]
# A ratchet, not a target. Measured on 2026-09-05: the most complex function is the
# campaign ledger's `check` at 158, a flat list of record invariants that carries its
# own `noqa`; the next is bentz13's `certify` at 57, which sets this ceiling. Lower it
# as functions are split; never raise it without naming the function that needed it.
max-complexity = 57

[tool.ruff.lint.per-file-ignores]
# Printing is the interface of a tool, so T201 is waived where the tools live and
# nowhere else. A print in `src/sqpack` outside the console scripts is a library
# talking to a terminal nobody may be watching; the library modules log instead.
"devtools/*" = ["T201"]
"cases/*" = ["T201"]
"tests/*" = ["T201"]
"benchmarks/*" = ["T201"]
"frankensim-probe/*" = ["T201"]
"src/sqpack/cli/*" = ["T201"]
# `K` is the published symbol in the source these modules transcribe; renaming it to
# `k` would make the code harder to check against the paper, which is the point.
"cases/trump11/packing.py" = ["N806"]
"cases/trump11/verifier_limits.py" = ["N806"]
# The benchmark deliberately times the field's internals; that is what it measures.
"benchmarks/exact_verification.py" = ["SLF001"]
# The ledger and renderers build markdown a line at a time, which reads better than
# the comprehension PERF401 would prefer.
"src/sqpack/campaign/ledger.py" = ["PERF401", "T201"]
# The runner's `# Step: name` section headers read as commented-out code to ERA001.
"src/sqpack/campaign/runner.py" = ["ERA001", "T201"]
"devtools/render_defects.py" = ["PERF401"]
"devtools/render_research_tables.py" = ["PERF401"]
"devtools/check_svg_rendering.py" = ["PLC0415"]
# CLI behavior tests exercise small internal orchestration seams without making them APIs.
"tests/test_validation_cli.py" = ["SLF001"]
# The tier-ceiling tests read the real parser and the real tier mapping deliberately: a
# reimplementation of either would drift from the CLI they check, which is the failure
# they exist to prevent.
"tests/test_gate_budgets.py" = ["SLF001"]
# Content-addressed by the immutable exp-055 result, which pins these files' SHA-256s
# (see the formatter's exclude list below): a finding here is answered in this file,
# never by editing theirs. The harness's blind except catches whatever the dynamically
# loaded frozen producer raises; the test's parametrize tuple is its retained shape.
"cases/n050_producer_refusal/harness.py" = ["BLE001"]
"tests/test_n050_producer_refusal_independent.py" = ["PT007"]
"tests/test_reachable_tests.py" = ["SLF001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["cases", "devtools", "sqpack"]

[tool.ruff.format]
docstring-code-format = true
# These executed instruments are content-addressed by immutable exp-050/exp-052/exp-055
# evidence. Reformatting any file would sever the retained result or checkpoint from
# the exact source bytes that produced it. Every file remains linted and type-checked.
exclude = [
    "cases/n050_exact/source_semantics.py",
    "cases/n050_producer_refusal/run.py",
    "cases/n050_producer_refusal/verify.py",
    "cases/n17_weighted_certificate_resume/run.py",
    "tests/test_n050_producer_refusal_independent.py",
]

# Types

[tool.basedpyright]
include = [
    "src/sqpack",
    "cases",
    "devtools",
    "benchmarks",
    "tests",
    "frankensim-probe",
    # The hand-written skill assets at the repository root are project Python too; the
    # gate runs from this directory, so they are reached by a parent path. `.claude/skills`
    # is a byte-identical mirror kept by `make skills-sync`, so it is not listed twice.
    "../.agents/skills",
]
exclude = [
    "**/__pycache__",
    # The literature archive, as excluded from ruff: other authors' bytes.
    "resources",
    ".venv",
    # An independent reviewer's verifier, retained verbatim as evidence. Editing it to
    # satisfy a checker would void what it is, so it is excluded here as it is from ruff.
    "cases/n12_fractional_certificate/independent_verify.py",
]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportDuplicateImport = "error"
reportPrivateUsage = "warning"
# Ruff's ISC family owns this duplicate lexical check and avoids two diagnostics.
reportImplicitStringConcatenation = "none"
# Several numerical dependencies do not publish complete type information; boundary
# behavior is covered by schema, replay, and scientific-contract tests.
reportMissingTypeStubs = "none"
# YAML and JSON enter through dynamically shaped library APIs. Callers validate their
# envelopes before use; reporting every inbound Any would obscure those real boundaries.
reportAny = "none"
# Campaign and retained-case records deliberately use Any where the persisted schema,
# rather than a Python class hierarchy, owns the shape.
reportExplicitAny = "none"
# PyYAML and jsonschema expose members through dynamic values after validation.
reportUnknownMemberType = "none"
# Dynamic records cross helper calls only after their owning schema or guard accepts them.
reportUnknownArgumentType = "none"
# Loaded scientific records are narrowed by contract checks instead of generated models.
reportUnknownVariableType = "none"
# Generic schema and renderer callbacks accept record shapes owned outside Python typing.
reportUnknownParameterType = "none"
# Small local helper classes in executable checks need no redundant attribute annotations.
reportUnannotatedClassAttribute = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
  "exhaustive_exact: expensive exact-algebra tests retained by full and integration validation",
  "slow: measured above the pull-request surface's per-test ceiling; runs in the deep surface",
]
