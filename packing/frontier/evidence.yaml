          derives the same statement first-hand from primary-text Basu-Pollack-Roy Theorem 3.22
          (continuous semialgebraic curve selection) plus the one-variable Puiseux fact, through the
          t = u^p change of variable Coste states in his own notes; Milnor 1968 Lemma 3.1 with
          X-012 section 4.1's finite-union reduction is a third route to it.
        - The separating-axis theorem for two convex polygons, cited rather than machine-checked.
        - >-
          That u -> 2 arctan u is a homeomorphism onto (-pi, pi); the polynomial injectivity is
          verified, the topology is cited.
        - Containment of a convex square in a convex rectangle reduces to its four corners.
        - Continuity of polynomials, which is what makes the chart image U open.
      audit_record: >-
        BC-153 independent review of agenda-016, 2026-09-03, classification PASS, recorded in
        campaign/series/series-000-smoke-and-calibration/experiments/exp-058-h-060-n5-chart-and-proof.md
