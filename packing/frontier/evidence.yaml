  - id: E-n005-second-order-rigidity
    claim: derived-structure
    scope: {n_values: [5]}
    assurance: verified
    method: exact-algebraic
    performed_by: repository
    relationship_to_generator: independent-implementation
    origin: replayed-here
    certificate: campaign/series/series-000-smoke-and-calibration/results/bc-049-n5-rigidity-certificates.json
    replay: uv run --frozen --all-extras --group dev python -m devtools.assess_n5_rigidity --check
    replay_status: passed
    novelty: apparently-novel
    source_reviewed: '2026-08-30'
    novelty_basis:
      corpus: >-
        packing/resources/ as retained on 2026-08-30: 27 papers (pdf plus faithful .raw.md transcription) and 22 archived web sources, including [Friedman DS7], [Goebel 1979], [Stromquist 2003], Trump 2023, Bentz 2010/2016, Kearney-Shiu, Nagamochi 2005, Gensane-Ryckelynck 2005, and the Kingbird catalogue
      novel_object: >-
        That n = 5 is not infinitesimally rigid but is second-order rigid, proved exactly; the catalogue asserts 'Rigid.' without defining or arguing it
      searched: >-
        every corpus file matching 'rigid', then the full tree for 'second-order', 'second order', 'infinitesimal', 'Farkas', 'self-stress' and 'tangent cone'. The last six return zero files: the corpus asserts rigidity in places and contains none of the machinery for deciding it. The Kingbird catalogue annotates n = 5 'Rigid.' with no definition and no argument, and [Friedman DS7] does not annotate n = 5 at all. Neither states the first-order cone is one-dimensional, names the motion, or refuses it at second order. An assertion of rigidity and a proof of second-order rigidity are different claims
      gaps: >-
        Kingbird's own 'Rigid packings' page, which defines the annotation it applies, was never archived, so what the catalogue means by 'Rigid.' is unknown here. [Goebel 1979] is a PDF with no transcription. Trump's personal site is not retained. The structural rigidity literature (Connelly, Whiteley and successors) is absent from this corpus entirely -- it is the body of work a refutation would most plausibly come from, and it is the largest known hole.
    limitations: >-
      Second-order and at fixed side. Exactly, over Q(sqrt 2), at Goebel's exact construction
      rather than the retained decimal witness: the cone of infinitesimal motions is exactly
      the line spanned by rotation of the middle square about its own centre, with the other
      fourteen coordinates pinned by Farkas certificates verified in the field, and that one
      direction carries gap curvature -1/2 at each of the four pair contacts and is refused
      by a verified non-negative self-stress. Together these exclude every twice
      differentiable feasible arc that leaves the pose with a nonzero derivative.

      They do not establish local rigidity, which is why the property stayed undetermined
      until 2026-09-03. An arc whose derivative vanishes at the pose is excluded only by a
      further argument -- curve selection on the semi-algebraic feasible set, then an
      induction on the arc's Puiseux coefficients -- which is written out in
      campaign/explorations/X-007-the-n5-optimum-flexes-once-and-that-once-is-shut.md and is
      prose, not a computation this replay checks. That argument was completed and checked
      against a full local accounting in X-012, independently reviewed, and recorded as
      E-n005-fixed-side-local-rigidity, which is the record the locally-rigid property now
      rests on; this record still establishes only what it says above. The container side is a constant here,
      not a variable, so nothing bears on what happens as the container grows.

      This is a repository result about the packing and is independent of the catalogue's
      unqualified Rigid annotation, which is carried by reported_upper_bound.catalogue_rigid
      and is not restated as a finding of ours.

