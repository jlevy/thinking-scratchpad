        (28 hand-built Farkas certificates), the self-stress and Lemma 8 from scratch in sympy
        sharing no code with the author, with sqpack or with the instrument; replayed the packet's
        five scripts to digests equal to the exp-058 record; and replayed the sqpack.local_rigidity
        instrument from clean roots byte-identically under normal and optimized Python with all
        eight controls rejecting.
    novelty: apparently-novel
    source_reviewed: '2026-09-03'
    novelty_basis:
      corpus: >-
        packing/resources/ as retained on 2026-09-03: 27 papers (pdf plus faithful .raw.md transcription) and 22 archived web sources, including [Friedman DS7], [Goebel 1979], [Stromquist 2003], Trump 2023, Bentz 2010/2016, Kearney-Shiu, Nagamochi 2005, Gensane-Ryckelynck 2005, and the Kingbird catalogue; plus the Kingbird rigid-packings definition page and the structural-rigidity and jamming sources reached by BC-152's prior-art survey (Connelly-Whiteley 1996, Connelly-Servatius, Donev et al. 2007), which are read through the survey and not archived here
      novel_object: >-
        The first exact PROOF that Goebel's n = 5 optimum is locally rigid at fixed side -- a property ASSERTED WITHOUT PROOF by Kingbird (archived main page, line 44, "Rigid." with a link and no argument), not stated by Goebel 1979 (zero occurrences of "rigid" or "uniqu" in the extraction) and not annotated by Friedman DS7, whose Theorem 2 is a lower bound only and analyses no equality case
      searched: >-
        Checked first-hand by the BC-153 reviewer from the archived sources rather than from the survey's summary: Kingbird's n = 5 entry is bare "Rigid."; Friedman DS7 remarks rigidity only for n = 40 and Trump's n = 11; Goebel 1979 states neither rigidity nor uniqueness; no published uniqueness theorem for the n = 5 optimum was found, and an unavoidable-set proof does not analyse its equality case, so "uniqueness implies rigidity" is not available as a prior route. The closing principle (first-order cone a line, plus a nonnegative self-stress with w . q < 0, implies isolation) is the classical second-order sufficient optimality condition and the energy principle of Connelly-Whiteley; the analytic-flex induction to order 2m has the shape of Connelly-Whiteley 1996 Theorem 4.3.1. Neither is claimed as new, nor is the half-angle rationalization, the separating-axis accounting or Farkas certification. Score S3, a case result, not S4
      gaps: >-
        "First" is relative to the literature searched: Connelly 2008 was not read in print and Kingbird's method is unknown, so this is a statement about the search performed and never an assertion of priority. Relative to this repository's own prior state, T-012's certificates plus the classical second-order sufficiency condition already implied the result once the local reduction is granted, so the genuinely new content is Proposition 5 -- the exact accounting of all 400 functions and the 128-condition neighbourhood -- together with the closing proved directly for corner-on-line and corner-on-wall inequalities. The prior-art scoping beyond the three sources above comes from BC-152's coordinator survey, is unverified against the primary texts, and is carried outside the claim. The Kingbird thirteen-versus-four rigid-list tension (X-012 section 7.3) is real and unresolved; it is not load-bearing here because n = 5 is on both lists
    limitations: >-
      Fixed side, and the labeled pose. The claim is isolation of Goebel's exact pose in Feas(2 +
      sqrt(2)/2), proved exactly over Q(sqrt 2); it establishes no numerical isolation radius, says
      nothing about the side as a variable (with the side free the cone opens and the obstruction
      fails -- X-007 measured that), nothing about global uniqueness or about any other n = 5
      optimal family, and it invokes no Connelly-Whiteley tensegrity theorem as stated.

      What the declared replay decides is the part T-012 owns and the proof consumes: the
      first-order cone is exactly the line spanned by rotation of the middle square, the other
      fourteen coordinates are pinned by 28 Farkas certificates verified in the field, and a
      verified non-negative self-stress gives w . q < 0 on that line. The rest of the exact content
      -- the chart, all 400 base margins, the 20 active rows and the 128 strict sign conditions that
      cut out the neighbourhood -- is retained in exp-058's result record, which holds its seven
      sympy scripts verbatim with their SHA-256 digests and declares the command that extracts and
      re-runs them; it was reproduced from clean roots by the sqpack.local_rigidity instrument and
      rebuilt independently in sympy by the BC-153 reviewer.

      No replay decides isolation, and none can: the instrument sets isolation_decided false
      unconditionally. The closing is a proof -- curve selection on the punctured feasible set and
      an induction on the arc's Taylor coefficients through order 2m -- which is why this record is
      proof-audited rather than exact-algebraic, and why the result it supports declares V3 rather
      than V4. The proof's largest cited hypothesis is the Nash curve-selection lemma, whose printed
      BCR page remains unread here; see proof.assumptions for the two independent derivations of the
      statement that stand in its place. The second-order-sufficiency theorem numbering in X-012
      section 8.3 is from memory and is on the non-acceptance route only.

      Two limits of the instrument, echoed here from exp-058 because a reader meets this record
      before that one. The binding check compares the second jet only along e_{u4}, the flex
      direction, and not the full J^T H J; that is sufficient for what the proof consumes, since
      Lemma 8's order-2m induction and Theorem 11 use only e^T H_j e, and the packet's own
      verify_chart.py does check the full transported Hessian on all 20 rows. And the reduction
      audit samples only the interior of the neighbourhood N, never at or near its boundary; N is
      defined by sign persistence rather than by a radius, so the proof consumes only that N is
      open, that 0 lies in it and that the 28 witnesses are negative on it, and the sampled audit
      corroborates the instrument's implementation rather than the proposition. The BC-153 review
      graded both non-blocking, the first sufficient and the second irrelevant to the proof.

  - id: E-n040-first-order-flexibility
    claim: derived-structure
    scope: {n_values: [40]}
    assurance: verified
    method: exact-algebraic
    performed_by: repository
    relationship_to_generator: independent-implementation
    origin: replayed-here
    certificate: campaign/series/series-000-smoke-and-calibration/results/bc-049-n40-rigidity-bracket.json
    replay: uv run --frozen --all-extras --group dev python -m devtools.assess_n40_rigidity --check
    replay_status: passed
    novelty: apparently-novel
    source_reviewed: '2026-08-30'
    novelty_basis:
      corpus: >-
        packing/resources/ as retained on 2026-08-30: 27 papers (pdf plus faithful .raw.md transcription) and 22 archived web sources, including [Friedman DS7], [Goebel 1979], [Stromquist 2003], Trump 2023, Bentz 2010/2016, Kearney-Shiu, Nagamochi 2005, Gensane-Ryckelynck 2005, and the Kingbird catalogue
      novel_object: >-
        That the tilted block turns at first order and every turn is refused at second; DS7 asserts n = 40 is rigid and this refines rather than contradicts it
      searched: >-
        every corpus file matching 'rigid', then the full tree for 'second-order', 'infinitesimal', 'Farkas', 'self-stress', 'tangent cone', 'Connelly' and 'Whiteley'. All return zero files. [Friedman DS7] line 59 states flatly 'The packing for n = 40 is rigid' and the Kingbird catalogue annotates it 'Rigid.', both without definition, argument or citation. Neither is contradicted by this record and neither anticipates it: an infinitesimal flex is not a motion, so a packing can be infinitesimally flexible and finitely rigid at once, which is precisely what a flex refused at second order means. What is novel is not a disagreement with the sources but the distinction itself -- no source in the corpus separates infinitesimal from finite rigidity for square packings, and none names the tilted block's motions. That the Goebel family's central block turns at all appears unexamined in the literature
      gaps: >-
        Kingbird's own 'Rigid packings' page, which defines the annotation it applies, was never archived, so what the catalogue means by 'Rigid.' is unknown here -- and for this record that is the gap that matters, since a catalogue meaning 'infinitesimally rigid' would contradict this result outright. Kingbird's 'Goebel squares' group page is also unarchived. [Goebel 1979] is a PDF with no transcription. The structural rigidity literature (Connelly, Whiteley and successors) is absent entirely, which is the largest hole: it is where a refutation would most plausibly come from
    limitations: >-
      First order, at fixed side, at Goebel's exact construction rather than the retained
      decimal witness. The packing is infinitesimally FLEXIBLE: seven directions are
      retained, each a vector in Q(sqrt 2)^120 verified to leave every contact's gap rate
      non-negative, and each turning the sixteen squares of the tilted central block while
      leaving the twenty-four axis-aligned ones fixed. Each is refused at second order by a
      non-negative self-stress with w.A = 0 and w.q < 0, verified in the field over the rows
      that direction holds tight.

      That is why the property stays undetermined rather than moving to not-rigid. An
      infinitesimal flex is not a motion: along every one of these the gaps curve shut at
      order t^2, so nothing here contradicts local rigidity or the catalogue's annotation.
      What it settles is that no first-order argument can establish rigidity here.

      The cone is not characterised. It is bounded -- 75 certificates put every admissible
      motion in a subspace of dimension at most 45, down from 120 -- and the seven known
      directions span 6, so a factor of seven is unaccounted for. Bounding it further needs
      the 42 corner-touching disjunctions, whose tangent cone is a union of half-spaces
      rather than an intersection (D-391); none of them becomes vacuous once the pinned
      coordinates are removed, so branch enumeration remains 2^42 and is not a route. In the
      same way, 52 of the frame's 72 coordinates are proved zero in every branch and the
      other 20 are covered only by a search that found nothing, which is not a proof.

      This is a repository result about the packing and is independent of the catalogue's
      unqualified Rigid annotation, which is carried by reported_upper_bound.catalogue_rigid
      and is not restated as a finding of ours.

