  - id: E-fractional-interval-decision
    claim: lower-bound
    scope:
      n_values:
        - 11
        - 12
        - 17
        - 18
        - 19
        - 20
        - 21
    assurance: verified
    method: interval-certified
    performed_by: repository
    relationship_to_generator: independent-implementation
    origin: audited-here
    novelty: previously-published
    source_key: '[Burns–Massaccesi n17]'
    certificate: cases/n11_fractional_certificate/certificate.json
    replay: uv run --frozen --all-extras --group dev pytest tests/test_fractional_interval.py
    replay_status: passed
    limitations: >-
      A second decision of the same certificates by interval arithmetic with directed
      rounding, existing so that the two decisions can fail differently. Every operation
      steps one ulp outward after a correctly rounded double operation, with no interval
      library; rationals enter at one boundary where exact comparison happens, and atom
      masses are exact integers on the certificate's own weight scale, so the sums round
      nothing.
      It is independent in method, not merely in code. Condition 5 is decided by branch and bound
      over boxes of centres -- for a box, an atom counts only if its coverage rectangle
      contains the whole box, which is a lower bound by construction and is tested
      against the inner enclosure of that rectangle so an unresolved atom is dropped
      rather than assumed. There is no event grid, no difference array and no polygon
      clipping: the two routes share the certificate object and the closed-form
      conditions, and share no part of how Condition 5 is decided.
      It also rests on fewer hypotheses. Condition 5 is decided on the doubled net -- theta_k and
      pi/2 - theta_k, 361 directions -- so the D4 reflection argument is never invoked
      and Condition 1 is not needed at all, which matters because interval arithmetic cannot
      establish the equality Condition 1 asserts.
      Results, 361 of 361 directions certified in every case and none stalled. The four
      retained top rungs, decided from their frozen bytes: n = 20 at 24/5, 2260 atoms,
      5,638,343 boxes; n = 17 at 459/100, 1184 atoms,
      3,683,951 boxes; n = 12 at 99/25, 2097 atoms, 4,448,751 boxes; n = 11 at 381/100,
      1121 atoms, 1,570,831 boxes. Lower rungs and the control: n = 17 at 229/50 in
      2,653,407 boxes, n = 11 at 19/5 in
      1,195,755 boxes, n = 12 at 197/50 in 1,846,439 and at 393/100 in 1,486,159, and
      Massaccesi's published n = 17 certificate -- the control that tests the verifier
      rather than the certificate -- in 966,903 boxes, returning 22529/5000. Box counts
      are deterministic and are the figure to compare; the wall times are not quoted
      because every one of these runs shared a contended machine.
      In minimisation mode every enclosure of the least covered mass has width zero and
      equals the exact verifier's value to the digit: 4001/4000 at n = 11's top rung,
      12501/12500 at n = 12's, 200009/200000 at n = 17's and 50007/50000 at n = 20's, each matching the
      least_cell_mass its own certificate declares, and 12501/12500 at the 229/50 rung,
      50003/50000 and 100003/100000 at the earlier n = 11 and n = 12 rungs. Refusals: the n = 12 atoms in a
      side-4 container are refuted at direction 0 after 407 boxes, and an atom lowered by
      1/10000 after 127.
      What it does not add: no new bound, and no protection against a wrong theorem
      statement, which both routes share. Its own failure mode is exhibited rather than
      claimed -- a leave-edge exactly on another's enter-edge stalls at the 1e-12 floor
      and is reported undecided, never accepted, demonstrated on a tiled grid where 2,868
      boxes stall and perturbing the seams by 1/100 certifies in 1,351. An exact census
      confirms no such seam occurs in any retained certificate.
      Its acceptance path was audited before this entry was written, and one gap was
      found and closed: enclosing runs settled boxes against the best point value rather
      than against mass 1, so they pinned the minimum exactly and then read `certified`
      as though it answered Condition 5. The lightened-atom fixture was accepted that way at a
      correctly measured 99993/100000 (D-435). The figures above were measured before the
      fix and none of them moves: it changes only the verdict drawn when a pinned minimum
      falls short of 1, and every enclosure here is at or above 1. The verdict now
      requires the certified lower bound to reach mass 1 in both modes, and the retained
      certificates are re-decided under it by the replay this entry names.
    source_reviewed: '2026-09-04'
