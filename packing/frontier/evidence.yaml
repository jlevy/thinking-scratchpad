        this repository's own proof artifact -- the frozen BC-152 packet (SHA-256
        28343b743e689fc99968d589a542d9022d061de8ec3ae5100bf4ef4930e40b6b) installed unchanged in
        substance -- with the round that produced it recorded as exp-058.
      theorem: >-
        For s = 2 + sqrt(2)/2 and Goebel's labeled pose P^0 in C = (R^2 x S^1)^5, P^0 is an isolated
        point of Feas(s) -- closed unit squares in [0, s]^2 with pairwise disjoint interiors --
        equivalently there is no nonconstant continuous feasible path from P^0 and no sequence of
        distinct feasible poses converging to it; hence Kingbird-rigid at fixed side (X-012 Theorem
        10, with the covering-space lift of section 1.3).
      scope: >-
        The exact labeled pose at the exact container side, over Q(sqrt 2), with the side held
        fixed. It establishes no isolation radius, nothing about the side as a variable (which is
        false, X-007), nothing about global uniqueness or any other n = 5 optimal packing, and it
        invokes no tensegrity theorem.
      pinpoints: >-
        X-012 sections 2.2-2.4 (Lemmas 1-3, the injective half-angle chart and its 2-jet transfer),
        3.1-3.3 (Lemma 4 and the exact base margins of all 400 elementary inequalities), 3.4
        (Proposition 5, the 128-condition neighbourhood on which the local feasible system is
        exactly the twenty active rows), 4.1-4.2 and Corollary 4.3 (curve selection on the punctured
        set F \ {0}, with its hypotheses verified for this chart), 5.1 (Proposition 6, T-012's cone
        and self-stress transferred to the chart), 5.2-5.4 (Lemmas 7-8 and Theorem 9, the order-2m
        coefficient induction) and 5.5 (Theorem 10). Section 5.7's second-order-sufficiency proof
        corroborates from weaker hypotheses and is not the acceptance route.
