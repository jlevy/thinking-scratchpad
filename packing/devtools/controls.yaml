# The mutation partner is BC-049, the standing research cell that stays ready by
# design -- the previous partner (BC-038, think-kdil) completed on 2026-08-30 and
# silently defused the collision: the control still went red, but on ledger staleness
# instead of the rule it registers (D-408). A partner that never terminates is the
# rot-resistant choice; BC-092's own stop is held by D-406, and if it ever legitimately
# leaves `stopped` the anchor stops matching and this control refuses loudly.
