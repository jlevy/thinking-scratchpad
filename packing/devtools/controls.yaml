- name: gate - strict handover skips deep golden regeneration
  file: src/sqpack/cli/validate.py
  replace:
    - 'deep = namespace.deep or _environment_flag("PACKING_VALIDATE_DEEP") or strict'
    - 'deep = namespace.deep or _environment_flag("PACKING_VALIDATE_DEEP") or False'
  run: uv run --frozen --quiet pytest -q tests/test_validation_cli.py -k strict_mode_enables_deep
  expect: "strict mode did not enable deep validation"

- name: gate - historical regression failure is not masked by later probes
  file: src/sqpack/cli/validate.py
  replace:
    - '    return _module(context, "devtools.check_regressions")'
    - '    raise StepFailureError("forced historical regression failure")'
  run: python3 -m sqpack.cli.validate --only 'historical regressions'
  expect: "forced historical regression failure"

- name: gate - multi-command step cannot swallow its first failure
  file: src/sqpack/cli/validate.py
  replace:
    - '    outputs = [_run(context, command, cwd=cwd) for command in commands]'
    - "    outputs: list[str] = []\n    for command in commands:\n        try:\n            outputs.append(_run(context, command, cwd=cwd))\n        except StepFailureError:\n            continue"
  run: uv run --frozen --quiet pytest -q tests/test_validation_cli.py -k multi_command_step_stops_at_first_failure
  expect: "assert 0 == 1"

