  expect: "README.md: workflow table is"

# AGENTS.md restates each operating rule in one line so an agent sees it before its
# first tool call, and operating-rules.md carries the rule and its evidence. Two copies
# is the arrangement that drifts, so both directions of drift are rehearsed.
- name: operating rules - the summary an agent reads contradicts the source
  file: ../AGENTS.md
  replace:
    - "- **OR-3:** Never wait on a gate with nothing else in flight."
    - "- **OR-3:** Wait for the gate to finish before starting anything else."
  run: python3 -m devtools.render_operating_rules --check
  expect: "AGENTS.md's summary has drifted"

# The injected id must be EXACTLY one past the highest real rule. Not one behind, which is
# a duplicate, and not far ahead, which is a gap -- the renderer refuses both on contiguity
# before it can notice the drift this control is about, and a control that fails for the
# wrong reason is what `expect` exists to catch.
#
# This has now bitten three times: OR-8 added while this injected OR-8, OR-9 the same, and
# then an attempt to end the recurrence by jumping to OR-900, which failed on 2026-08-31
# with "rule ids are not contiguous from OR-1: ... OR-9, OR-900". There is no id that
# survives a new rule, so bump this one and the gap control below whenever a rule is added.
- name: operating rules - a new rule never reaches the summary
  file: ../operating-rules.md
  replace:
    - "<!-- This document follows common-doc-guidelines.md."
    - |-
      ## OR-12: Never push to a branch other than the designated one

      <!-- This document follows common-doc-guidelines.md.
  run: python3 -m devtools.render_operating_rules --check
  expect: "AGENTS.md's summary has drifted"

- name: operating rules - a gap in the rule numbering is not renumbered silently
  file: ../operating-rules.md
  replace: ["## OR-6: Plan multi-hour", "## OR-11: Plan multi-hour"]
  run: python3 -m devtools.render_operating_rules --check
  expect: "rule ids are not contiguous from OR-1"

- name: synopsis - dateline duplicates volatile campaign progress
  file: ../SYNOPSIS.md
  replace: ["**Date:**", "**Date:** after a campaign checkpoint;"]
  run: uv run --frozen --quiet python -m devtools.check_synopsis
  expect: "Date dateline repeats campaign progress"

# The registry table repeats the ledger's per-hypothesis totals verbatim. H-023
# silently lagged exp-039 this way (D-333), so the rounds column is now compared
# row by row and this control rehearses one row going stale.
- name: synopsis - registry rounds column lagging the ledger
  file: ../SYNOPSIS.md
  replace: ["classifiable | 14 | 106m agent", "classifiable | 13 | 106m agent"]
  run: uv run --frozen --quiet python -m devtools.check_synopsis
  expect: "H-021 shows 13 rounds, ledger counts 14"

# `expect` deliberately stops before the count. This control encoded the live round
# total twice -- once in `replace`, once in `expect` -- and the two rot differently: a
# stale `replace` fails loudly, because its search string no longer matches and the
# mutation cannot be applied, while a stale `expect` degrades quietly into "failed, but
# not with the expected message", which reads as a broken control rather than a moved
# corpus. That is what happened: the count went 59 -> 64, `replace` was updated and
# `expect` was not. One place tracking the corpus is enough, and it should be the one
# that announces itself.
- name: synopsis - narrative round aggregate lagging the ledger
  file: ../SYNOPSIS.md
  replace: ["There are 64 terminal rounds", "There are 45 terminal rounds"]
  run: uv run --frozen --quiet python -m devtools.check_synopsis
  expect: "terminal-round aggregate is not"

- name: synopsis - numerical result promoted past a formal prerequisite
  file: ../SYNOPSIS.md
  replace: ["leaves H-024 unresolved", "refutes H-024"]
  run: uv run --frozen --quiet python -m devtools.check_synopsis
  expect: "exp-012 must leave H-024 unresolved"

