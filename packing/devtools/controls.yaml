# --- the atlas emission precision (BC-068) ---
# Restoring the leak takes the whole `with` block, not just the assignment inside it:
# setting the global context from within a `localcontext()` scope mutates the copy that
# scope restores on exit, which leaks nothing and would leave the control silent.
- name: emission precision - a field refinement leaks into the global decimal context
  file: src/sqpack/field.py
  replace:
  - "        with decimal.localcontext() as context:\n            context.prec = digits + 20\n            slo, shi = str(+as_dec(lo)), str(+as_dec(hi))\n"
  - "        decimal.getcontext().prec = digits + 20\n        slo, shi = str(+as_dec(lo)), str(+as_dec(hi))\n"
  run: uv run --frozen --quiet pytest -q tests/test_emission_precision.py
  expect: "NumberField.decimal left the global decimal precision at"

- name: emission precision - the renderer inherits its precision instead of pinning it
  file: src/sqpack/render/numbers.py
  replace: ["        context.prec = SVG_EMISSION_PRECISION\n", "        context.prec = context.prec\n"]
  run: uv run --frozen --quiet pytest -q tests/test_emission_precision.py
  expect: "the emitted SVG followed the ambient decimal context to"

# --- the exact round trip (BC-067) ---
#
# Both controls restore a form of "trust the answer". The first drops the certification
# that makes the recovered generator a derivation rather than a guess; the second
# replaces the side comparison with validity, which is precisely the trap the promotion
# spec names -- a wrong contact structure yielding a packing that verifies and is not
# the one the field describes.
- name: exact round trip - the recovered generator is trusted instead of certified
  file: src/sqpack/promote/roundtrip.py
  replace: ["    certified = _horner(generator_min_poly, generator, field).is_zero()",
            "    certified = True"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_roundtrip.py -q
  expect: "a perturbed generator was certified against u's minimal polynomial"

- name: exact round trip - the side comparison is replaced by validity
  file: src/sqpack/promote/roundtrip.py
  replace: ["    matches = (side - field.alpha).is_zero()",
            "    matches = bool(report.valid)"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_roundtrip.py -q
  expect: "so the side comparison is not catching a valid but suboptimal packing"

# --- the exact LP (BC-061) ---
# The module's whole claim is that it refuses rather than rounds, so each control
# restores a missing refusal and the test names the guard that went absent. The two
# assembly controls attack the cell instead: a wrong row still solves, and only the
# known answer catches it.
- name: exact LP - a point that violates a row is certified as a vertex
  file: src/sqpack/exact_lp.py
  replace: ["        if sign(slack) < 0:", "        if slack is None:"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_exact_lp.py -q
  expect: "an active set whose point violates a row was certified as a vertex"

- name: exact LP - a negative multiplier is accepted as optimal
  file: src/sqpack/exact_lp.py
  replace: ["    for position, value in enumerate(multipliers):\n        if sign(value) < 0:",
            "    for position, value in enumerate(multipliers):\n        if value is None:"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_exact_lp.py -q
  expect: "a feasible but suboptimal vertex was certified as optimal"

- name: exact LP - a rank-deficient active set is eliminated past instead of refused
  file: src/sqpack/exact_lp.py
  replace: ["        if pivot is None:\n            raise ExactLPError(\n                \"singular-basis\", f\"the active set is rank deficient at column {column}\"\n            )\n",
            "        if pivot is None:\n            continue\n"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_exact_lp.py -q
  expect: "a rank-deficient active set was solved rather than refused"

- name: exact LP - a short candidate set is returned as if it spanned a vertex
  file: src/sqpack/exact_lp.py
  replace: ["    raise ExactLPError(\n        \"no-vertex-basis\",\n        f\"only {len(chosen)} of the {wanted} independent rows a vertex needs are among \"\n        f\"the {len(candidates)} candidate(s) offered\",\n    )",
            "    return tuple(chosen)"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_exact_lp.py -q
  expect: "was accepted as a 23-row vertex basis"

- name: exact LP - the pivot budget never stops the simplex
  file: src/sqpack/exact_lp.py
  replace: ["        if pivots >= pivot_budget:", "        if pivots >= pivot_budget + 1000:"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_exact_lp.py -q
  expect: "the exact simplex ran past its pivot budget"

- name: exact LP - the container side drops out of a containment row
  file: src/sqpack/exact_lp.py
  replace: ["            add(f\"wall:{index}:right:{corner}\", {index: one, side_column: -one}, -px)",
            "            add(f\"wall:{index}:right:{corner}\", {index: one, side_column: -one}, px)"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_exact_lp.py -q
  expect: "the exact LP optimum is not Trump's published side"

- name: exact LP - every coefficient is reported rational
  file: src/sqpack/exact_lp.py
  replace: ["    return not any(coefficients[1:])", "    return True"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_exact_lp.py -q
  expect: "Trump's cell was reported rational"

# --- the n = 5 closure (BC-069) ---
# The n = 5 condition is the contact map differentiated along the direction the contacts
# leave free, and the risk it carries is D-361's: a condition sized or shaped to make the
# counts meet rather than derived. The first two controls restore each way of doing that,
# and both are caught by the comparison against the midpoint statement rather than by a
# count. The last three restore the structural bug that made a closure inert -- prose in a
# field nothing evaluates -- from each of the three places it can be reintroduced.
- name: system assembly - the closure pins the free angle at its measured value
  file: src/sqpack/promote/system.py
  replace: ["sp.Float(component) * sp.diff(row, symbol)",
            "sp.Float(component) * (symbol - sp.Float(0.7853981633974483))"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_system.py -q
  expect: "is not the directional derivative of the contact map"

- name: system assembly - the closure repeats the contact equations instead of differentiating them
  file: src/sqpack/promote/system.py
  replace: ["sp.Float(component) * sp.diff(row, symbol)", "sp.Float(component) * row"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_system.py -q
  expect: "close could not supply the n = 5 condition"

- name: system assembly - the free direction is taken with its measurement noise
  file: src/sqpack/promote/system.py
  replace: ["        kept = [value if abs(value) > cut else 0.0 for value in raw]",
            "        kept = list(raw)"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_system.py -q
  expect: "has kept measurement noise the rank tolerance cuts"

- name: system assembly - the Jacobian is taken of the contacts alone, so a closure cannot move it
  file: src/sqpack/promote/system.py
  replace:
  - "    equations = [sp.sympify(equation) for equation in system.all_equations]\n    symbols = _symbols_by_name(system, equations)\n    matrix = sp.Matrix(\n"
  - "    equations = [sp.sympify(equation) for equation in system.equations]\n    symbols = _symbols_by_name(system, equations)\n    matrix = sp.Matrix(\n"
  run: uv run --frozen --group dev python -m pytest tests/test_promote_system.py -q
  expect: "close could not supply the n = 5 condition"

- name: system assembly - the residual skips the closure, so nothing checks it at the pose
  file: src/sqpack/promote/system.py
  replace:
  - "    equations = [sp.sympify(equation) for equation in system.all_equations]\n    symbols = _symbols_by_name(system, equations)\n    substitution = dict"
  - "    equations = [sp.sympify(equation) for equation in system.equations]\n    symbols = _symbols_by_name(system, equations)\n    substitution = dict"
  run: uv run --frozen --group dev python -m pytest tests/test_promote_system.py -q
  expect: "so the closure is carried but never checked"

# --- exact LP phase 1 (BC-071) ---
# Phase 1 claims two things a wrong answer would also claim: that the vertex it starts
# from is feasible by construction, and that a refusal means the cell is empty rather
# than that the search gave up. The first three controls attack the construction -- the
# weights that make the edge enterable, the row that closes it into a vertex, and the
# point the finished active set is read at -- and the last two remove the two refusals.
- name: exact LP phase 1 - the artificial column is too light to enter the edge from
  file: src/sqpack/exact_lp.py
  replace: ["        weights[index] = rate + lp.one if sign(rate) > 0 else lp.one",
            "        weights[index] = lp.one"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_exact_phase1.py -q
  expect: "phase 1 could not build an edge into the axis-aligned cell"
  timeout_seconds: 300

- name: exact LP phase 1 - the edge is entered at the wrong end
  file: src/sqpack/exact_lp.py
  replace: ["        if sign(reach - height) > 0:", "        if sign(reach - height) < 0:"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_exact_phase1.py -q
  expect: "the phase-1 start is not a feasible vertex of the auxiliary program"
  timeout_seconds: 300

- name: exact LP phase 1 - the starting basis is read at the wrong point
  file: src/sqpack/exact_lp.py
  replace: ["        )\n        == 0", "        )\n        >= 0"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_exact_phase1.py -q
  expect: "phase 1 handed phase 2 a start it refused"
  timeout_seconds: 300

- name: exact LP phase 1 - an empty cell is answered with a point
  file: src/sqpack/exact_lp.py
  replace: ["    if sign(relaxation) > 0:", "    if sign(relaxation) > 1:"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_exact_phase1.py -q
  expect: "four unit squares were fitted into a side-1 container rather than refused"
  timeout_seconds: 300

- name: exact LP phase 1 - the pivot budget never reaches the auxiliary solve
  file: src/sqpack/exact_lp.py
  replace: ["    solution = solve(program, start, sign, pivot_budget=pivot_budget)",
            "    solution = solve(program, start, sign, pivot_budget=pivot_budget + 1000)"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_exact_phase1.py -q
  expect: "phase 1 ran past its pivot budget"
  timeout_seconds: 300

# --- the relation sweep's reach (BC-073) ---
# The n = 29 refusal was recorded at degree twenty because twenty was a flag's default,
# not because the digits ran out. Saying how far they do go takes three pieces -- the
# digits a clause may rely on, the ceiling that falls out of clause 3, and the probe
# taking that ceiling rather than a number someone typed -- and each control removes one
# of them. The last one runs a whole sweep on the synthetic case, hence the timeout.
- name: relation reach - the digits are read from the residual bound alone
  file: src/sqpack/promote/solve.py
  replace:
  - "    truncation = mp.mpf(10) ** (-digits_carried(value))\n    return -mp.log10(max(bound, truncation))"
  - "    return -mp.log10(bound)"
  run: uv run --frozen --group dev python -m pytest tests/test_promote_solve.py -q
  expect: "the value's own length was not counted against it"

- name: relation reach - the ceiling admits a degree clause 3 could not judge
  file: src/sqpack/promote/solve.py
  replace: ["    return max(int(mp.ceil(terms)) - 2, 0)", "    return max(int(mp.ceil(terms)) - 1, 0)"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_solve.py -q
  expect: "the reach admits a degree clause 3 would refuse"

- name: relation reach - the probe sweeps to a typed-in ceiling instead of the digits
  file: devtools/probe_minimal_polynomial.py
  replace: ["        max_degree = max(ceiling, 2)", "        max_degree = 20"]
  run: uv run --frozen --group dev python -m pytest tests/test_promote_solve.py -q
  expect: "the probe stopped short of the degree its digits reach"
  timeout_seconds: 300

# --- the exact grid replay, after it moved out of the schema step (D-370) ---
# BC-077 moved this replay from `soft-schema validation` into `exact verification`.
# A move that quietly stops a check is exactly the under-run the tier work is written
# against, and the move is invisible in the timings that motivated it -- the step got
# faster either way. These two controls are the difference between knowing it still
# fires and assuming it does.
- name: exact grid replay - a grid too small to hold its squares is still caught
  file: devtools/check_basic_bounds.py
  replace: ["    side = root if root * root == n else root + 1", "    side = root"]
  run: uv run --frozen python -m devtools.check_basic_bounds
  expect: "exact grid witness replay failed"

- name: exact grid replay - the step that now owns it actually reaches it
  file: devtools/check_basic_bounds.py
  replace: ["    side = root if root * root == n else root + 1", "    side = root"]
  run: uv run --frozen packing-validate --only "exact verification"
  expect: "exact grid witness replay failed"
  timeout_seconds: 300

# The agenda map is generated from every agenda's frontmatter and is the document a
# session reads to pick a slice. Two ways it can lie: the table drifts from the records,
# or a commitment's state changes and the map keeps the old one. Both are rehearsed.
- name: agenda map - the map drifts from the agendas it is generated from
  file: campaign/agenda-map.md
  replace: ["## Live queue", "## Live queue (edited by hand)"]
  run: python3 -m devtools.render_agenda_map --check
  expect: "is stale"

- name: agenda map - a terminal commitment cannot be reopened
  file: campaign/agendas/agenda-008-queue-repair-and-the-discriminating-control.md
  replace:
    - |-
      - id: BC-081
          purpose: tool_validation
          owner_focus: process
          instances: [3, 5, 29]
          state: complete
    - |-
      - id: BC-081
          purpose: tool_validation
          owner_focus: process
          instances: [3, 5, 29]
          state: ready
  run: python3 -m devtools.render_agenda_map --check
  expect: "every item in a completed or superseded agenda must be complete or stopped"

# D-374: the queue offered four finished commitments as takeable, because a discharge
# was prose in a later agenda and nothing read it. Both refusals that replaced the prose
# are rehearsed here -- neither is a report the renderer can be talked past.
- name: agenda map - a discharged commitment is offered as takeable again
  file: campaign/agendas/agenda-005-symbolic-promotion-and-identity.md
  replace:
    - |-
      state: complete
          discharged_by: BC-053
    - |-
      state: ready
          discharged_by: BC-053
  run: python3 -m devtools.render_agenda_map --check
  expect: "not takeable"

- name: agenda map - a blocked commitment waits on nothing observable
  file: campaign/agendas/agenda-002-constructive-enumeration-groundwork.md
  # BC-016 was once the only commitment here carrying `blocked_on`; BC-025 now does too,
  # so the bare key matches twice and the control stopped firing (D-403). Anchored on the
  # id as well, which is what the old comment assumed rather than stated.
  replace: ["    blocked_on: >-\n      Retained input poses and symbolic active-cell rows", "    unrelated_note: >-\n      Retained input poses and symbolic active-cell rows"]
  run: python3 -m devtools.render_agenda_map --check
  expect: "unobservable"

# BC-084: change-scoped selection may run too much and may never run too little. The
# reachability check is the only thing standing between a mistyped glob and a step that
# silently stops being selected, so it is rehearsed failing.
- name: gate selection - a step's patterns stop matching anything real
  file: src/sqpack/cli/validate.py
  # The mutation must replace the WHOLE tuple: leaving `*_CORE` in place keeps the step
  # matching probe paths, so a minimal anchor makes this fire for the wrong reason --
  # which is exactly what happened when it was first repaired. Multi-line by necessity,
  # and check_control_anchors is what catches the source being reformatted under it.
  replace:
    - "        touches=(\n            *_CORE,\n            \"packing/frontier/*\",\n            \"packing/devtools/assess_frontier_rigidity.py\",\n            # `SCREEN` is atlas/known-best/translation-escape-screen.json, and the pinned\n            # rigid/not-rigid/undetermined counts are exactly what changing it moves.\n            \"packing/atlas/known-best/*\",\n        ),\n"
    - "        touches=(\"packing/frontier/no-such-file-anywhere\",),\n"
  run: uv run --frozen --quiet python -m pytest tests/test_change_scoped_selection.py -q
  expect: "match no probe path"

- name: gate selection - an unclaimed path stops widening the selection
  file: src/sqpack/cli/validate.py
  # Anchored on the guard alone. The return it guarded was wrapped by the formatter, and
  # pinning both lines made the control hostage to that (D-403).
  replace: ["    if unclaimed:\n", "    if False:\n"]
  run: uv run --frozen --quiet python -m pytest tests/test_change_scoped_selection.py -q
  expect: "failed"

