# Negative controls: each one corrupts something and asserts the guard complains.
#
# Every entry here was run by hand at least once and then thrown away. Checked in, they
# become the answer to "how do you know that check works?" -- and they are the
# regression layer the defect log kept recording as absent.
#
# Run: uv run --frozen --group dev python -m devtools.run_negative_controls
controls:

- name: test harness - missing configured test directory
  file: pyproject.toml
  replace: ['testpaths = ["tests"]', 'testpaths = ["tests-missing"]']
  run: uv run --frozen --group dev pytest -q
  expect: "configured test directories do not exist: tests-missing"

# --- the defect log's own invariants (D-018's class of bookkeeping failure) ---
- name: defect log - open defect with no bead
  file: defects.yaml
  replace: ["  bead: think-3szr\n", ""]
  run: python3 -m devtools.validate_schemas
  expect: "without a bead"

- name: defect log - soundness defect with no direction
  file: defects.yaml
  replace: ["  class: soundness\n  direction: flattering\n  detected_by: pre_registered_rule",
            "  class: soundness\n  detected_by: pre_registered_rule"]
  run: python3 -m devtools.validate_schemas
  expect: "soundness without a direction"

- name: defect log - narrative link pointing nowhere
  file: defects.yaml
  replace: ["  bead: think-wo4p\n  recorded_in: packing/src/sqpack/cli/validate.py",
            "  bead: think-wo4p\n  recorded_in: no/such/file.md"]
  run: python3 -m devtools.validate_schemas
  expect: "recorded_in does not exist"

- name: defect log - recurrence naming a defect that does not exist
  file: defects.yaml
  replace: ["  recurrence_of: D-010", "  recurrence_of: D-999"]
  run: python3 -m devtools.validate_schemas
  expect: "recurrence_of unknown"

- name: defect log - fixed status contradicting an unresolved fix
  file: defects.yaml
  replace:
    - |-
      - id: D-039
        title: A scalar side-error floor was treated as a basin-resolution theorem
        date: '2026-08-23'
        layer: tooling
        class: soundness
        direction: flattering
        detected_by: review
        severity: high
        status: outstanding
    - |-
      - id: D-039
        title: A scalar side-error floor was treated as a basin-resolution theorem
        date: '2026-08-23'
        layer: tooling
        class: soundness
        direction: flattering
        detected_by: review
        severity: high
        status: fixed
  run: python3 -m devtools.validate_schemas
  expect: "D-039: fixed while fix still says none yet"

# Mutate the stable dataset header rather than copying the live defect count into the
# control. The semantic checker still compares the mutated value with the full list.
- name: defect log - count disagreeing with the list
  file: defects.yaml
  replace: ["status: enforced\ncount:", "status: enforced\ncount: 20 #"]
  run: python3 -m devtools.validate_schemas
  expect: "count 20 !="

- name: README - repeated numeric gate-defect aggregate
  file: ../README.md
