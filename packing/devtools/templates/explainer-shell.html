<!doctype html>
<html lang="en" data-kpress-theme="system" data-kpress-resolved-theme="light"
      data-kpress-palette="neutral" data-kpress-prose-font="serif">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="kpress">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{PAGE_DESCRIPTION}}">
<!-- What a shared link shows. Everything the page itself loads is inlined or relative,
     because it has to open the same way from a file, from Pages and from an artifact
     host; these are the exception, and they are not loads. A crawler reads them off the
     markup with no base to resolve against, so each URL is absolute, and no browser
     fetches any of them to display the page. The image is the atlas composite served
     beside this file: portrait, so X and Facebook crop it to a band of the grid and
     Slack, Discord and iMessage scale all hundred packings down whole. The width and
     height are read from that PNG, so a consumer can reserve the box before it has the
     bytes. -->
<link rel="canonical" href="{{CANONICAL_URL}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{PAGE_DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:image" content="{{CARD_IMAGE_URL}}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="{{CARD_IMAGE_WIDTH}}">
<meta property="og:image:height" content="{{CARD_IMAGE_HEIGHT}}">
<meta property="og:image:alt" content="{{COMPOSITE_ALT}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{PAGE_TITLE}}">
<meta name="twitter:description" content="{{PAGE_DESCRIPTION}}">
<meta name="twitter:image" content="{{CARD_IMAGE_URL}}">
<meta name="twitter:image:alt" content="{{COMPOSITE_ALT}}">
<style>{{KPRESS_CSS}}</style>
<script>{{THEME_BOOTSTRAP}}</script>
<style>
/* ============================================================
   This page on top of the kpress design system.

   Everything typographic -- the reading measure, the type ramp, headings,
   lists, code, the color roles and both themes -- comes from the kpress
   stylesheets above. What follows is only what kpress has no component for:
   the certificate's figures and the two interactive panels. Every value here
   is a kpress token, so the figures move with the system rather than beside
   it.
   ============================================================ */

/* One accent, everywhere. kpress ships a separate link blue and sets it on
   `:root`, on `.kpress`, and again per theme and palette on attribute selectors,
   all of which outrank `body`; the popovers it appends carry `.kpress-tooltip`
   and their own resolved-theme attribute. Anything reading the token got the
   blue, which is why a footnote popover drew a blue rule down its edge while
   the text beside it was teal. Redeclare the token in the same places kpress
   does, so the page's accent is what every consumer of it resolves. */
:root,
.kpress,
.kpress-page-main,
.kpress-tooltip,
:is(.kpress, .kpress-page-main, .kpress-tooltip)[data-kpress-resolved-theme],
:is(.kpress, .kpress-page-main, .kpress-tooltip)[data-kpress-palette][data-kpress-resolved-theme],
body {
  --kpress-doc-link: var(--kpress-doc-accent);
  --color-primary-light: var(--kpress-doc-accent);
}
.cert-page { padding-block-end: calc(var(--kpress-font-size-base) * 6); }
.cert-page a, .cert-page .kpress-footnote-ref a, .cert-page a.kpress-footnote-backref,
.cert-page a:hover, .kpress a.kpress-footnote-backref:hover,
.kpress-tooltip a, .kpress-tooltip a:hover, .kpress-tooltip .kpress-footnote-nav-link { color: var(--kpress-doc-accent); }

/* One transition for every hover and every replaced readout: fast, and the
   same everywhere. The scripts set `.swap` on a readout whose text they
   replace, so it fades in rather than flicking. */
.cert-page a, .cert-page button, .cert-page .verdict, .cert-page .mass-dec,
.cert-page .kpress-footnote-ref a, .cert-page a.kpress-footnote-backref {
  transition: color 120ms ease-out, background-color 120ms ease-out, border-color 120ms ease-out;
}
@keyframes cert-swap { from { opacity: 0; } to { opacity: 1; } }
.cert-page .swap { animation: cert-swap 160ms ease-out; }
@media (prefers-reduced-motion: reduce) {
  .cert-page a, .cert-page button, .cert-page .verdict, .cert-page .mass-dec, .cert-page .swap {
    animation: none;
    transition: none;
  }
}

/* Prose keeps the kpress measure; figures are allowed a wider track. The
   Markdown body has no column wrappers, so every direct child of the page and
   of an article takes the measure unless it is a figure. kpress indents a list
   with a margin, which the measure resets; the indent comes back as padding
   inside the measured box, so a list's text is narrower by the same amount. */
.cert-page > :is(ul, ol) { box-sizing: border-box; padding-inline-start: 1.8rem; }
.cert-page > :not(figure, .cert-figure, .kpress-figure),
.col {
  margin-inline: auto;
  max-width: calc(var(--kpress-measure) + 2 * var(--kpress-column-inset));
}
.cert-page figure {
  margin-inline: auto;
  margin-block: calc(var(--kpress-font-size-base) * 1.8) 0;
  max-width: calc(var(--kpress-measure) + 14rem);
  border: 1px solid var(--kpress-doc-border);
}

/* A section label, in the kpress caps idiom. */
.caps {
  color: var(--kpress-doc-muted);
  font-family: var(--kpress-font-sans);
  font-size: var(--kpress-caps-label-size);
  font-weight: var(--kpress-font-weight-sans-medium);
  letter-spacing: var(--kpress-caps-spacing);
  text-transform: var(--kpress-caps-transform);
}
/* A section starts with room above its heading, so it reads as a new step. */
.section-head { margin-block: calc(var(--kpress-font-size-base) * 2.6) 0.9rem; text-align: center; }
/* A section starts with room above its heading and a breath below it. */
.cert-page h2 { margin-block: calc(var(--kpress-font-size-base) * 2.8) 1.3rem; text-align: center; }
/* A box holds discrete statements rather than continuous argument, so its
   paragraphs stand a little further apart than running prose, which kpress sets at
   0.75rem. One rule serves both boxes on the page, the five conditions and the
   contradiction, so they cannot drift into two rhythms.

   The conditions were a bulleted list and are now paragraphs. The bold lead already
   numbers and names each one, so a marker beside it said the same thing twice, and
   losing the list's hanging indent lets each condition start on the measure with
   everything else. `.conditions ol` and `.conditions li` styled an ordered list this
   page had stopped emitting; they are gone with it. */
.cert-page .boxed-text p { margin-block: 0.95rem; }
.intro .section-head { margin-block-start: 0; }

.hero { padding-block-start: calc(var(--kpress-font-size-base) * 3); }
/* The heading is set in caps by kpress; s(n) is notation and keeps its case. */
.hero h1 .symbol { text-transform: none; }
/* Mathematical relations set in a sans line.

   Source Sans 3 carries no U+2265, so the browser resolves the one character to
   whatever other family in the stack has it. That would pass unnoticed if it landed
   on a regular weight, but the hero is set at 550 and CSS weight matching searches
   upward from anything above 500: the fallback family offers 400 and 700, and answers
   with Bold. One bold character in a semibold line -- measured 18% heavier in stroke
   and up to twice the ink of the digits beside it, drawn from DejaVu Sans Bold in the
   printed file while every other glyph on the line came from Source Sans 3.

   Naming the weight is the whole fix, and the family stays inherited. Three
   treatments were rendered and compared: the sans fallback at 400, the same relation
   drawn from the page's own KaTeX_Main, and the whole line set as mathematics. The
   sans one wins on the only thing that shows at this size -- it is drawn like the
   digits beside it, flat terminals and the same geometry, and at 400 its stroke sits
   close to the semibold it stands in, where a Computer Modern relation is a hairline
   against Source Sans and reads as light as the bold read heavy.

   The cost is stated rather than hidden: this is the one glyph on the page the
   reader's own machine supplies, so it is drawn in whichever sans that machine has.
   The weight is fixed everywhere, which is what the defect was about.

   Every site this class marks -- the hero, the two verdict badges, the two figure
   captions -- is set at 550, so one rule serves them all. Naming the weight also
   guards the KaTeX route if it is ever taken: KaTeX_Main ships Regular and Bold, and
   at the inherited 550 the same upward search would pick the Bold. */
.rel { font-weight: 400; }
/* Under the title: the description in sans caps, a step below the title's
   size, then the deck in the prose face, italic. */
.cert-page .hero .subtitle {
  color: var(--kpress-doc-text);
  font-family: var(--kpress-font-sans);
  font-feature-settings: var(--kpress-font-features-sans);
  font-size: calc(var(--kpress-font-size-base) * 1.3);
  font-style: normal;
  font-variant-caps: var(--kpress-caps-variant);
  font-weight: var(--kpress-font-weight-sans-medium);
  letter-spacing: var(--kpress-caps-spacing);
  line-height: 1.2;
  margin-block: 0.5rem 0;
  text-transform: var(--kpress-caps-transform);
}
/* The hero is centered: title, subtitle and credits; the deck below reads as prose. */
.cert-page .hero h1, .cert-page .hero .subtitle, .credits { text-align: center; }
.credits {
  display: grid;
  font-family: var(--kpress-font-sans);
  font-feature-settings: var(--kpress-font-features-sans);
  font-size: var(--kpress-font-size-normal);
  gap: 0.2rem;
  line-height: 1.45;
  margin-block: 2rem 2.2rem;
}
.credits strong { font-weight: var(--kpress-font-weight-sans-bold); }
.cert-page .hero .deck { font-family: var(--kpress-font-prose); font-style: italic; margin-block: 0; }
/* Where this page came from and how to take it away, at the top corner and out of
   the way. Chips rather than prose: they are tools, not part of the argument. */
.doc-links {
  display: flex;
  float: inline-end;
  gap: 0.4rem;
  margin-block-start: 0.15rem;
  margin-inline-start: 1rem;
}
.doc-links .chip {
  align-items: center;
  border: 1px solid var(--kpress-doc-border);
  border-radius: var(--kpress-radius-sm);
  color: var(--kpress-doc-muted);
  display: inline-flex;
  font-family: var(--kpress-font-sans);
  font-size: var(--kpress-font-size-tiny);
  font-weight: var(--kpress-font-weight-sans-medium);
  gap: 0.3rem;
  letter-spacing: 0.02em;
  line-height: 1;
  padding: 0.32rem 0.5rem;
  text-decoration: none;
}
.doc-links .chip:hover {
  background: var(--kpress-doc-surface-hover);
  border-color: var(--kpress-doc-accent);
  color: var(--kpress-doc-accent);
  /* kpress underlines a link on hover, which is right for a link in a sentence and
     wrong for a bordered chip: the rule lands inside the box and reads as a defect.
     The chip already answers the hover with its border, its ground and its colour,
     all three on the page's shared 120ms transition. */
  text-decoration: none;
}
.doc-links .chip svg { display: block; }

/* The deck is a div so its footnote renders; the paragraph inside keeps its edges. */
.cert-page .hero .deck > p { margin-block: 0; }

/* The certificate switch sits at the foot of every figure it changes; the articles
   are whole documents, so they are hidden outright. */
.cert-toggle { display: inline-flex; gap: 0.3rem; }
.cert-toggle button { white-space: nowrap; }
.intro { margin-block-start: 1.6rem; }
/* The atlas rendering is inlined: its ground and strokes take the page's
   theme, and its own caption is replaced by the figure's. */
.trump a { display: block; width: min(100%, 24rem); }
.trump svg { display: block; height: auto; width: 100%; }
.trump svg rect[fill="#ffffff"] { fill: var(--kpress-doc-bg); }
.trump svg [stroke="#000000"] { stroke: var(--kpress-doc-text); }
.trump svg text { display: none; }
.cert-figure[hidden] { display: none; }
.colophon {
  color: var(--kpress-doc-muted);
  font-family: var(--kpress-font-sans);
  font-size: var(--kpress-font-size-tiny);
  margin-block: 2.5rem 0;
  text-align: center;
}

.line-fig { padding: 1.3rem 1.1rem 0.4rem; }
/* `.kpress-diagram svg` sets display, height and centring; these figures also
   need full width and labels allowed outside the viewBox. */
.line-fig svg, .chart svg { overflow: visible; width: 100%; }
.line-fig svg text, .chart svg text {
  fill: var(--kpress-doc-muted);
  font-family: var(--kpress-font-sans);
}

/* Figure chrome. The figure carries no title: the caption names it, and repeating
   the number above the frame said the same thing twice. What the head did carry that
   the caption cannot is the certificate chooser, which belongs with the diagram it
   changes, so it sits at its foot. */
.fig-choose {
  border-block-start: 1px solid var(--kpress-doc-border);
  display: flex;
  justify-content: center;
  padding: 0.7rem 1.1rem;
}
.tag {
  background: color-mix(in srgb, var(--kpress-doc-accent) 12%, transparent);
  border-radius: var(--kpress-radius-sm);
  color: var(--kpress-doc-accent);
  font-family: var(--kpress-font-sans);
  font-size: var(--kpress-font-size-tiny);
  font-weight: var(--kpress-font-weight-sans-medium);
  letter-spacing: var(--kpress-caps-spacing);
  padding: 0.05rem 0.4rem;
}
/* No box around a figure, and no rule under it. kpress draws both, and on a page
   this dense they add a grid of grey the content did not ask for; the figures are
   already set apart by their own white space and by the caption's voice.

   The padding stays. It was there to hold the caption off the border, and with the
   border gone it does the work the border was doing: the caption sits inset from the
   measure, so a reader can see where the figure ends and the prose resumes. */
.cert-page .kpress-figure { border: 0; }
.cert-page .kpress-figcaption {
  border-block-start: 0;
  margin-block-start: 0;
  padding: 0.85rem 1.1rem 1rem;
}
.cert-page .kpress-figcaption strong {
  color: var(--kpress-doc-text);
  font-weight: var(--kpress-font-weight-sans-medium);
}

/* The mass budget. */
.mass-line {
  color: var(--kpress-doc-muted);
  display: flex;
  flex-wrap: wrap;
  font-family: var(--kpress-font-sans);
  font-size: var(--kpress-font-size-tiny);
  gap: 1rem;
  justify-content: space-between;
  margin-block-start: 0.6rem;
  padding: 0 1.1rem 0.9rem;
}
.mass-line .v { display: block; margin-block-start: 0.15rem; }

/* The two interactive stages. */
.split { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(14rem, 1fr); }
/* Figures sit on the page's own ground, and the canvases take the room the
   figure track gives them. */
.stage {
  align-items: center;
  background: var(--kpress-doc-bg);
  display: flex;
  justify-content: center;
  padding: 0.6rem;
}
.stage canvas {
  cursor: grab;
  display: block;
  height: auto;
  max-width: 42rem;
  touch-action: none;
  width: 100%;
}
.stage canvas:active { cursor: grabbing; }
/* The atom readout: a fixed panel beside the canvas, in the sans face. */
.tip-panel {
  color: var(--kpress-doc-text);
  font-family: var(--kpress-font-sans);
  font-size: var(--kpress-font-size-small);
  line-height: 1.5;
}
.tip-panel .tip-w { color: var(--kpress-doc-muted); display: block; margin-block-start: 0.1rem; }
.tip-panel .katex { font-size: 1.1em; }
.panel {
  border-inline-start: 1px solid var(--kpress-doc-border);
  display: flex;
  flex-direction: column;
  font-family: var(--kpress-font-sans);
  gap: 1.1rem;
  padding: 1.1rem;
}
@media (max-width: 52rem) {
  .split { grid-template-columns: 1fr; }
  .panel { border-block-start: 1px solid var(--kpress-doc-border); border-inline-start: 0; }
}

.readout { padding: 0.2rem 0 0.7rem; }
.readout .caps { display: block; margin-block-end: 0.5rem; }
.mass-val {
  align-items: center;
  display: flex;
  font-size: calc(var(--kpress-font-size-base) * 1.9);
  line-height: 1.1;
  min-height: 2.4em;
}
.mass-val .katex { font-size: 1em; }
.mass-row { align-items: baseline; display: flex; flex-wrap: wrap; gap: 0.15rem 0.7rem; }
.mass-dec {
  color: var(--kpress-doc-text);
  font-size: var(--kpress-font-size-large);
}
.verdict {
  border-radius: var(--kpress-radius-sm);
  display: inline-block;
  font-size: var(--kpress-font-size-tiny);
  font-weight: var(--kpress-font-weight-sans-medium);
  letter-spacing: var(--kpress-caps-spacing);
  margin-block-start: 0.6rem;
  padding: 0.1rem 0.4rem;
  text-transform: var(--kpress-caps-transform);
}
.verdict.ok {
  background: color-mix(in srgb, var(--kpress-doc-accent) 12%, transparent);
  color: var(--kpress-doc-accent);
}
.verdict.no {
  background: color-mix(in srgb, var(--cert-below) 16%, transparent);
  color: var(--cert-below);
}
.verdict.out { background: var(--kpress-doc-code-bg); color: var(--kpress-doc-muted); }

.ctl { display: flex; flex-direction: column; gap: 0.4rem; }
.ctl .val {
  color: var(--kpress-doc-text);
  font-size: var(--kpress-font-size-tiny);
  line-height: 1.6;
}
.cert-page input[type="range"] { accent-color: var(--kpress-doc-accent); margin: 0; width: 100%; }
.btns { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.cert-page button {
  background: var(--kpress-doc-bg);
  border: 1px solid var(--kpress-doc-border-hairline);
  border-radius: var(--kpress-radius-sm);
  color: var(--kpress-doc-text);
  cursor: pointer;
  font-family: var(--kpress-font-sans);
  font-size: var(--kpress-font-size-tiny);
  padding: 0.3rem 0.55rem;
}
.cert-page button:hover { background: var(--kpress-doc-surface-hover); }
.cert-page button[aria-pressed="true"] {
  background: color-mix(in srgb, var(--kpress-doc-accent) 12%, transparent);
  border-color: var(--kpress-doc-accent);
  color: var(--kpress-doc-accent);
}
.hint {
  color: var(--kpress-doc-muted);
  font-size: var(--kpress-font-size-tiny);
  line-height: 1.55;
  margin: 0;
}
.legend {
  color: var(--kpress-doc-muted);
  display: flex;
  flex-direction: column;
  font-size: var(--kpress-font-size-tiny);
  gap: 0.3rem;
}
.legend span { align-items: center; display: flex; gap: 0.5rem; }
.legend i { display: block; flex: none; height: 0.7rem; width: 0.9rem; }

.kv {
  align-items: baseline;
  display: grid;
  font-size: var(--kpress-font-size-tiny);
  gap: 0.3rem 0.9rem;
  grid-template-columns: auto 1fr;
}
.kv dt { color: var(--kpress-doc-muted); }
.kv dd { margin: 0; text-align: end; }
.kv dd.hi { color: var(--cert-probe); }

.chart { padding: 1.4rem 1.1rem 0.6rem; }

/* One role kpress has no token for: the square the reader drags, which must
   read as a separate instrument from the mass it measures. */
:root {
  /* kpress derives every size from this one token, so the page reads larger
     everywhere without any element being restyled. */
  --kpress-host-font-size-base: 18px;
  --cert-probe: oklch(55% 0.145 52);
  --cert-below: {{BELOW_ONE}};
  --cert-near: {{NEAR_LIMIT}};
  --cert-probe-wash: color-mix(in srgb, var(--cert-probe) 14%, transparent);
  --cert-accent-wash: color-mix(in srgb, var(--kpress-doc-accent) 12%, transparent);
}
:root:where([data-kpress-resolved-theme="dark"]) { --cert-probe: oklch(76% 0.13 60); }

/* Math is held until KaTeX has typeset it, so no raw TeX flashes. */
.tex, .tex-d { visibility: hidden; }
.math-ready .tex, .math-ready .tex-d { visibility: visible; }
/* Wide equations scroll sideways; the block keeps headroom for fractions, since
   overflow-x: auto also clips vertically and the display margin is zeroed. */
.tex-d { margin-block: 1.1rem; overflow-x: auto; overflow-y: hidden; padding-block: 0.45rem; }
.tex-d .katex-display { margin: 0; }
.caps .katex, .fig-title .katex, .legend .katex, .hint .katex { text-transform: none; }
/* kpress sizes math to the face it sits in; the page's own sans contexts take
   kpress's sans size, and its display blocks its display size. */
.kv .katex, .mass-line .katex, .legend .katex, .hint .katex, .fig-title .katex,
.caps .katex, .tip .katex { font-size: var(--kpress-katex-size-sans); }
.cert-page .tex-d .katex { font-size: var(--kpress-katex-size-display); }
.caps .katex { letter-spacing: 0; }
/* ============================================================
   Print. kpress prints a document well: page margins, 11pt type,
   forced-light tokens, break rules for headings, figures, boxes and
   display math, hidden buttons and popovers. It cannot know this page
   carries canvases, control panels and a figure chooser, so what
   follows is only what kpress does not cover.
   ============================================================ */
@media print {
  /* Without this the whole document prints as ONE page. kpress's page reset
     holds `html, body { height: 100%; overflow: hidden }` for the scrolling
     shell and its print stylesheet releases `.kpress-viewport` but not the
     two elements above it, so the paginator sees a single viewport of
     content and stops there. Measured before this rule: 1 page, and 92% of
     the document absent. */
  html, body { height: auto; overflow: visible; }

  /* Print shows one certificate, always the one the page opens on, so a
     printed copy does not depend on what the reader last clicked. */
  .cert-figure[data-cert="{{DEFAULT_SLUG}}"][hidden] { display: block !important; }
  .cert-figure:not([data-cert="{{DEFAULT_SLUG}}"]) { display: none !important; }

  /* Nothing on paper can be dragged, hovered or chosen. The buttons kpress
     already hides; these are the rest of the apparatus, including the empty
     rule the chooser would otherwise leave under every figure. */
  .panel, .fig-choose, .cert-page input[type="range"], .screen-only { display: none; }

  /* The panel is gone, so the figure body is a single column, and a canvas
     is capped by height rather than width so a square one fits the page with
     its caption. Both were taller than a page before.

     The canvas cap is 4.5in rather than 5.4in to buy back printed pages. A figure
     is `break-inside: avoid`, so one too tall for the space left is pushed whole to
     the next page and the current page ends early: measured, this document left
     32.94in of premature whitespace across four pages, which reads as a break
     arriving just after a heading even though a paragraph intervenes. It is not
     that: no heading in the document is stranded, kpress's `break-after: avoid`
     matches every one of them and was confirmed load-bearing by removing it. The
     figures were simply too tall. 4.5in and 4.6in measure the same and 4.4in is
     worse, because pagination is discrete.

     The image cap stays at 7in deliberately. Taking it to 6in would close the
     largest gap and save two more pages, but the image it caps is the hundred-cell
     atlas, whose per-cell labels already set at about 2.4pt; the whitespace is the
     cheaper thing to keep. */
  .split { display: block; }
  .stage canvas { max-height: 4.5in; width: auto; max-width: 100%; margin-inline: auto; }
  .cert-page figure img { max-height: 7in; width: auto; max-width: 100%; }

  /* Link targets are deliberately not spelled out after each link: a URL set in
     the middle of a sentence breaks the line badly and reads worse than the
     sentence it interrupts. The footnotes carry the sources, and the colophon
     carries the repository. */

  /* kpress forces its light tokens on `:root` and `.kpress`, which leaves the
     page's own main element and this page's one extra token on their dark
     values. A dark-mode reader would otherwise print prose on a dark ground
     and lose the Figure 7 threshold line entirely. */
  .kpress-page-main {
    --kpress-doc-bg: oklch(100% 0 0);
    --kpress-doc-border: oklch(78.26% 0 0);
    --kpress-doc-muted: oklch(38.67% 0 0);
    --kpress-doc-text: oklch(17.76% 0 0);
    background: oklch(100% 0 0);
    color: oklch(17.76% 0 0);
    color-scheme: light;
  }
  :root { --cert-probe: oklch(55% 0.145 52); }

  /* Legend chips carry their meaning in colour alone, so they keep it even
     when the reader prints without background graphics. */
  .legend i { border: 1px solid currentColor; print-color-adjust: exact; }

  /* The title block is a title page. */
  .intro { break-before: page; }

  /* Inline math is hidden until KaTeX finishes; on paper it should fall back
     to its source rather than to nothing. */
  .tex, .tex-d { visibility: visible; }

  /* Unrounded advances. This is what made the serif text look loose and, worse,
     uneven. Chromium's default `text-rendering: auto` rounds every glyph advance
     to a whole CSS pixel at layout time and then writes that rounded position
     into the PDF: measured here, 98.44% of the 11,177 glyph moves in the printed
     file sat on integers. At the print size the rounding is not small. PT Serif
     at 11pt is 14.6667px, where the word space gains 12.3% and `i` and `l` gain
     13.3% while the comma and the full stop lose about 10% -- a spread of 1.395px,
     or 9.5% of an em, between adjacent gaps. The true metrics are identical to the
     screen's; a sweep across 9pt to 14pt puts 11pt at the worst of the range.

     readers print from it loads, and every apostrophe and quotation mark in the
     prose then comes from a different face at different metrics. Print should not

     stylesheets are inlined in; a kpress release that adds `!important` or narrows

     extra elements are not justified by kpress today and cost nothing to name. */
  .kpress p, .kpress li, .kpress blockquote, .kpress dd, .kpress dt,
  .kpress figcaption, .kpress td, .kpress th, .kpress caption {

     makes it beat the title block's own centring, which is set on plain selectors.
     The subtitle, the credits and the colophon are centred by design and are restated
     here rather than carved out of the selector above, so the intent stays legible. */
  .cert-page .hero h1, .cert-page .hero .subtitle, .credits, .credits p, .colophon {
    text-align: center !important;

     overflow. With no hyphen to mark the break it reads as a typo. `overflow-wrap`

  .kpress ol > li > * { word-break: normal; }

     sets it to 0.7in, and nothing else stacks on top: kpress's own print stylesheet
     zeroes the page and document gutters, and neither width cap binds at this size.

     0.7in default was measured as the only contribution -- its own print stylesheet
     zeroes the page and document gutters, and neither width cap binds -- so this token
     is the whole knob. Widening it also shortens the line, which this page needs more
     than it needs the space: at 0.7in the measure ran to about 92 characters and at
     0.55in longer still, well past the 45 to 75 that reads comfortably. */
  :root { --kpress-print-page-margin: 1in; }
}

<body class="kpress-frame" data-kpress-frame>
<main class="kpress-page-main kpress-viewport" data-kpress-viewport>
<div class="kpress kpress-doc kpress-prose cert-page">
{{BODY_HTML}}
<p class="col colophon">Formatted and typeset with <a href="https://github.com/jlevy/flowmark"><strong>Flowmark</strong></a> and <a href="https://github.com/jlevy/kpress"><strong>KPress</strong></a></p>

<!--BEGIN:SCRIPT-->
<script>
(() => {
/* Certificate {{ID}} */
{{ATOMS}}
const SCALE = {{SCALE_JS}}, L = {{L_JS}}, B = {{B_JS}}, HALF = B / 2;

   the mark is conditional rather than blanket: at k = 0 the readout states the
   angle as an equality, and means it.

let sorted = [], cs = 1, sn = 0, angle = 0, onNet = true;

  sorted = ATOMS.map(a => [cs * a[0] + sn * a[1], -sn * a[0] + cs * a[1], a[2]])

/* ---------- Figure 3: the atoms ---------- */
const fc = document.getElementById('field-{{SLUG}}'), fg = fc.getContext('2d');
const FS = fc.width, FM = FS * 0.055, FPX = FS - 2 * FM, FSC = FPX / L;

  const [xn, xd, yn, yd, w] = ATOM_Q[i];

fc.addEventListener('pointerdown', pickAtom);

/* ---------- Figure 4 ---------- */

const RES = 230, TIGHT = {{TIGHT_JS}};

/* Handle geometry in container units, so it scales with the drawing. */

  const img = pg.createImageData(RES, RES), d = img.data;
  const parse = v => { const m = document.createElement('canvas').getContext('2d');
    m.fillStyle = v; m.fillRect(0, 0, 1, 1); return Array.from(m.getImageData(0, 0, 1, 1).data).slice(0, 3); };

  if (mode === 'move') { place(x + grabOffset[0], y + grabOffset[1]); return; }
  if (mode === 'rotate') { rotateTo(x, y); return; }
  const hot = overHandle(x, y);
  if (hot !== handleHot || !handleShown) { handleHot = hot; handleShown = true; drawProver(); }
  pv.style.cursor = hot || insideProbe(x, y) ? 'grab' : 'crosshair';
});
function endDrag() {
  /* The field is a function of the direction, so a rotation invalidates it. It
     is rebuilt on release rather than per frame: the rebuild is 53,000 cells. */
  const wasRotating = mode === 'rotate';
  mode = 'none';
  if (wasRotating && showHeat) { buildHeat(); drawProver(); }
}
pv.addEventListener('pointerup', endDrag);
pv.addEventListener('pointercancel', endDrag);
pv.addEventListener('pointerleave', () => {
  if (mode !== 'none') return;
  if (handleShown) { handleShown = false; handleHot = false; drawProver(); }
});

document.getElementById('kslider-{{SLUG}}').addEventListener('input', e => { setDir(+e.target.value); refresh(true); });
document.getElementById('btn-tight-{{SLUG}}').addEventListener('click', () => {
  setDir(0); document.getElementById('kslider-{{SLUG}}').value = 0;
  probe = [{{WITNESS_X_JS}}, {{WITNESS_Y_JS}}]; refresh(true);
  setText(document.getElementById('hint-{{SLUG}}'),
    'The tightest placement in the whole certificate: direction k = 0, covering {{LEAST_TEX_PLAIN}}.');
});
document.getElementById('btn-scan-{{SLUG}}').addEventListener('click', () => {
  const h = inset(); let best = Infinity, bx = 0, by = 0, N = 300;
  for (let j = 0; j <= N; j++) { const y = h + (L - 2 * h) * j / N;
    for (let i = 0; i <= N; i++) { const x = h + (L - 2 * h) * i / N;
      const m = massAt(x, y); if (m < best) { best = m; bx = x; by = y; } } }
  probe = [bx, by]; drawProver(); updateReadout();
  /* Exact, like the readout above it: an integer count of 1/SCALE units. */
  const lowest = (best / SCALE).toFixed(6);
  setText(document.getElementById('hint-{{SLUG}}'), onNet
    ? 'Raster scan of direction k = ' + curK + ': lowest sampled mass ' + lowest +
      '. A raster only samples; the exact sweep decides every cell of the arrangement.'
    : 'Raster scan at ' + (angle === 0 ? '' : '≈') + deg(angle, 4) + '°, off the net: lowest sampled mass ' + lowest +
      '. The certificate sweeps no angle off the net; Condition 5 is decided at the {{N_DIRECTIONS}} net directions only.');
});
document.getElementById('btn-heat-{{SLUG}}').addEventListener('click', e => {
  showHeat = !showHeat; e.currentTarget.setAttribute('aria-pressed', String(showHeat));
  if (showHeat && !heat) buildHeat();
  drawProver();
});

/* ---------- Figure 5 ---------- */
let KNET = 3;
const sk = document.getElementById('shrink-{{SLUG}}'), skg = sk.getContext('2d');
const SKS = sk.width, SKC = SKS / 2, SKSIDE = SKS * 0.62, SKGAP = SKS * 0.055;
const SKHR = SKS * 0.028;
let phiMode = 'none', phiShown = false, phiHot = false;

const phiInput = () => document.getElementById('phi-{{SLUG}}');
/* The unit square's angle. The slider covers the net's arc; the handle turns
   through the whole circle, and the slider then shows the arc angle the
   container's symmetry reduces the square to. */
let phiVal = (+phiInput().value / 10) * Math.PI / 180;
/* The slider moves in tenths of a degree, so an angle it sets is an exact
   number of degrees and the readout prints it as one; the handle turns to
   wherever the pointer is, and from then on the degree readouts are marked. */
let phiExact = true;
const phiNow = () => phiVal;
const arcOf = phi => { const psi = phi % (Math.PI / 2); return psi > Math.PI / 4 ? Math.PI / 2 - psi : psi; };
/* The handle rides the square's own top edge, so it turns with it. */
function phiHandlePoint(phi) {
  const r = SKSIDE / 2 + SKGAP;
  return [SKC - r * Math.sin(phi), SKC - r * Math.cos(phi)];
}
function skToCanvas(e) {
  const box = sk.getBoundingClientRect();
  return [(e.clientX - box.left) / box.width * SKS, (e.clientY - box.top) / box.height * SKS];
}
function overPhiHandle(cx, cy) {
  const [hx, hy] = phiHandlePoint(phiNow());
  return Math.hypot(cx - hx, cy - hy) <= SKHR * 2;
}
function setPhi(cx, cy) {
  const TAU = 2 * Math.PI;
  phiVal = ((Math.atan2(SKC - cx, SKC - cy) % TAU) + TAU) % TAU;
  phiExact = false;
  phiInput().value = String(Math.round(arcOf(phiVal) * 180 / Math.PI * 10));
  shrinkDraw();
}
sk.addEventListener('pointerdown', e => {
  const [cx, cy] = skToCanvas(e);
  if (!overPhiHandle(cx, cy)) return;
  phiMode = 'rotate'; sk.setPointerCapture(e.pointerId); setPhi(cx, cy);
});
sk.addEventListener('pointermove', e => {
  const [cx, cy] = skToCanvas(e);
  if (phiMode === 'rotate') { setPhi(cx, cy); return; }
  const hot = overPhiHandle(cx, cy);
  if (hot !== phiHot || !phiShown) { phiHot = hot; phiShown = true; shrinkDraw(); }
  sk.style.cursor = hot ? 'grab' : 'default';
});
sk.addEventListener('pointerup', () => { phiMode = 'none'; });
sk.addEventListener('pointercancel', () => { phiMode = 'none'; });
sk.addEventListener('pointerleave', () => {
  if (phiMode !== 'none') return;
  if (phiShown) { phiShown = false; phiHot = false; shrinkDraw(); }
});
function shrinkDraw() {
  const c = sk, g = skg, S = SKS;
  const phi = phiNow(), psi = phi % (Math.PI / 2), mirrored = psi > Math.PI / 4;
  const arc = arcOf(phi);
  let bestK = 0, bestD = Infinity;
  for (let k = 0; k <= KNET; k++) { const th = 2 * Math.atan(LIMIT * k / KNET);
    if (Math.abs(th - arc) < bestD) { bestD = Math.abs(th - arc); bestK = k; } }
  const theta = 2 * Math.atan(LIMIT * bestK / KNET), d = Math.abs(theta - arc);
  /* The net direction drawn inside the square is theta's image under the same
     symmetry that took phi to the arc, so the two squares stay together. */
  const thetaDrawn = (phi - psi) + (mirrored ? Math.PI / 2 - theta : theta);
  let D = 0;
  for (let k = 0; k < KNET; k++) { const a = LIMIT * k / KNET, b2 = LIMIT * (k + 1) / KNET;
    D = Math.max(D, (b2 - a) / (1 + a * b2)); }
  const Bk = Math.floor(1e7 / (1 + D) - 1) / 1e7;
  const prod = Bk * (Math.cos(d) + Math.sin(d));

  g.clearRect(0, 0, S, S);
  g.fillStyle = css('--kpress-doc-bg'); g.fillRect(0, 0, S, S);
  const sc = S * 0.62;
  g.save(); g.translate(S / 2, S / 2);
  g.save(); g.rotate(-phi);
  g.strokeStyle = css('--kpress-doc-border-hairline'); g.lineWidth = 3;
  g.strokeRect(-sc / 2, -sc / 2, sc, sc);
  g.restore();
  g.save(); g.rotate(-thetaDrawn);
  g.fillStyle = css('--cert-probe-wash'); g.globalAlpha = .8;
  g.fillRect(-Bk * sc / 2, -Bk * sc / 2, Bk * sc, Bk * sc); g.globalAlpha = 1;
  g.strokeStyle = css('--cert-probe'); g.lineWidth = 3;
  g.strokeRect(-Bk * sc / 2, -Bk * sc / 2, Bk * sc, Bk * sc);
  g.restore(); g.restore();

  if (phiShown) {
    const [hx, hy] = phiHandlePoint(phi);
    const ex = SKC - (SKSIDE / 2) * Math.sin(phi), ey = SKC - (SKSIDE / 2) * Math.cos(phi);
    g.strokeStyle = css('--kpress-doc-border-hairline'); g.lineWidth = 2;
    g.beginPath(); g.moveTo(ex, ey); g.lineTo(hx, hy); g.stroke();
    g.fillStyle = css('--kpress-doc-bg'); g.lineWidth = phiHot || phiMode === 'rotate' ? 3.5 : 2;
    g.beginPath(); g.arc(hx, hy, SKHR, 0, 6.2832); g.fill(); g.stroke();
  }

  /* What each of these six can and cannot claim: phi is exact while the slider
     owns it; theta is a net angle, exact only at zero; d is their difference,
     exact only when both are; D is a rational whose decimal does not
     terminate; Bk is a whole multiple of 1e-7 by construction, so seven places
     print it in full; and the product is irrational whatever the other two are. */
  const thetaExact = theta === 0, dExact = phiExact && thetaExact;
  tex(document.getElementById('s-phi-{{SLUG}}'),
      `${degTex(phi, 3, phiExact)}^{\\circ}` +
      (Math.abs(arc - phi) > 1e-9 ? ` \\equiv ${degTex(arc, 3, phiExact)}^{\\circ}` : ''));
  tex(document.getElementById('s-theta-{{SLUG}}'), `${degTex(theta, 3, thetaExact)}^{\\circ}`);
  tex(document.getElementById('s-d-{{SLUG}}'), `${degTex(d, 4, dExact)}^{\\circ}`);
  tex(document.getElementById('s-D-{{SLUG}}'), nearly(D.toFixed(7)));
  tex(document.getElementById('s-B-{{SLUG}}'), Bk.toFixed(7));
  const pe = document.getElementById('s-prod-{{SLUG}}');
  tex(pe, `\\approx ${prod.toFixed(6)} ${prod < 1 ? '\\lt' : '\\ge'} 1`);
  pe.style.color = prod < 1 ? '' : css('--kpress-doc-danger');
}
document.getElementById('phi-{{SLUG}}').addEventListener('input', e => {
  phiVal = (+e.target.value / 10) * Math.PI / 180; phiExact = true; shrinkDraw();
});
const knets = document.querySelectorAll('.cert-figure[data-cert="{{SLUG}}"] .knet');
knets.forEach(b => b.addEventListener('click', () => {
  knets.forEach(o => o.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true'); KNET = +b.dataset.k; shrinkDraw();
}));

/* ---------- boot ---------- */
function boot() { drawField(); refresh(true); shrinkDraw(); }
boot();
const repaint = () => { heat = null; boot(); };
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', repaint);
  /* A canvas is a bitmap, so print CSS cannot recolour one: a reader printing in
     dark mode would get three near-black squares on white paper. Redrawing once
     print media is active picks up the light tokens kpress forces for print. The
     media listener covers a headless render, `beforeprint` the print dialog, and
     `afterprint` puts the screen colours back. */
  const pm = window.matchMedia('print');
  if (pm.addEventListener) pm.addEventListener('change', repaint);
}
window.addEventListener('beforeprint', repaint);
window.addEventListener('afterprint', repaint);
})();
</script>
<!--END:SCRIPT-->
<script>
/* ---------- shared: static math, then the certificate picker ---------- */
(() => {
  const kern = s => String(s).replace(/(?<![A-Za-z\\])([a-z])\(/g, '$1\\mkern1mu(');
  const render = (el, s, d) => { try { katex.render(kern(s), el, { displayMode: !!d, throwOnError: false }); }
                                 catch (e) { el.textContent = s; } };
  document.querySelectorAll('.tex').forEach(el => {
    if (!el.dataset.done && !el.querySelector('.katex')) { el.dataset.done = '1'; render(el, el.textContent, false); }
  });
  document.querySelectorAll('.tex-d').forEach(el => {
    if (!el.dataset.done) { el.dataset.done = '1'; render(el, el.textContent, true); }
  });
  /* kpress's math markup: the TeX in .kpress-math-render is typeset in place
     and the element marked rendered, which is what shows it and hides the
     MathML that stands in when there is no script. */
  document.querySelectorAll('.kpress-math').forEach(el => {
    const box = el.querySelector('.kpress-math-render');
    if (!box || el.dataset.kpressMathRendered) return;
    const src = box.textContent.trim().replace(/^\\[(\[]/, '').replace(/\\[)\]]$/, '');
    render(box, src, el.dataset.kpressMath === 'display');
    el.dataset.kpressMathRendered = 'true';
  });
  document.documentElement.classList.add('math-ready');

  /* Footnote hover previews, kpress's own, bundled into this page. Booted after
     the static math so the preview clones already carry rendered formulas. */
  if (window.kpressInitTooltips) window.kpressInitTooltips(document, { only: "footnote" });
  if (window.kpressInitCodeCopy) window.kpressInitCodeCopy(document);

  /* One copy of each figure per certificate. The switch beside every figure
     shows one certificate's copies and records it in the hash, so a link can
     open the page on either; the figure the reader switched from stays where
     it was on screen. */
  const switches = [...document.querySelectorAll('.cert-toggle button')];
  const articles = [...document.querySelectorAll('.cert-figure')];
  const slugs = [...new Set(articles.map(a => a.dataset.cert))];
  const scroller = document.querySelector('[data-kpress-viewport]') || document.scrollingElement;
  const figureKey = el => { const f = el.closest('figure'); return f ? f.dataset.figure || null : null; };
  function show(slug, record, from) {
    if (!slugs.includes(slug)) slug = slugs[0];
    const key = from ? figureKey(from) : null, top = from ? from.getBoundingClientRect().top : 0;
    for (const a of articles) {
      const on = a.dataset.cert === slug;
      if (on && a.hidden) { a.hidden = false; a.classList.remove('swap'); void a.offsetWidth; a.classList.add('swap'); }
      else a.hidden = !on;
    }
    for (const b of switches) b.setAttribute('aria-pressed', String(b.dataset.cert === slug));
    if (key) {
      const twin = [...document.querySelectorAll('.cert-figure:not([hidden]) figure')].find(f => figureKey(f) === key);
      const button = twin && twin.querySelector('.cert-toggle button');
      if (button) scroller.scrollBy(0, button.getBoundingClientRect().top - top);
    }
    if (record && location.hash !== '#' + slug) history.replaceState(null, '', '#' + slug);
  }
  switches.forEach(b => b.addEventListener('click', () => show(b.dataset.cert, true, b)));
  /* The PDF chip prints the page. The print stylesheet turns it into a document:
     one certificate, no controls, link targets spelled out. */
  const printer = document.querySelector('[data-print="page"]');
  if (printer) printer.addEventListener('click', e => { e.preventDefault(); window.print(); });
  /* Only a hash naming a certificate switches the page. A footnote jump sets
     the hash too (#fn-3, #fnref-3), and it leaves the selection alone. */
  window.addEventListener('hashchange', () => {
    const slug = location.hash.slice(1);
    if (slugs.includes(slug)) show(slug, false);
  });
  show(location.hash.slice(1), false);
})();
</script>
